name: Build Turnip + Zink

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install NDK r28c
        run: |
          sdkmanager "ndk;28.2.13676358"

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3-venv \
            python3-pip \
            pkg-config \
            python3-mako \
            python3-yaml \
            python3-ply \
            bison \
            flex \
            gettext \
            git \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            libexpat1-dev \
            libelf-dev \
            libdrm-dev \
            zlib1g-dev \
            libzstd-dev \
            libxml2-dev \
            libarchive-dev \
            llvm-18 \
            llvm-18-dev \
            clang-18 \
            libclang-18-dev \
            libclang-cpp-dev \
            lld-18 \
            llvm-spirv-18 \
            libllvmspirvlib-18-dev \
            spirv-headers \
            spirv-tools

          python3 -m venv "$HOME/meson-venv"

          "$HOME/meson-venv/bin/pip" install --upgrade pip

          "$HOME/meson-venv/bin/pip" install \
            "meson>=1.4.0,<2.0" \
            packaging \
            Mako \
            PyYAML

          echo "$HOME/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Check host tools
        run: |
          echo "=== Meson ==="
          meson --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== Python ==="
          python3 --version

          echo "=== LLVM ==="
          /usr/bin/llvm-config-18 --version

          echo "=== Clang ==="
          /usr/bin/clang-18 --version

          echo "=== Clang libraries ==="
          dpkg -l | grep -E 'libclang|clang-18' || true

      - name: Clone Mesa
        run: |
          git clone \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            mesa

          cd mesa

          git checkout 8d68f369fc1a95bd701600f99b9c45d5da8e6068

      - name: Show Mesa version
        working-directory: mesa
        run: |
          echo "=== Mesa commit ==="
          git rev-parse HEAD

          echo "=== Mesa log ==="
          git log -1 --oneline

          echo "=== Mesa project ==="
          grep '^project(' meson.build | head -1

      # ============================================================
      # Build native Mesa compiler tools
      # ============================================================

      - name: Build native Mesa CLC compiler
        working-directory: mesa
        env:
          CC: /usr/bin/clang-18
          CXX: /usr/bin/clang++-18
          LLVM_CONFIG: /usr/bin/llvm-config-18
        run: |
          rm -rf build-compiler
          rm -rf "$GITHUB_WORKSPACE/mesa-compiler"

          meson setup build-compiler \
            --prefix "$GITHUB_WORKSPACE/mesa-compiler" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true

          meson compile -C build-compiler

          meson install -C build-compiler

      - name: Verify native Mesa CLC
        run: |
          echo "=== Installed Mesa compiler files ==="

          find "$GITHUB_WORKSPACE/mesa-compiler" \
            -maxdepth 4 \
            -type f \
            -print | sort

          echo "=== mesa_clc ==="

          test -x "$GITHUB_WORKSPACE/mesa-compiler/bin/mesa_clc"

          "$GITHUB_WORKSPACE/mesa-compiler/bin/mesa_clc" \
            --help >/dev/null

          echo "mesa_clc OK"

          echo "=== vtn_bindgen2 ==="

          if [ -x "$GITHUB_WORKSPACE/mesa-compiler/bin/vtn_bindgen2" ]; then
            "$GITHUB_WORKSPACE/mesa-compiler/bin/vtn_bindgen2" \
              --help >/dev/null || true

            echo "vtn_bindgen2 OK"
          else
            echo "vtn_bindgen2 not installed in compiler prefix"
          fi

      - name: Add native Mesa compiler to PATH
        run: |
          echo "$GITHUB_WORKSPACE/mesa-compiler/bin" >> "$GITHUB_PATH"

      - name: Check mesa compiler PATH
        run: |
          echo "=== mesa_clc ==="

          command -v mesa_clc

          mesa_clc --help >/dev/null

          echo "mesa_clc PATH OK"

          echo "=== vtn_bindgen2 ==="

          if command -v vtn_bindgen2 >/dev/null 2>&1; then
            command -v vtn_bindgen2
            vtn_bindgen2 --help >/dev/null || true
          else
            echo "vtn_bindgen2 not in PATH; continuing"
          fi

      # ============================================================
      # Android cross compilation
      # ============================================================

      - name: Create Android cross file
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          cat > android-aarch64.txt <<EOF
          [constants]
          ndk = '$NDK'

          [binaries]
          ar = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          c = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang'
          cpp = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++'
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          echo "=== Android cross file ==="
          cat android-aarch64.txt

      - name: Check Android compiler
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" \
            --version

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" \
            --version

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --version

      # ============================================================
      # Configure Mesa
      # ============================================================

      - name: Configure Mesa Android
        working-directory: mesa
        run: |
          rm -rf build

          meson setup build \
            --cross-file ../android-aarch64.txt \
            --prefix "$GITHUB_WORKSPACE/install" \
            --buildtype=release \
            --strip \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dspirv-tools=disabled \
            -Dshader-cache=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true

      - name: Show Mesa configuration
        working-directory: mesa
        run: |
          meson configure build

      # ============================================================
      # Build
      # ============================================================

      - name: Build Mesa
        working-directory: mesa
        run: |
          meson compile -C build -j2

      # ============================================================
      # Install
      # ============================================================

      - name: Install Mesa
        working-directory: mesa
        run: |
          rm -rf "$GITHUB_WORKSPACE/install"

          meson install -C build

      # ============================================================
      # Inspect installation
      # ============================================================

      - name: Inspect installed files
        run: |
          echo "============================================================"
          echo "ALL INSTALLED FILES"
          echo "============================================================"

          find "$GITHUB_WORKSPACE/install" \
            -type f \
            -print | sort

          echo
          echo "============================================================"
          echo "SHARED LIBRARIES"
          echo "============================================================"

          find "$GITHUB_WORKSPACE/install" \
            -type f \
            \( -name "*.so" -o -name "*.so.*" \) \
            -print | sort

      # ============================================================
      # Verify Turnip
      # ============================================================

      - name: Verify Turnip
        run: |
          TURNIP="$GITHUB_WORKSPACE/install/lib/libvulkan_freedreno.so"

          echo "============================================================"
          echo "VERIFY TURNIP"
          echo "============================================================"

          test -f "$TURNIP"

          echo "=== File ==="
          file "$TURNIP"

          echo
          echo "=== Architecture ==="
          readelf -h "$TURNIP" \
            | grep -E "Class|Machine"

          echo
          echo "=== Dynamic dependencies ==="
          readelf -d "$TURNIP" \
            | grep NEEDED || true

          echo
          echo "Turnip OK"

      # ============================================================
      # Verify Zink
      # ============================================================

      - name: Verify Zink
        run: |
          GALLIUM="$GITHUB_WORKSPACE/install/lib/libgallium_dri.so"

          echo "============================================================"
          echo "VERIFY ZINK"
          echo "============================================================"

          test -f "$GALLIUM"

          echo "=== File ==="
          file "$GALLIUM"

          echo
          echo "=== Architecture ==="
          readelf -h "$GALLIUM" \
            | grep -E "Class|Machine"

          echo
          echo "=== Dynamic dependencies ==="
          readelf -d "$GALLIUM" \
            | grep NEEDED || true

          echo
          echo "=== Zink strings ==="

          strings "$GALLIUM" \
            | grep -Ei \
              "mesa zink|ZINK_DEBUG|ZINK_DESCRIPTORS|zink" \
            | head -100 || true

          echo
          echo "Zink/Gallium OK"

      # ============================================================
      # Find libc++_shared.so from NDK
      # ============================================================

      - name: Locate Android libc++_shared.so
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          echo "=== Searching NDK for libc++_shared.so ==="

          find "$NDK" \
            -type f \
            -name "libc++_shared.so" \
            -print | sort

          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          echo
          echo "=== Expected ARM64 libc++_shared.so ==="
          echo "$LIBCXX"

          test -f "$LIBCXX"

          file "$LIBCXX"

          readelf -h "$LIBCXX" \
            | grep -E "Class|Machine"

          echo "libc++_shared.so OK"

      # ============================================================
      # Check required libraries before packaging
      # ============================================================

      - name: Check required libraries
        run: |
          INSTALL="$GITHUB_WORKSPACE/install"

          echo "============================================================"
          echo "CHECK REQUIRED MESA LIBRARIES"
          echo "============================================================"

          test -f "$INSTALL/lib/libvulkan_freedreno.so"
          test -f "$INSTALL/lib/libgallium_dri.so"
          test -f "$INSTALL/lib/libEGL.so"
          test -f "$INSTALL/lib/libGLESv2.so"

          echo "Turnip:  OK"
          echo "Gallium: OK"
          echo "EGL:     OK"
          echo "GLESv2:  OK"

      # ============================================================
      # Package
      # ============================================================

      - name: Package Turnip + Zink
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          INSTALL="$GITHUB_WORKSPACE/install"

          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          rm -rf "$GITHUB_WORKSPACE/artifact"

          mkdir -p \
            "$GITHUB_WORKSPACE/artifact/lib/dri"

          # --------------------------------------------------------
          # Turnip
          # --------------------------------------------------------

          cp \
            "$INSTALL/lib/libvulkan_freedreno.so" \
            "$GITHUB_WORKSPACE/artifact/libvulkan_freedreno.so"

          # --------------------------------------------------------
          # Mesa EGL
          # --------------------------------------------------------

          if [ -f "$INSTALL/lib/libEGL.so" ]; then
            cp \
              "$INSTALL/lib/libEGL.so" \
              "$GITHUB_WORKSPACE/artifact/libEGL.so"
          fi

          # --------------------------------------------------------
          # Mesa GLESv2
          # --------------------------------------------------------

          if [ -f "$INSTALL/lib/libGLESv2.so" ]; then
            cp \
              "$INSTALL/lib/libGLESv2.so" \
              "$GITHUB_WORKSPACE/artifact/libGLESv2.so"
          fi

          # --------------------------------------------------------
          # IMPORTANT:
          # libEGL.so and libGLESv2.so from this build depend on
          # libgallium_dri.so.
          #
          # Keep the original library AND provide zink_dri.so
          # for DRI-style lookup.
          # --------------------------------------------------------

          cp \
            "$INSTALL/lib/libgallium_dri.so" \
            "$GITHUB_WORKSPACE/artifact/libgallium_dri.so"

          cp \
            "$INSTALL/lib/libgallium_dri.so" \
            "$GITHUB_WORKSPACE/artifact/lib/dri/zink_dri.so"

          # Also place a copy beside the DRI driver for compatibility
          # with loaders that search the DRI directory first.

          cp \
            "$INSTALL/lib/libgallium_dri.so" \
            "$GITHUB_WORKSPACE/artifact/lib/dri/libgallium_dri.so"

          # --------------------------------------------------------
          # Other Mesa dependencies
          # --------------------------------------------------------

          for f in \
            libglapi.so \
            libexpat.so \
            libxml2.so
          do
            if [ -f "$INSTALL/lib/$f" ]; then
              cp \
                "$INSTALL/lib/$f" \
                "$GITHUB_WORKSPACE/artifact/$f"
            fi
          done

          # --------------------------------------------------------
          # Android C++ runtime
          # --------------------------------------------------------

          test -f "$LIBCXX"

          cp \
            "$LIBCXX" \
            "$GITHUB_WORKSPACE/artifact/libc++_shared.so"

          # --------------------------------------------------------
          # Show artifact
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo "ARTIFACT FILES"
          echo "============================================================"

          find "$GITHUB_WORKSPACE/artifact" \
            -type f \
            -print | sort

          echo
          echo "============================================================"
          echo "ARTIFACT SIZE"
          echo "============================================================"

          du -ah "$GITHUB_WORKSPACE/artifact" \
            | sort -h

          echo
          echo "============================================================"
          echo "ARTIFACT ARCHITECTURES"
          echo "============================================================"

          find "$GITHUB_WORKSPACE/artifact" \
            -type f \
            -name "*.so" \
            -print0 \
            | xargs -0 -r file

          # --------------------------------------------------------
          # Metadata
          # --------------------------------------------------------

          cat > "$GITHUB_WORKSPACE/artifact/meta.json" <<'EOF'
          {
            "schemaVersion": 1,
            "name": "MyTurnipZink",
            "description": "Mesa Turnip Vulkan driver + Zink OpenGL renderer for Adreno",
            "author": "IO-MC",
            "packageVersion": "6",
            "vendor": "Mesa",
            "driverVersion": "Mesa 26.3.0-devel",
            "mesaCommit": "8d68f369fc1a95bd701600f99b9c45d5da8e6068",
            "minApi": 33,
            "architecture": "arm64-v8a",
            "libraryName": "libvulkan_freedreno.so",
            "renderer": "zink",
            "vulkanDriver": "freedreno",
            "freedrenoKmd": "kgsl"
          }
          EOF

          echo
          echo "============================================================"
          echo "META.JSON"
          echo "============================================================"

          cat "$GITHUB_WORKSPACE/artifact/meta.json"

          # --------------------------------------------------------
          # Create final ZIP
          # --------------------------------------------------------

          cd "$GITHUB_WORKSPACE/artifact"

          zip -9 -r \
            "$GITHUB_WORKSPACE/MyTurnipZink-TurnipZink.zip" \
            .

          echo
          echo "============================================================"
          echo "FINAL ZIP"
          echo "============================================================"

          ls -lh \
            "$GITHUB_WORKSPACE/MyTurnipZink-TurnipZink.zip"

      # ============================================================
      # Final verification of ZIP
      # ============================================================

      - name: Verify final ZIP
        run: |
          ZIP="$GITHUB_WORKSPACE/MyTurnipZink-TurnipZink.zip"

          echo "============================================================"
          echo "FINAL ZIP CONTENTS"
          echo "============================================================"

          unzip -l "$ZIP"

          echo
          echo "============================================================"
          echo "CHECK REQUIRED FILES IN ZIP"
          echo "============================================================"

          unzip -l "$ZIP" \
            | grep -F "libvulkan_freedreno.so"

          unzip -l "$ZIP" \
            | grep -F "libgallium_dri.so"

          unzip -l "$ZIP" \
            | grep -F "lib/dri/zink_dri.so"

          unzip -l "$ZIP" \
            | grep -F "libEGL.so"

          unzip -l "$ZIP" \
            | grep -F "libGLESv2.so"

          unzip -l "$ZIP" \
            | grep -F "libc++_shared.so"

          echo
          echo "Final ZIP verification OK"

      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload Turnip + Zink artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-TurnipZink
          path: MyTurnipZink-TurnipZink.zip
          if-no-files-found: error
