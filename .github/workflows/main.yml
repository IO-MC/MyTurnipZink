name: Build MyTurnipZink Renderer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. Checkout this repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      # ============================================================
      # 3. Build dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3-venv \
            python3-pip \
            pkg-config \
            python3-mako \
            python3-yaml \
            python3-ply \
            bison \
            flex \
            gettext \
            git \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            unzip \
            zip \
            patchelf \
            libexpat1-dev \
            libelf-dev \
            libdrm-dev \
            zlib1g-dev \
            libzstd-dev \
            libxml2-dev \
            libarchive-dev \
            llvm-18 \
            llvm-18-dev \
            clang-18 \
            libclang-18-dev \
            libclang-cpp-dev \
            lld-18 \
            llvm-spirv-18 \
            libllvmspirvlib-18-dev \
            spirv-headers \
            spirv-tools

          python3 -m venv "$HOME/meson-venv"

          "$HOME/meson-venv/bin/pip" install --upgrade pip

          "$HOME/meson-venv/bin/pip" install \
            "meson>=1.4.0,<2.0" \
            packaging \
            Mako \
            PyYAML

          echo "$HOME/meson-venv/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 4. Check tools
      # ============================================================

      - name: Check build environment
        run: |
          echo "=== Meson ==="
          meson --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== Python ==="
          python3 --version

          echo "=== LLVM ==="
          /usr/bin/llvm-config-18 --version

          echo "=== Clang ==="
          /usr/bin/clang-18 --version

          echo "=== Java ==="
          java -version

      # ============================================================
      # 5. Clone Mesa
      # ============================================================

      - name: Clone Mesa
        run: |
          git clone \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            mesa

          cd mesa

          git checkout 8d68f369fc1a95bd701600f99b9c45d5da8e6068

      - name: Show Mesa version
        working-directory: mesa
        run: |
          echo "=== Mesa commit ==="
          git rev-parse HEAD

          echo "=== Mesa log ==="
          git log -1 --oneline

          echo "=== Mesa project ==="
          grep '^project(' meson.build | head -1

      # ============================================================
      # 6. Build native Mesa compiler
      # ============================================================

      - name: Build native Mesa CLC compiler
        working-directory: mesa
        env:
          CC: /usr/bin/clang-18
          CXX: /usr/bin/clang++-18
          LLVM_CONFIG: /usr/bin/llvm-config-18
        run: |
          rm -rf build-compiler
          rm -rf "$GITHUB_WORKSPACE/mesa-compiler"

          meson setup build-compiler \
            --prefix "$GITHUB_WORKSPACE/mesa-compiler" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true

          meson compile -C build-compiler

          meson install -C build-compiler

      - name: Verify native Mesa CLC
        run: |
          echo "=== Mesa compiler files ==="

          find "$GITHUB_WORKSPACE/mesa-compiler" \
            -maxdepth 4 \
            -type f \
            -print | sort

          echo "=== mesa_clc ==="

          test -x "$GITHUB_WORKSPACE/mesa-compiler/bin/mesa_clc"

          "$GITHUB_WORKSPACE/mesa-compiler/bin/mesa_clc" \
            --help >/dev/null

          echo "mesa_clc OK"

          echo "=== vtn_bindgen2 ==="

          if [ -x "$GITHUB_WORKSPACE/mesa-compiler/bin/vtn_bindgen2" ]; then
            "$GITHUB_WORKSPACE/mesa-compiler/bin/vtn_bindgen2" \
              --help >/dev/null || true

            echo "vtn_bindgen2 OK"
          else
            echo "vtn_bindgen2 not installed"
          fi

      - name: Add Mesa compiler to PATH
        run: |
          echo "$GITHUB_WORKSPACE/mesa-compiler/bin" >> "$GITHUB_PATH"

      - name: Check Mesa compiler PATH
        run: |
          command -v mesa_clc
          mesa_clc --help >/dev/null
          echo "mesa_clc PATH OK"

          if command -v vtn_bindgen2 >/dev/null 2>&1; then
            command -v vtn_bindgen2
          else
            echo "vtn_bindgen2 not in PATH"
          fi

      # ============================================================
      # 7. Android cross file
      # ============================================================

      - name: Create Android cross file
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          cat > android-aarch64.txt <<EOF
          [constants]
          ndk = '$NDK'

          [binaries]
          ar = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          c = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang'
          cpp = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++'
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat android-aarch64.txt

      - name: Check Android compiler
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" \
            --version

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" \
            --version

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --version

      # ============================================================
      # 8. Configure Mesa
      # ============================================================

      - name: Configure Mesa Android
        working-directory: mesa
        run: |
          rm -rf build

          meson setup build \
            --cross-file ../android-aarch64.txt \
            --prefix "$GITHUB_WORKSPACE/install" \
            --buildtype=release \
            --strip \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dopengl=true \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dspirv-tools=disabled \
            -Dshader-cache=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true

      - name: Show Mesa configuration
        working-directory: mesa
        run: |
          meson configure build

      # ============================================================
      # 9. Build Mesa
      # ============================================================

      - name: Build Mesa
        working-directory: mesa
        run: |
          meson compile -C build -j2

      # ============================================================
      # 10. Install Mesa
      # ============================================================

      - name: Install Mesa
        working-directory: mesa
        run: |
          rm -rf "$GITHUB_WORKSPACE/install"

          meson install -C build

      # ============================================================
      # 11. Inspect Mesa output
      # ============================================================

      - name: Inspect Mesa output
        run: |
          echo "============================================================"
          echo "INSTALLED FILES"
          echo "============================================================"

          find "$GITHUB_WORKSPACE/install" \
            -type f \
            -print | sort

          echo
          echo "============================================================"
          echo "SHARED LIBRARIES"
          echo "============================================================"

          find "$GITHUB_WORKSPACE/install" \
            -type f \
            \( -name "*.so" -o -name "*.so.*" \) \
            -print | sort

      # ============================================================
      # 12. Verify Turnip
      # ============================================================

      - name: Verify Turnip
        run: |
          TURNIP="$GITHUB_WORKSPACE/install/lib/libvulkan_freedreno.so"

          test -f "$TURNIP"

          echo "=== Turnip ==="
          file "$TURNIP"

          echo
          echo "=== Architecture ==="
          readelf -h "$TURNIP" \
            | grep -E "Class|Machine"

          echo
          echo "=== Dependencies ==="
          readelf -d "$TURNIP" \
            | grep NEEDED || true

          echo
          echo "=== SONAME ==="
          readelf -d "$TURNIP" \
            | grep SONAME || true

          echo
          echo "Turnip OK"

      # ============================================================
      # 13. Verify Zink
      # ============================================================

      - name: Verify Zink
        run: |
          GALLIUM="$GITHUB_WORKSPACE/install/lib/libgallium_dri.so"

          test -f "$GALLIUM"

          echo "=== Gallium/Zink ==="
          file "$GALLIUM"

          echo
          echo "=== Architecture ==="
          readelf -h "$GALLIUM" \
            | grep -E "Class|Machine"

          echo
          echo "=== Dependencies ==="
          readelf -d "$GALLIUM" \
            | grep NEEDED || true

          echo
          echo "=== SONAME ==="
          readelf -d "$GALLIUM" \
            | grep SONAME || true

          echo
          echo "=== Zink strings ==="

          strings "$GALLIUM" \
            | grep -Ei \
              "mesa zink|ZINK_DEBUG|ZINK_DESCRIPTORS|zink" \
            | head -100 || true

          echo
          echo "Zink OK"

      # ============================================================
      # 14. Prepare renderer libraries
      # ============================================================

      - name: Prepare renderer libraries
        run: |
          INSTALL="$GITHUB_WORKSPACE/install"

          rm -rf "$GITHUB_WORKSPACE/renderer-libs"

          mkdir -p "$GITHUB_WORKSPACE/renderer-libs"

          # --------------------------------------------------------
          # Turnip
          # --------------------------------------------------------

          cp \
            "$INSTALL/lib/libvulkan_freedreno.so" \
            "$GITHUB_WORKSPACE/renderer-libs/libvulkan_freedreno.so"

          # --------------------------------------------------------
          # Mesa EGL
          #
          # Zalith's Zink path expects libEGL_mesa.so.
          # Keep libEGL.so as well for dependency compatibility.
          # --------------------------------------------------------

          cp \
            "$INSTALL/lib/libEGL.so" \
            "$GITHUB_WORKSPACE/renderer-libs/libEGL.so"

          cp \
            "$INSTALL/lib/libEGL.so" \
            "$GITHUB_WORKSPACE/renderer-libs/libEGL_mesa.so"

          # --------------------------------------------------------
          # Mesa GLES
          # --------------------------------------------------------

          cp \
            "$INSTALL/lib/libGLESv2.so" \
            "$GITHUB_WORKSPACE/renderer-libs/libGLESv2.so"

          # --------------------------------------------------------
          # Gallium driver
          #
          # Keep original libgallium_dri.so because libEGL.so
          # has a DT_NEEDED dependency on this exact name.
          # Also provide zink_dri.so for Mesa DRI lookup.
          # --------------------------------------------------------

          cp \
            "$INSTALL/lib/libgallium_dri.so" \
            "$GITHUB_WORKSPACE/renderer-libs/libgallium_dri.so"

          cp \
            "$INSTALL/lib/libgallium_dri.so" \
            "$GITHUB_WORKSPACE/renderer-libs/zink_dri.so"

          # --------------------------------------------------------
          # Mesa dependencies
          # --------------------------------------------------------

          for f in \
            libglapi.so \
            libexpat.so \
            libxml2.so
          do
            if [ -f "$INSTALL/lib/$f" ]; then
              cp \
                "$INSTALL/lib/$f" \
                "$GITHUB_WORKSPACE/renderer-libs/$f"
            fi
          done

          # --------------------------------------------------------
          # libc++ runtime from NDK r28c
          # --------------------------------------------------------

          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -f "$LIBCXX"

          cp \
            "$LIBCXX" \
            "$GITHUB_WORKSPACE/renderer-libs/libc++_shared.so"

          echo
          echo "============================================================"
          echo "RENDERER LIBRARIES"
          echo "============================================================"

          find "$GITHUB_WORKSPACE/renderer-libs" \
            -type f \
            -print | sort

          echo
          echo "============================================================"
          echo "ARCHITECTURES"
          echo "============================================================"

          find "$GITHUB_WORKSPACE/renderer-libs" \
            -type f \
            -name "*.so" \
            -print0 \
            | xargs -0 -r file

      # ============================================================
      # 15. Inspect Android dependencies
      # ============================================================

      - name: Inspect renderer dependencies
        run: |
          echo "============================================================"
          echo "TURNIP DEPENDENCIES"
          echo "============================================================"

          readelf -d \
            "$GITHUB_WORKSPACE/renderer-libs/libvulkan_freedreno.so" \
            | grep NEEDED || true

          echo
          echo "============================================================"
          echo "GALLIUM DEPENDENCIES"
          echo "============================================================"

          readelf -d \
            "$GITHUB_WORKSPACE/renderer-libs/libgallium_dri.so" \
            | grep NEEDED || true

          echo
          echo "============================================================"
          echo "EGL DEPENDENCIES"
          echo "============================================================"

          readelf -d \
            "$GITHUB_WORKSPACE/renderer-libs/libEGL_mesa.so" \
            | grep NEEDED || true

      # ============================================================
      # 16. Clone current RendererPlugin-v2
      # ============================================================

      - name: Clone RendererPlugin-v2
        run: |
          rm -rf "$GITHUB_WORKSPACE/RendererPlugin-v2"

          git clone \
            --depth 1 \
            https://github.com/ZalithLauncher/RendererPlugin-v2.git \
            "$GITHUB_WORKSPACE/RendererPlugin-v2"

          cd "$GITHUB_WORKSPACE/RendererPlugin-v2"

          echo "=== RendererPlugin-v2 commit ==="
          git rev-parse HEAD

          echo "=== RendererPlugin-v2 log ==="
          git log -1 --oneline

      # ============================================================
      # 17. Prepare APK native libraries
      # ============================================================

      - name: Copy libraries into RendererPlugin-v2
        run: |
          JNI="$GITHUB_WORKSPACE/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          rm -rf "$JNI"

          mkdir -p "$JNI"

          cp \
            "$GITHUB_WORKSPACE/renderer-libs/"*.so \
            "$JNI/"

          echo "============================================================"
          echo "APK NATIVE LIBRARIES"
          echo "============================================================"

          find "$JNI" \
            -type f \
            -print | sort

          echo
          echo "============================================================"
          echo "APK NATIVE LIBRARY ARCHITECTURES"
          echo "============================================================"

          find "$JNI" \
            -type f \
            -name "*.so" \
            -print0 \
            | xargs -0 -r file

      # ============================================================
      # 18. Replace renderer configuration in build.gradle.kts
      # ============================================================

      - name: Configure MyTurnipZink renderer
        working-directory: RendererPlugin-v2
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          start = text.find("renderer(")

          if start == -1:
              raise SystemExit(
                  "ERROR: renderer(...) block was not found in app/build.gradle.kts"
              )

          depth = 0
          quote = None
          triple_quote = False
          line_comment = False
          block_comment = False
          escape = False
          end = None

          i = start

          while i < len(text):
              ch = text[i]
              nxt = text[i + 1] if i + 1 < len(text) else ""

              if line_comment:
                  if ch == "\n":
                      line_comment = False
                  i += 1
                  continue

              if block_comment:
                  if ch == "*" and nxt == "/":
                      block_comment = False
                      i += 2
                      continue
                  i += 1
                  continue

              if quote is None:
                  if ch == "/" and nxt == "/":
                      line_comment = True
                      i += 2
                      continue

                  if ch == "/" and nxt == "*":
             
