name: Build Turnip + Zink

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Android SDK + NDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install NDK r28c
        run: |
          sdkmanager "ndk;28.2.13676358"


      # ============================================================
      # 3. Host build dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-pip \
            pkg-config \
            python3-mako \
            python3-yaml \
            python3-ply \
            bison \
            flex \
            gettext \
            git \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            libexpat1-dev \
            libelf-dev \
            libdrm-dev \
            zlib1g-dev \
            libzstd-dev \
            libxml2-dev \
            libarchive-dev \
            llvm-18 \
            llvm-18-dev \
            clang-18 \
            libclang-18-dev \
            libclang-cpp-dev \
            lld-18 \
            llvm-spirv-18 \
            libllvmspirvlib-18-dev \
            spirv-headers \
            spirv-tools

          python3 -m venv "$HOME/meson-venv"
          "$HOME/meson-venv/bin/pip" install --upgrade pip
          "$HOME/meson-venv/bin/pip" install \
            "meson>=1.4.0,<2.0" \
            packaging \
            Mako \
            PyYAML

          echo "$HOME/meson-venv/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 4. Check host tools
      # ============================================================

      - name: Check host tools
        run: |
          echo "=== Meson ==="
          meson --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== Python ==="
          python3 --version

          echo "=== LLVM ==="
          /usr/bin/llvm-config-18 --version

          echo "=== Clang ==="
          /usr/bin/clang-18 --version


      # ============================================================
      # 5. Clone exact Mesa commit
      # ============================================================

      - name: Clone Mesa
        run: |
          git clone \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            mesa

          cd mesa

          git checkout 8d68f369fc1a95bd701600f99b9c45d5da8e6068


      # ============================================================
      # 6. Verify Mesa version
      # ============================================================

      - name: Show Mesa version
        working-directory: mesa
        run: |
          echo "=== Mesa commit ==="
          git rev-parse HEAD

          echo "=== Mesa log ==="
          git log -1 --oneline

          echo "=== Mesa project ==="
          grep '^project(' meson.build | head -1


      # ============================================================
      # 7. Build native mesa_clc
      #
      # IMPORTANT:
      # This is an x86_64 HOST executable.
      # It is NOT the Android renderer.
      #
      # Mesa's Android documentation recommends preparing
      # mesa_clc on the host before the Android cross-build.
      # ============================================================

      - name: Build native Mesa CLC compiler
        working-directory: mesa
        env:
          CC: /usr/bin/clang-18
          CXX: /usr/bin/clang++-18
          LLVM_CONFIG: /usr/bin/llvm-config-18
        run: |
          rm -rf build-compiler
          rm -rf "$GITHUB_WORKSPACE/mesa-compiler"

          meson setup build-compiler \
            --prefix "$GITHUB_WORKSPACE/mesa-compiler" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true

          meson compile -C build-compiler

          meson install -C build-compiler


      # ============================================================
      # 8. Verify native mesa_clc
      # ============================================================

      - name: Verify native Mesa CLC
        run: |
          echo "=== Installed Mesa compiler files ==="

          find "$GITHUB_WORKSPACE/mesa-compiler" \
            -maxdepth 3 \
            -type f \
            -print | sort

          echo "=== mesa_clc ==="

          test -x "$GITHUB_WORKSPACE/mesa-compiler/bin/mesa_clc"

          "$GITHUB_WORKSPACE/mesa-compiler/bin/mesa_clc" \
            --help >/dev/null

          echo "mesa_clc OK"


      # ============================================================
      # 9. Add native Mesa compiler to PATH
      # ============================================================

      - name: Add native Mesa compiler to PATH
        run: |
          echo "$GITHUB_WORKSPACE/mesa-compiler/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 10. Verify native compiler in PATH
      # ============================================================

      - name: Check mesa_clc PATH
        run: |
          echo "=== mesa_clc ==="
          command -v mesa_clc

          mesa_clc --help >/dev/null

          echo "=== vtn_bindgen2 ==="

          if command -v vtn_bindgen2 >/dev/null 2>&1; then
            command -v vtn_bindgen2
            vtn_bindgen2 --help >/dev/null || true
          else
            echo "vtn_bindgen2 not installed; continuing"
          fi


      # ============================================================
      # 11. Create Android cross file
      #
      # Based on Mesa Android cross-compilation model.
      # ============================================================

      - name: Create Android cross file
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          cat > android-aarch64.txt <<EOF
          [constants]
          ndk = '$NDK'

          [binaries]
          ar = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          c = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang'
          cpp = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++'
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          echo "=== Android cross file ==="
          cat android-aarch64.txt


      # ============================================================
      # 12. Configure Android Mesa
      #
      # IMPORTANT:
      # mesa-clc=system
      #
      # This tells Mesa to use the HOST mesa_clc prepared above.
      # It prevents CLC from forcing TARGET LLVM into the
      # Android build.
      #
      # Turnip:
      #   vulkan-drivers=freedreno
      #
      # KGSL:
      #   freedreno-kmds=kgsl
      #
      # Zink:
      #   gallium-drivers=zink
      # ============================================================

      - name: Configure Mesa Android
        working-directory: mesa
        run: |
          rm -rf build

          meson setup build \
            --cross-file ../android-aarch64.txt \
            --prefix "$GITHUB_WORKSPACE/install" \
            --buildtype=release \
            --strip \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dspirv-tools=disabled \
            -Dshader-cache=disabled \
            -Dzstd=disabled \
            -Dzlib=disabled \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true


      # ============================================================
      # 13. Show final Mesa configuration
      # ============================================================

      - name: Show Mesa configuration
        working-directory: mesa
        run: |
          meson configure build


      # ============================================================
      # 14. Build Mesa
      # ============================================================

      - name: Build Mesa
        working-directory: mesa
        run: |
          meson compile -C build -j2


      # ============================================================
      # 15. Install Mesa
      # ============================================================

      - name: Install Mesa
        working-directory: mesa
        run: |
          meson install -C build


      # ============================================================
      # 16. Inspect installed files
      # ============================================================

      - name: Inspect installed files
        run: |
          echo "=== All installed files ==="

          find "$GITHUB_WORKSPACE/install" \
            -type f \
            -print | sort

          echo "=== Shared libraries ==="

          find "$GITHUB_WORKSPACE/install" \
            -type f \
            \( -name "*.so" -o -name "*.so.*" \) \
            -print | sort


      # ============================================================
      # 17. Verify Turnip
      # ============================================================

      - name: Verify Turnip
        run: |
          TURNIP="$GITHUB_WORKSPACE/install/lib/libvulkan_freedreno.so"

          test -f "$TURNIP"

          echo "=== Turnip file ==="
          file "$TURNIP"

          echo "=== Turnip architecture ==="
          readelf -h "$TURNIP" | grep -E \
            "Class|Machine"

          echo "=== Turnip dynamic dependencies ==="
          readelf -d "$TURNIP" || true


      # ============================================================
      # 18. Verify Zink
      # ============================================================

      - name: Verify Zink
        run: |
          ZINK="$GITHUB_WORKSPACE/install/lib/libgallium_dri.so"

          test -f "$ZINK"

          echo "=== Zink/Gallium file ==="
          file "$ZINK"

          echo "=== Zink strings ==="

          strings "$ZINK" \
            | grep -Ei "mesa zink|ZINK_DEBUG|ZINK_DESCRIPTORS" \
            | head -50 || true


      # ============================================================
      # 19. Package Turnip + Zink
      # ============================================================

      - name: Package Turnip + Zink
        run: |
          rm -rf artifact

          mkdir -p artifact/lib/dri


          # --------------------------------------------------------
          # Turnip
          # --------------------------------------------------------

          cp \
            "$GITHUB_WORKSPACE/install/lib/libvulkan_freedreno.so" \
            artifact/libvulkan_freedreno.so


          # --------------------------------------------------------
          # EGL
          # --------------------------------------------------------

          if [ -f "$GITHUB_WORKSPACE/install/lib/libEGL.so" ]; then
            cp \
              "$GITHUB_WORKSPACE/install/lib/libEGL.so" \
              artifact/libEGL.so
          fi


          # --------------------------------------------------------
          # GLES2
          # --------------------------------------------------------

          if [ -f "$GITHUB_WORKSPACE/install/lib/libGLESv2.so" ]; then
            cp \
              "$GITHUB_WORKSPACE/install/lib/libGLESv2.so" \
              artifact/libGLESv2.so
          fi


          # --------------------------------------------------------
          # Zink/Gallium
          # --------------------------------------------------------

          cp \
            "$GITHUB_WORKSPACE/install/lib/libgallium_dri.so" \
            artifact/lib/dri/zink_dri.so


          # --------------------------------------------------------
          # Supporting libraries
          # --------------------------------------------------------

          for f in \
            libglapi.so \
            libexpat.so \
            libxml2.so
          do
            if [ -f "$GITHUB_WORKSPACE/install/lib/$f" ]; then
              cp \
                "$GITHUB_WORKSPACE/install/lib/$f" \
                "artifact/$f"
            fi
          done


          # --------------------------------------------------------
          # Show artifact
          # --------------------------------------------------------

          echo "=== Artifact files ==="

          find artifact \
            -type f \
            -print | sort


          # --------------------------------------------------------
          # Check architecture
          # --------------------------------------------------------

          echo "=== Artifact architectures ==="

          find artifact \
            -type f \
            -name "*.so" \
            -print0 \
            | xargs -0 file


          # --------------------------------------------------------
          # Metadata
          # --------------------------------------------------------

          cat > artifact/meta.json <<'EOF'
          {
            "schemaVersion": 1,
            "name": "MyTurnipZink",
            "description": "Mesa Turnip Vulkan driver + Zink OpenGL renderer for Adreno",
            "author": "IO-MC",
            "packageVersion": "5",
            "vendor": "Mesa",
            "driverVersion": "Mesa 26.3.0-devel",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF


          # --------------------------------------------------------
          # ZIP
          # --------------------------------------------------------

          cd artifact

          zip -9 -r \
            ../MyTurnipZink-TurnipZink.zip \
            .


      # ============================================================
      # 20. Upload artifact
      # ============================================================

      - name: Upload Turnip + Zink artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-TurnipZink
          path: MyTurnipZink-TurnipZink.zip
