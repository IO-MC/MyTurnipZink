name: Build MyTurnipZink

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_COMMIT: 8d68f369fc1
  ANDROID_API: 33
  ANDROID_NDK_VERSION: 28.2.13676358

  WORK_ROOT: ${{ github.workspace }}
  MESA_DIR: ${{ github.workspace }}/mesa
  MESA_COMPILER_DIR: ${{ github.workspace }}/mesa-compiler
  MESA_INSTALL_DIR: ${{ github.workspace }}/install
  MESON_VENV: ${{ github.workspace }}/meson-venv

jobs:
  build:
    name: Build Mesa Zink + Turnip
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            llvm-dev \
            libclang-18-dev \
            pkg-config \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            bison \
            flex \
            gettext \
            glslang-tools \
            libdrm-dev \
            libexpat1-dev \
            libelf-dev \
            libxml2-dev \
            libarchive-dev \
            ninja-build \
            unzip \
            zip \
            wget \
            git

          rm -rf "$MESON_VENV"

          python3 -m venv "$MESON_VENV"

          "$MESON_VENV/bin/python" -m pip install --upgrade pip

          "$MESON_VENV/bin/python" -m pip install \
            "meson>=1.4,<2.0" \
            "mako>=1.2" \
            "PyYAML"

          echo "$MESON_VENV/bin" >> "$GITHUB_PATH"

          echo "VIRTUAL_ENV=$MESON_VENV" >> "$GITHUB_ENV"
          echo "PATH=$MESON_VENV/bin:$PATH" >> "$GITHUB_ENV"

          "$MESON_VENV/bin/meson" --version

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"

          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -u+x | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -u+x | head -n 1)"

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-33"
          "$SDKMANAGER" "build-tools;35.0.0"
          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}"

      - name: Export Android NDK environment
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          python --version
          meson --version
          "$MESON_VENV/bin/meson" --version

          "$MESON_VENV/bin/python" -c "import mako; print('Mako:', mako.__version__)"
          "$MESON_VENV/bin/python" -c "import yaml; print('PyYAML:', yaml.__version__)"

          ninja --version
          clang --version | head -n 1
          java -version
          echo "$ANDROID_NDK_HOME"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" \
            --version | head -n 1

      - name: Clone Mesa
        run: |
          rm -rf "$MESA_DIR"

          git clone \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            "$MESA_DIR"

          cd "$MESA_DIR"

          git checkout "$MESA_COMMIT"

          git rev-parse HEAD
          git describe --always --tags --dirty || true

      - name: Prepare Mesa native compiler
        run: |
          rm -rf "$MESA_COMPILER_DIR"

          "$MESON_VENV/bin/meson" setup "$MESA_COMPILER_DIR" "$MESA_DIR" \
            --prefix="$MESA_COMPILER_DIR/install" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dllvm=enabled \
            -Dbuild-tests=false

          "$MESON_VENV/bin/meson" compile \
            -C "$MESA_COMPILER_DIR" \
            -j "$(nproc)"

          "$MESON_VENV/bin/meson" install \
            -C "$MESA_COMPILER_DIR"

      - name: Add native Mesa compiler to PATH
        run: |
          echo "$MESA_COMPILER_DIR/bin" >> "$GITHUB_PATH"

          test -x "$MESA_COMPILER_DIR/bin/mesa_clc"

          "$MESA_COMPILER_DIR/bin/mesa_clc" --help >/dev/null || true

      - name: Prepare Mesa dependencies
        run: |
          rm -f "$MESA_DIR/subprojects/libarchive.wrap"

      - name: Create Android cross file
        run: |
          cat > "$WORK_ROOT/android-aarch64.txt" <<EOF
          [binaries]
          c = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          ranlib = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
          ld = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Create native Meson file
        run: |
          cat > "$WORK_ROOT/native.txt" <<EOF
          [binaries]
          c = '/usr/bin/clang'
          cpp = '/usr/bin/clang++'
          ar = '/usr/bin/llvm-ar'
          strip = '/usr/bin/llvm-strip'
          ranlib = '/usr/bin/llvm-ranlib'
          ld = '/usr/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'
          python = '$MESON_VENV/bin/python'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

      - name: Configure Mesa
        working-directory: ${{ env.MESA_DIR }}
        run: |
          rm -rf build

          "$MESON_VENV/bin/meson" setup build \
            --cross-file "$WORK_ROOT/android-aarch64.txt" \
            --native-file "$WORK_ROOT/native.txt" \
            --prefix "$MESA_INSTALL_DIR" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version="$ANDROID_API" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Degl-lib-suffix=_mesa \
            -Dgles-lib-suffix=_mesa \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dspirv-tools=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dshader-cache=disabled \
            -Dbuild-tests=false

      - name: Show Mesa configuration
        working-directory: ${{ env.MESA_DIR }}
        run: |
          "$MESON_VENV/bin/meson" configure build

      - name: Build Mesa
        working-directory: ${{ env.MESA_DIR }}
        run: |
          "$MESON_VENV/bin/meson" compile \
            -C build \
            -j "$(nproc)"

      - name: Install Mesa
        working-directory: ${{ env.MESA_DIR }}
        run: |
          "$MESON_VENV/bin/meson" install \
            -C build

      - name: Inspect Mesa libraries
        working-directory: ${{ env.MESA_DIR }}
        run: |
          echo "=== Installed libraries ==="

          find "$MESA_INSTALL_DIR" \
            \( -name "libvulkan_freedreno.so" \
            -o -name "libgallium_dri.so" \
            -o -name "libEGL_mesa.so" \
            -o -name "libGLESv2_mesa.so" \) \
            -type f \
            -print

          echo "=== Architecture ==="

          find "$MESA_INSTALL_DIR" \
            \( -name "libvulkan_freedreno.so" \
            -o -name "libgallium_dri.so" \
            -o -name "libEGL_mesa.so" \
            -o -name "libGLESv2_mesa.so" \) \
            -type f \
            -exec file {} \;

      - name: Prepare renderer plugin libraries
        run: |
          JNI_DIR="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          rm -rf "$JNI_DIR"
          mkdir -p "$JNI_DIR"

          find "$MESA_INSTALL_DIR" \
            -name "libvulkan_freedreno.so" \
            -type f \
            -exec cp {} "$JNI_DIR/libvulkan_freedreno.so" \; \
            -quit

          find "$MESA_INSTALL_DIR" \
            -name "libEGL_mesa.so" \
            -type f \
            -exec cp {} "$JNI_DIR/libEGL_mesa.so" \; \
            -quit

          if find "$MESA_INSTALL_DIR" -name "libGLESv2_mesa.so" -type f | grep -q .; then
            find "$MESA_INSTALL_DIR" \
              -name "libGLESv2_mesa.so" \
              -type f \
              -exec cp {} "$JNI_DIR/libGLESv2_mesa.so" \; \
              -quit
          fi

          find "$MESA_INSTALL_DIR" \
            -name "libgallium_dri.so" \
            -type f \
            -exec cp {} "$JNI_DIR/libzink_dri.so" \; \
            -quit

          for lib in \
            libglapi.so \
            libexpat.so \
            libxml2.so \
            libarchive.so
          do
            found="$(find "$MESA_INSTALL_DIR" -name "$lib" -type f | head -n 1 || true)"

            if [ -n "$found" ]; then
              cp "$found" "$JNI_DIR/$lib"
            fi
          done

          ls -lh "$JNI_DIR"

      - name: Import IronizedZink compatibility shim
        run: |
          IRONIZED_DIR="$WORK_ROOT/IronizedZink"

          rm -rf "$IRONIZED_DIR"

          git clone \
            --depth 1 \
            https://github.com/GoyDevv/IronizedZink.git \
            "$IRONIZED_DIR"

          JNI_DIR="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          GLXSHIM="$(find "$IRONIZED_DIR" \
            -type f \
            -name "libglxshim.so" \
            | head -n 1 || true)"

          if [ -z "$GLXSHIM" ]; then
            echo "Required libglxshim.so not found"
            exit 1
          fi

          cp "$GLXSHIM" "$JNI_DIR/libglxshim.so"

          for lib in \
            libcutils.so \
            libironized_zink.so
          do
            FOUND="$(find "$IRONIZED_DIR" \
              -type f \
              -name "$lib" \
              | head -n 1 || true)"

            if [ -n "$FOUND" ]; then
              cp "$FOUND" "$JNI_DIR/$lib"
            fi
          done

      - name: Add Android libc++ runtime
        run: |
          JNI_DIR="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          CXX_SHARED="$(find "$ANDROID_NDK_HOME" \
            -type f \
            -path "*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            | head -n 1 || true)"

          if [ -z "$CXX_SHARED" ]; then
            echo "libc++_shared.so not found"
            exit 1
          fi

          cp "$CXX_SHARED" "$JNI_DIR/libc++_shared.so"

          ls -lh "$JNI_DIR/libc++_shared.so"

      - name: Verify renderer libraries
        run: |
          JNI_DIR="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          required=(
            "libvulkan_freedreno.so"
            "libEGL_mesa.so"
            "libzink_dri.so"
            "libc++_shared.so"
            "libglxshim.so"
          )

          for lib in "${required[@]}"; do
            if [ ! -f "$JNI_DIR/$lib" ]; then
              echo "Missing required library: $lib"
              exit 1
            fi

            file "$JNI_DIR/$lib"
          done

          echo "All required renderer libraries are present."

      - name: Set renderer version
        run: |
          cd "$WORK_ROOT/RendererPlugin-v2"

          sed -i \
            's/versionCode[[:space:]]*[=:][[:space:]]*[0-9]*/versionCode 463/' \
            app/build.gradle \
            app/build.gradle.kts \
            2>/dev/null || true

          sed -i \
            's/versionName[[:space:]]*[=:][[:space:]]*["'\''][^"'\'']*["'\'']/versionName "0.46.3"/' \
            app/build.gradle \
            app/build.gradle.kts \
            2>/dev/null || true

          grep -R \
            -n \
            -E 'versionCode|versionName' \
            app/build.gradle \
            app/build.gradle.kts \
            2>/dev/null || true

      - name: Build renderer APK
        working-directory: ${{ env.WORK_ROOT }}/RendererPlugin-v2
        run: |
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        run: |
          APK_DIR="$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug"

          if ! compgen -G "$APK_DIR/*.apk" > /dev/null; then
            echo "APK was not generated"
            exit 1
          fi

          ls -lh "$APK_DIR"/*.apk

          sha256sum "$APK_DIR"/*.apk

      - name: Upload renderer APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-APK
          path: RendererPlugin-v2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "# MyTurnipZink 0.46.3"
            echo
            echo "## Build configuration"
            echo
            echo "- Mesa commit: \`$MESA_COMMIT\`"
            echo "- Mesa branch generation: 26.3.0-devel"
            echo "- Android API: $ANDROID_API"
            echo "- Android NDK: $ANDROID_NDK_VERSION"
            echo "- Architecture: arm64-v8a"
            echo "- Vulkan: Freedreno / Turnip"
            echo "- OpenGL: Zink"
            echo "- Renderer: OpenGL 4.6 via Zink/Kopper"
            echo "- Target GPU: Adreno 618"
            echo
            echo "## Python build environment"
            echo
            echo "- Meson: isolated virtualenv"
            echo "- Mako: isolated virtualenv"
            echo "- PyYAML: isolated virtualenv"
            echo
            echo "## Result"
            echo
            APK_DIR="$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug"

            if compgen -G "$APK_DIR/*.apk" > /dev/null; then
              echo "- APK: generated successfully"
              ls -lh "$APK_DIR"/*.apk
            else
              echo "- APK: not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
