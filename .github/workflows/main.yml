name: Test Build Environment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install NDK r28c
        run: |
          sdkmanager "ndk;28.2.13676358"

      - name: Test Build Environment
        run: |
          echo "=== Host ==="
          uname -a
          echo

          echo "=== CPU ==="
          uname -m
          echo

          echo "=== Android SDK ==="
          echo "$ANDROID_SDK_ROOT"
          echo

          echo "=== NDK ==="
          echo "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -x "$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          echo

          echo "=== Clang ==="
          "$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
