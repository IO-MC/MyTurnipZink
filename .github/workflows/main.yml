name: Build MyTurnipZink Renderer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-pip \
            pkg-config \
            python3-mako \
            python3-yaml \
            python3-ply \
            bison \
            flex \
            gettext \
            git \
            cmake \
            ninja-build \
            ccache \
            glslang-tools \
            unzip \
            zip \
            patchelf \
            file \
            binutils \
            libexpat1-dev \
            libelf-dev \
            libdrm-dev \
            zlib1g-dev \
            libzstd-dev \
            libxml2-dev \
            llvm-18 \
            llvm-18-dev \
            clang-18 \
            libclang-18-dev \
            lld-18 \
            llvm-spirv-18 \
            libllvmspirvlib-18-dev \
            spirv-headers \
            spirv-tools

          python3 -m venv "$HOME/meson-venv"
          "$HOME/meson-venv/bin/pip" install --upgrade pip
          "$HOME/meson-venv/bin/pip" install \
            "meson>=1.4.0,<2.0" \
            packaging \
            Mako \
            PyYAML

          echo "$HOME/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Check host toolchain
        run: |
          set -eux
          java -version
          meson --version
          ninja --version
          /usr/bin/clang-18 --version
          /usr/bin/llvm-config-18 --version

      - name: Clone Mesa
        run: |
          rm -rf "$GITHUB_WORKSPACE/mesa"
          git clone \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            "$GITHUB_WORKSPACE/mesa"

          cd "$GITHUB_WORKSPACE/mesa"
          git checkout 8d68f369fc1a95bd701600f99b9c45d5da8e6068

          echo "=== Mesa commit ==="
          git rev-parse HEAD
          git log -1 --oneline
          grep '^project(' meson.build | head -1

          # Prevent the Android build from trying to use the problematic
          # libarchive subproject path seen in earlier runs.
          rm -f subprojects/libarchive.wrap

      - name: Build native Mesa CLC compiler
        working-directory: mesa
        env:
          CC: /usr/bin/clang-18
          CXX: /usr/bin/clang++-18
          LLVM_CONFIG: /usr/bin/llvm-config-18
        run: |
          set -eux
          rm -rf build-compiler "$GITHUB_WORKSPACE/mesa-compiler"

          meson setup build-compiler \
            --prefix "$GITHUB_WORKSPACE/mesa-compiler" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true

          meson compile -C build-compiler -j2
          meson install -C build-compiler

          test -x "$GITHUB_WORKSPACE/mesa-compiler/bin/mesa_clc"
          "$GITHUB_WORKSPACE/mesa-compiler/bin/mesa_clc" --help >/dev/null

      - name: Add native Mesa compiler to PATH
        run: |
          echo "$GITHUB_WORKSPACE/mesa-compiler/bin" >> "$GITHUB_PATH"
          command -v mesa_clc
          mesa_clc --help >/dev/null

      - name: Create Android cross file
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          cat > "$GITHUB_WORKSPACE/android-aarch64.txt" <<EOF
          [constants]
          ndk = '$NDK'

          [binaries]
          ar = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          c = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang'
          cpp = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++'
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat "$GITHUB_WORKSPACE/android-aarch64.txt"

      - name: Check Android compiler
        run: |
          set -eux
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" --version
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" --version
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --version

      - name: Configure Mesa for Android
        working-directory: mesa
        run: |
          set -eux
          rm -rf build "$GITHUB_WORKSPACE/install"

          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/android-aarch64.txt" \
            --prefix "$GITHUB_WORKSPACE/install" \
            --buildtype=release \
            --strip \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dopengl=true \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dspirv-tools=disabled \
            -Dshader-cache=disabled \
            -Dzstd=disabled \
            -Dzlib=disabled \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dallow-fallback-for=libdrm \
            -Dvulkan-beta=true

      - name: Show Mesa configuration
        working-directory: mesa
        run: |
          meson configure build

      - name: Build Mesa
        working-directory: mesa
        run: |
          set -eux
          meson compile -C build -j2

      - name: Install Mesa
        working-directory: mesa
        run: |
          set -eux
          meson install -C build

      - name: Verify Mesa output
        run: |
          set -eux

          INSTALL="$GITHUB_WORKSPACE/install"

          test -f "$INSTALL/lib/libvulkan_freedreno.so"
          test -f "$INSTALL/lib/libgallium_dri.so"
          test -f "$INSTALL/lib/libEGL.so"

          echo "=== Installed libraries ==="
          find "$INSTALL" -type f \
            \( -name "*.so" -o -name "*.so.*" \) \
            -print | sort

          echo
          echo "=== Turnip ==="
          file "$INSTALL/lib/libvulkan_freedreno.so"
          readelf -h "$INSTALL/lib/libvulkan_freedreno.so" \
            | grep -E "Class|Machine"
          readelf -d "$INSTALL/lib/libvulkan_freedreno.so" \
            | grep NEEDED || true

          echo
          echo "=== Gallium/Zink ==="
          file "$INSTALL/lib/libgallium_dri.so"
          readelf -h "$INSTALL/lib/libgallium_dri.so" \
            | grep -E "Class|Machine"
          readelf -d "$INSTALL/lib/libgallium_dri.so" \
            | grep NEEDED || true
          strings "$INSTALL/lib/libgallium_dri.so" \
            | grep -Ei "mesa zink|ZINK_DEBUG|ZINK_DESCRIPTORS|zink" \
            | head -100 || true

          echo
          echo "=== EGL ==="
          file "$INSTALL/lib/libEGL.so"
          readelf -d "$INSTALL/lib/libEGL.so" \
            | grep NEEDED || true

      - name: Clone proven Zink GLX shim package
        run: |
          rm -rf "$GITHUB_WORKSPACE/IronizedZink"
          git clone \
            --depth 1 \
            https://github.com/GoyDevv/IronizedZink.git \
            "$GITHUB_WORKSPACE/IronizedZink"

      - name: Assemble renderer runtime
        run: |
          set -eux

          INSTALL="$GITHUB_WORKSPACE/install"
          OLD="$GITHUB_WORKSPACE/IronizedZink/app/src/main/jniLibs/arm64-v8a"
          OUT="$GITHUB_WORKSPACE/renderer-libs"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Copy every native library produced by our Mesa build.
          # Keeping the full Mesa lib directory avoids missing internal
          # DT_NEEDED dependencies at runtime.
          find "$INSTALL/lib" -maxdepth 1 -type f \
            \( -name "*.so" -o -name "*.so.*" \) \
            -exec cp -t "$OUT" {} +

          # Keep the library names expected by the desktop-GL bridge.
          cp "$INSTALL/lib/libEGL.so" "$OUT/libEGL_mesa.so"
          cp "$INSTALL/lib/libgallium_dri.so" "$OUT/libzink_dri.so"

          # Proven Android GLX entry shim used by an existing Zalith Zink plugin.
          test -s "$OLD/libglxshim.so"
          cp "$OLD/libglxshim.so" "$OUT/libglxshim.so"

          # Existing Zink stacks sometimes need this Android compatibility lib.
          if [ -s "$OLD/libcutils.so" ]; then
            cp "$OLD/libcutils.so" "$OUT/libcutils.so"
          fi

          # Use the exact same NDK libc++ runtime as the new Mesa build.
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -s "$LIBCXX"
          cp "$LIBCXX" "$OUT/libc++_shared.so"

          echo "=== Renderer runtime ==="
          find "$OUT" -maxdepth 1 -type f \
            -printf "%f\n" | sort

          echo
          echo "=== Architectures ==="
          find "$OUT" -maxdepth 1 -type f -name "*.so" \
            -print0 | xargs -0 -r file

      - name: Verify GLX shim and runtime
        run: |
          set -eux

          OUT="$GITHUB_WORKSPACE/renderer-libs"

          test -s "$OUT/libglxshim.so"
          test -s "$OUT/libEGL_mesa.so"
          test -s "$OUT/libzink_dri.so"
          test -s "$OUT/libvulkan_freedreno.so"
          test -s "$OUT/libc++_shared.so"

          echo "=== libglxshim.so ==="
          file "$OUT/libglxshim.so"
          readelf -h "$OUT/libglxshim.so" \
            | grep -E "Class|Machine"
          readelf -d "$OUT/libglxshim.so" \
            | grep NEEDED || true

          echo
          echo "=== libEGL_mesa.so ==="
          readelf -d "$OUT/libEGL_mesa.so" \
            | grep NEEDED || true

          echo
          echo "=== libzink_dri.so ==="
          readelf -d "$OUT/libzink_dri.so" \
            | grep NEEDED || true

      - name: Clone RendererPlugin-v2
        run: |
          rm -rf "$GITHUB_WORKSPACE/RendererPlugin-v2"
          git clone \
            --depth 1 \
            https://github.com/ZalithLauncher/RendererPlugin-v2.git \
            "$GITHUB_WORKSPACE/RendererPlugin-v2"

          cd "$GITHUB_WORKSPACE/RendererPlugin-v2"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Install renderer libraries into APK project
        run: |
          set -eux

          JNI="$GITHUB_WORKSPACE/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          rm -rf "$JNI"
          mkdir -p "$JNI"

          cp "$GITHUB_WORKSPACE/renderer-libs/"*.so "$JNI/"

          echo "=== APK native libraries ==="
          find "$JNI" -maxdepth 1 -type f \
            -printf "%f\n" | sort

      - name: Configure renderer project
        run: |
          set -eux

          PROJECT="$GITHUB_WORKSPACE/RendererPlugin-v2"

          cat > "$PROJECT/app/build.gradle.kts" <<'EOF'
          import com.launchers_plugin.renderer.buildscript.buildEnvs
          import com.launchers_plugin.renderer.buildscript.buildJsonValue
          import com.launchers_plugin.renderer.buildscript.legacyManifest
          import com.launchers_plugin.renderer.buildscript.nativePath
          import com.launchers_plugin.renderer.buildscript.renderer
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.launchers_plugin.renderer.dsl")
              alias(libs.plugins.android.application)
              id("com.google.devtools.ksp")
              id("kotlinx-serialization")
          }

          android {
              namespace = "com.launchers_plugin.renderer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.launchers_plugin.renderer.myturnipzink"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  resValues = true
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }

                  configureEach {
                      resValue("string", "app_name", "MyTurnipZink")

                      resValue("string", "config", buildJsonValue {
                          renderer(
                              displayName = "MyTurnipZink",
                              rendererId = "opengles3_desktopgl_zink_kopper",
                              rendererGLPath = nativePath("libglxshim.so"),
                              rendererEGLPath = nativePath("libEGL_mesa.so"),
                              dlopenLibPaths = emptyList(),
                              env = buildEnvs {
                                  normal("LIBGL_ES", "3")
                                  normal("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                                  normal("MESA_GL_VERSION_OVERRIDE", "4.6")
                                  normal("MESA_GLSL_VERSION_OVERRIDE", "460")
                                  normal("force_glsl_extensions_warn", "true")
                                  normal("allow_higher_compat_version", "true")
                                  normal("allow_glsl_extension_directive_midshader", "true")
                                  normal("force_gl_renderer", "MyTurnipZink | OpenGL 4.6")
                                  normal("force_gl_vendor", "Mesa / Turnip / Zink")
                              },
                              minMCVer = null,
                              maxMCVer = null,
                          )
                      })

                      manifestPlaceholders.putAll(legacyManifest {
                          displayName = "MyTurnipZink"
                          rendererName = "MyTurnipZink"
                          rendererLib = "libglxshim.so"
                          eglLib = "/libEGL_mesa.so"
                          minMCVer = ""
                          maxMCVer = ""

                          boatEnv {
                              put("LIBGL_ES", "3")
                              put("POJAV_RENDERER", "opengles3_desktopgl_zink_kopper")
                              put("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                              put("MESA_GL_VERSION_OVERRIDE", "4.6")
                              put("MESA_GLSL_VERSION_OVERRIDE", "460")
                              put("force_glsl_extensions_warn", "true")
                              put("allow_higher_compat_version", "true")
                              put("allow_glsl_extension_directive_midshader", "true")
                              put("DLOPEN", "libglxshim.so")
                          }

                          pojavEnv {
                              put("LIBGL_ES", "3")
                              put("POJAV_RENDERER", "opengles3_desktopgl_zink_kopper")
                              put("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                              put("MESA_GL_VERSION_OVERRIDE", "4.6")
                              put("MESA_GLSL_VERSION_OVERRIDE", "460")
                              put("force_glsl_extensions_warn", "true")
                              put("allow_higher_compat_version", "true")
                              put("allow_glsl_extension_directive_midshader", "true")
                              put("DLOPEN", "libglxshim.so")
                          }
                      })
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_1_8)
              }
          }

          dependencies {
              implementation(libs.androidx.annotation)
          }
          EOF

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/img_app"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="fclPlugin_V2"
                      android:resource="@string/config" />

                  <meta-data
                      android:name="fclPlugin"
                      android:value="true" />

                  <meta-data
                      android:name="des"
                      android:value="Mesa Turnip + Zink for Zalith Launcher 2" />

                  <meta-data
                      android:name="renderer"
                      android:value="\${renderer}" />

                  <meta-data
                      android:name="boatEnv"
                      android:value="\${boatEnv}" />

                  <meta-data
                      android:name="pojavEnv"
                      android:value="\${pojavEnv}" />

                  <meta-data
                      android:name="minMCVer"
                      android:value="\${minMCVer}" />

                  <meta-data
                      android:name="maxMCVer"
                      android:value="\${maxMCVer}" />

              </application>

          </manifest>
          EOF

          cat > "$PROJECT/app/src/main/res/values/strings.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="title_backend_type">Mesa Turnip + Zink backend</string>
          </resources>
          EOF

          echo "=== Final build.gradle.kts ==="
          sed -n '1,280p' "$PROJECT/app/build.gradle.kts"

          echo
          echo "=== Final AndroidManifest.xml ==="
          sed -n '1,220p' "$PROJECT/app/src/main/AndroidManifest.xml"

      - name: Build renderer APK
        working-directory: RendererPlugin-v2
        run: |
          set -eux
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -eux

          APK=$(find "$GITHUB_WORKSPACE/RendererPlugin-v2/app/build/outputs/apk/debug" \
            -maxdepth 1 -type f -name "*.apk" | head -n1)

          test -n "$APK"
   
