name: Build MyTurnipZink

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      MESA_VERSION: "26.2.3"
      WORK_ROOT: ${{ github.workspace }}/work
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:

      # ============================================================
      # 1. System dependencies
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            build-essential \
            cmake \
            flex \
            gettext \
            git \
            glslang-tools \
            libarchive-dev \
            libdrm-dev \
            libelf-dev \
            libexpat1-dev \
            libffi-dev \
            libgles2-mesa-dev \
            libllvm-dev \
            liblz4-dev \
            libpng-dev \
            libtool \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxshmfence-dev \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-mako \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            spirv-tools \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Verify shader tools
        run: |
          set -eux

          command -v glslangValidator
          glslangValidator --version

          command -v spirv-as
          spirv-as --version

      # ============================================================
      # 2. Java
      # ============================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # 3. Android SDK / NDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -eux

          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      - name: Verify Android NDK
        run: |
          set -eux

          test -d "$ANDROID_NDK_HOME"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

      # ============================================================
      # 4. Workspace
      # ============================================================

      - name: Prepare workspace
        run: |
          set -eux

          rm -rf "$WORK_ROOT"
          mkdir -p "$WORK_ROOT"

          echo "WORK_ROOT=$WORK_ROOT"

      # ============================================================
      # 5. SPIR-V LLVM Translator
      # ============================================================

      - name: Clone SPIR-V LLVM Translator
        run: |
          set -eux

          cd "$WORK_ROOT"

          git clone --depth=1 \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git \
            SPIRV-LLVM-Translator

      - name: Build SPIR-V LLVM Translator
        run: |
          set -eux

          cd "$WORK_ROOT/SPIRV-LLVM-Translator"

          mkdir -p build
          cd build

          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$(llvm-config --cmakedir)"

          ninja -j"$(nproc)"

      # ============================================================
      # 6. Mesa source
      # ============================================================

      - name: Download Mesa
        run: |
          set -eux

          cd "$WORK_ROOT"

          wget -O "mesa-${MESA_VERSION}.tar.xz" \
            "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"

          echo \
            "1628058a8d2c0615975de5a15ab7bbb9638c50000b5bed9456ff423ea034a81f  mesa-${MESA_VERSION}.tar.xz" \
            | sha256sum -c -

          tar -xf "mesa-${MESA_VERSION}.tar.xz"

          mv "mesa-${MESA_VERSION}" mesa

      # ============================================================
      # 7. Mesa Android dependencies
      # ============================================================

      - name: Prepare Mesa Android dependencies
        run: |
          set -eux

          mkdir -p "$WORK_ROOT/mesa-build"

      # ============================================================
      # 8. Mesa native compiler
      # ============================================================

      - name: Configure Mesa native compiler
        run: |
          set -eux

          cd "$WORK_ROOT/mesa"

          rm -rf "$WORK_ROOT/mesa-compiler-build"

          meson setup \
            "$WORK_ROOT/mesa-compiler-build" \
            . \
            --buildtype=release \
            -Dbuild-tests=false \
            -Dllvm=enabled \
            -Dvulkan-drivers=[] \
            -Dgallium-drivers=[]

      - name: Build Mesa native compiler
        run: |
          set -eux

          meson compile \
            -C "$WORK_ROOT/mesa-compiler-build" \
            -j"$(nproc)"

      # ============================================================
      # 9. Mesa Zink / Kopper
      # ============================================================

      - name: Configure Mesa Zink/Kopper
        run: |
          set -eux

          cd "$WORK_ROOT/mesa"

          rm -rf "$WORK_ROOT/mesa-zink-build"

          meson setup \
            "$WORK_ROOT/mesa-zink-build" \
            . \
            --cross-file "$WORK_ROOT/mesa/android-arm64-cross.txt" \
            --buildtype=release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dbuild-tests=false \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dglx=dri \
            -Degl=enabled \
            -Dllvm=enabled \
            -Dzstd=disabled \
            -Dvalgrind=disabled

      - name: Build Mesa Zink/Kopper
        run: |
          set -eux

          meson compile \
            -C "$WORK_ROOT/mesa-zink-build" \
            -j"$(nproc)"

      # ============================================================
      # 10. Build standalone Turnip
      # ============================================================

      - name: Configure Turnip
        run: |
          set -eux

          cd "$WORK_ROOT/mesa"

          rm -rf "$WORK_ROOT/turnip-build"

          meson setup \
            "$WORK_ROOT/turnip-build" \
            . \
            --cross-file "$WORK_ROOT/mesa/android-arm64-cross.txt" \
            --buildtype=release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dbuild-tests=false \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=freedreno \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dllvm=enabled \
            -Dzstd=disabled \
            -Dvalgrind=disabled

      - name: Build Turnip
        run: |
          set -eux

          meson compile \
            -C "$WORK_ROOT/turnip-build" \
            -j"$(nproc)"

      # ============================================================
      # 11. Find native libraries
      # ============================================================

      - name: Locate native libraries
        run: |
          set -eux

          mkdir -p "$WORK_ROOT/native"

          echo "=== Turnip ==="

          find "$WORK_ROOT/turnip-build" \
            -type f \
            -name 'libvulkan_freedreno.so' \
            -print

          echo "=== Mesa Zink ==="

          find "$WORK_ROOT/mesa-zink-build" \
            -type f \
            \( \
              -name 'libEGL_mesa.so' \
              -o -name 'libgallium_dri.so' \
              -o -name 'libzink_dri.so' \
            \) \
            -print

      # ============================================================
      # 12. RendererPlugin-v2
      # ============================================================

      - name: Clone RendererPlugin-v2
        run: |
          set -eux

          cd "$WORK_ROOT"

          git clone \
            https://github.com/ZalithLauncher/RendererPlugin-v2.git \
            RendererPlugin-v2

          cd RendererPlugin-v2

          git checkout \
            1591ff84c3ddda0c95ae1e72ef1f6608cb331b7d

      # ============================================================
      # 13. Prepare renderer native libraries
      # ============================================================

      - name: Prepare renderer plugin libraries
        run: |
          set -eux

          R="$WORK_ROOT/RendererPlugin-v2"

          mkdir -p \
            "$R/app/src/main/jniLibs/arm64-v8a"

          EGL="$(find "$WORK_ROOT/mesa-zink-build" \
            -type f \
            -name 'libEGL_mesa.so' \
            | head -n1)"

          GALLIUM="$(find "$WORK_ROOT/mesa-zink-build" \
            -type f \
            -name 'libgallium_dri.so' \
            | head -n1)"

          ZINK="$(find "$WORK_ROOT/mesa-zink-build" \
            -type f \
            -name 'libzink_dri.so' \
            | head -n1)"

          test -n "$EGL"
          test -n "$GALLIUM"
          test -n "$ZINK"

          cp "$EGL" \
            "$R/app/src/main/jniLibs/arm64-v8a/libEGL_mesa.so"

          cp "$GALLIUM" \
            "$R/app/src/main/jniLibs/arm64-v8a/libgallium_dri.so"

          cp "$ZINK" \
            "$R/app/src/main/jniLibs/arm64-v8a/libzink_dri.so"

          GLAPI="$(find \
            "$WORK_ROOT/mesa-zink-build" \
            "$WORK_ROOT/mesa" \
            -type f \
            -name 'libglapi.so*' \
            | head -n1 || true)"

          if [ -n "$GLAPI" ]; then
            cp "$GLAPI" \
              "$R/app/src/main/jniLibs/arm64-v8a/libglapi.so"
          fi

          echo "=== Renderer native libraries ==="

          find \
            "$R/app/src/main/jniLibs/arm64-v8a" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 14. Verify renderer ELF
      # ============================================================

      - name: Verify renderer ELF
        run: |
          set -eux

          R="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          test -f "$R/libEGL_mesa.so"
          test -f "$R/libgallium_dri.so"
          test -f "$R/libzink_dri.so"

          file "$R"/*.so

          readelf -d \
            "$R/libEGL_mesa.so" \
            | grep NEEDED \
            || true

      # ============================================================
      # 15. Configure renderer plugin
      # ============================================================

      - name: Configure renderer plugin
        run: |
          set -eux

          R="$WORK_ROOT/RendererPlugin-v2"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'applicationId = "com.launchers_plugin.renderer"',
              'applicationId = "com.iomc.myturnipzink.renderer"'
          )

          s = s.replace(
              'versionCode = 1',
              'versionCode = 26203'
          )

          s = s.replace(
              'versionName = "1.0"',
              'versionName = "26.2.3-zink"'
          )

          s = s.replace(
              'resValue("string","app_name","XXX Renderer")',
              'resValue("string","app_name","MyTurnipZink Renderer 26.2.3")'
          )

          s = s.replace(
              'applicationIdSuffix = ".xxx"',
              ''
          )

          start = s.find(
              'resValue("string", "config", buildJsonValue {'
          )

          if start == -1:
              raise SystemExit(
                  "Renderer config block was not found"
              )

          marker = '\n\n            // 兼容旧版渲染器插件架构'

          end = s.find(marker, start)

          if end == -1:
              raise SystemExit(
                  "Legacy renderer marker was not found"
              )

          new_block = r'''resValue("string", "config", buildJsonValue {
              renderer(
                  displayName = "MyTurnipZink | Mesa 26.2.3",
                  rendererId = "myturnipzink",
                  rendererGLPath = "libglxshim.so",
                  rendererEGLPath = nativePath("libEGL_mesa.so"),
                  dlopenLibPaths = listOf(
                      nativePath("libglapi.so"),
                      nativePath("libgallium_dri.so"),
                      nativePath("libzink_dri.so"),
                  ),
                  env = buildEnvs {
                      normal("LIBGL_ES", "3")
                      normal("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                      normal("POJAVEXEC_EGL", nativePath("libEGL_mesa.so"))
                  },
                  minMCVer = null,
                  maxMCVer = null,
              )
          })'''

          s = s[:start] + new_block + s[end:]

          legacy_start = s.find(
              'manifestPlaceholders.putAll(legacyManifest {'
          )

          if legacy_start != -1:
              legacy_end = s.find(
                  '            })',
                  legacy_start
              )

              if legacy_end != -1:
                  legacy_end += len('            })')

                  legacy = r'''manifestPlaceholders.putAll(legacyManifest {
              displayName  = "MyTurnipZink | Mesa 26.2.3"
              rendererName = "MyTurnipZink"
              rendererLib  = "libglxshim.so"
              eglLib       = "/libEGL_mesa.so"

              minMCVer = ""
              maxMCVer = ""

              boatEnv {
                  put("LIBGL_ES", "3")
                  put("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                  put("POJAVEXEC_EGL", "libEGL_mesa.so")
                  put(
                      "DLOPEN",
                      "libglapi.so,libgallium_dri.so,libzink_dri.so"
                  )
              }

              pojavEnv {
                  put("LIBGL_ES", "3")
                  put("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                  put("POJAVEXEC_EGL", "libEGL_mesa.so")
                  put(
                      "DLOPEN",
                      "libglapi.so,libgallium_dri.so,libzink_dri.so"
                  )
              }
          })'''

                  s = s[:legacy_start] + legacy + s[legacy_end:]

          p.write_text(s)
          PY

          cd "$R"

          grep -nE \
            'applicationId|versionCode|versionName|app_name|rendererId|rendererGLPath|rendererEGLPath|dlopenLibPaths|MESA_LOADER_DRIVER_OVERRIDE|POJAVEXEC_EGL' \
            app/build.gradle.kts

      # ============================================================
      # 16. Build renderer APK
      # ============================================================

      - name: Build renderer APK
        working-directory: ${{ env.WORK_ROOT }}/RendererPlugin-v2
        run: |
          set -eux

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 17. Verify renderer APK
      # ============================================================

      - name: Verify renderer APK
        run: |
          set -eux

          D="$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug"

          APK="$(find "$D" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1)"

          test -n "$APK"
          test -s "$APK"

          echo "=== Renderer APK ==="

          ls -lh "$APK"
          sha256sum "$APK"

          echo
          echo "=== Renderer libraries ==="

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/' \
            | sort

          unzip -l "$APK" \
            | grep -q \
              'lib/arm64-v8a/libEGL_mesa.so'

          unzip -l "$APK" \
            | grep -q \
              'lib/arm64-v8a/libgallium_dri.so'

          unzip -l "$APK" \
            | grep -q \
              'lib/arm64-v8a/libzink_dri.so'

      # ============================================================
      # 18. Prepare Turnip FCL DRIVER plugin
      #
      # IMPORTANT:
      #
      # Zalith Launcher 2 DriverPluginManager requires:
      #
      #   fclPlugin=true
      #   driver=Turnip
      #
      # It does NOT use:
      #
      #   FCLNativePlugin=true
      #   environment=...
      #
      # for Vulkan driver discovery.
      # ============================================================

      - name: Prepare Turnip Driver Plugin
        run: |
          set -eux

          T="$WORK_ROOT/TurnipDriverPlugin"

          rm -rf "$T"

          mkdir -p \
            "$T/app/src/main/java/com/iomc/myturnipzink/turnip" \
            "$T/app/src/main/jniLibs/arm64-v8a" \
            "$T/app/src/main/res/values"

          TURNIP_SO="$(find \
            "$WORK_ROOT/turnip-build" \
            -type f \
            -name 'libvulkan_freedreno.so' \
            | head -n1)"

          test -n "$TURNIP_SO"
          test -s "$TURNIP_SO"

          cp \
            "$TURNIP_SO" \
            "$T/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so"

          # --------------------------------------------------------
          # settings.gradle.kts
          # --------------------------------------------------------

          cat > "$T/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TurnipDriverPlugin"

          include(":app")
          EOF

          # --------------------------------------------------------
          # root build.gradle.kts
          #
          # Same Android Gradle Plugin generation as the
          # ZalithLauncher NativeLibPlugin template.
          # --------------------------------------------------------

          cat > "$T/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.1" apply false
          }
          EOF

          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------

          cat > "$T/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # --------------------------------------------------------
          # app/build.gradle.kts
          # --------------------------------------------------------

          cat > "$T/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.iomc.myturnipzink.turnip"

              compileSdk = 34

              defaultConfig {
                  applicationId = "com.iomc.myturnipzink.turnip"

                  minSdk = 26
                  targetSdk = 34

                  versionCode = 26203
                  versionName = "26.2.3-turnip"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }

                  release {
                      isMinifyEnabled = false
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          EOF

          # --------------------------------------------------------
          # strings.xml
          # --------------------------------------------------------

          cat > \
            "$T/app/src/main/res/values/strings.xml" \
            <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MyTurnipZink Turnip 26.2.3</string>
          </resources>
          EOF

          # --------------------------------------------------------
          # AndroidManifest.xml
          #
          # THIS is the important fix.
          #
          # Zalith Launcher 2:
          #
          #   metaData["fclPlugin"] == true
          #   metaData["driver"] != null
          #
          # Then launcher uses info.nativeLibraryDir.
          # --------------------------------------------------------

          cat > \
            "$T/app/src/main/AndroidManifest.xml" \
            <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:label="@string/app_name">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <!-- =================================================
                       Zalith Launcher 2 FCL Driver Plugin
                       ================================================= -->

                  <meta-data
                      android:name="fclPlugin"
                      android:value="true" />

                  <meta-data
                      android:name="driver"
                      android:value="Turnip" />

              </application>

          </manifest>
          EOF

          # --------------------------------------------------------
          # MainActivity.java
          #
          # Java only, so this plugin does not need Kotlin.
          # --------------------------------------------------------

          cat > \
            "$T/app/src/main/java/com/iomc/myturnipzink/turnip/MainActivity.java" \
            <<'EOF'
          package com.iomc.myturnipzink.turnip;

          import android.app.Activity;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  finish();
              }
          }
          EOF

          # --------------------------------------------------------
          # Diagnostics
          # --------------------------------------------------------

          echo "=== Turnip Driver project ==="

          find "$T/app/src/main" \
            -type f \
            -print \
            | sort

          echo
          echo "=== Turnip native library ==="

          ls -lh \
            "$T/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so"

          file \
            "$T/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so"

      # ============================================================
      # 19. Supply Gradle wrapper to Turnip driver project
      # ============================================================

      - name: Prepare Turnip Gradle wrapper
        run: |
          set -eux

          R="$WORK_ROOT/RendererPlugin-v2"
          T="$WORK_ROOT/TurnipDriverPlugin"

          test -f "$R/gradlew"
          test -d "$R/gradle"

          cp \
            "$R/gradlew" \
            "$T/gradlew"

          cp -r \
            "$R/gradle" \
            "$T/gradle"

          chmod +x "$T/gradlew"

      # ============================================================
      # 20. Build Turnip Driver APK
      # ============================================================

      - name: Build Turnip Driver APK
        working-directory: ${{ env.WORK_ROOT }}/TurnipDriverPlugin
        run: |
          set -eux

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 21. Verify Turnip Driver APK
      # ============================================================

      - name: Verify Turnip Driver APK
        run: |
          set -eux

          D="$WORK_ROOT/TurnipDriverPlugin/app/build/outputs/apk/debug"

          APK="$(find "$D" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1)"

          test -n "$APK"
          test -s "$APK"

          echo "=== Turnip Driver APK ==="

          ls -lh "$APK"
          sha256sum "$APK"

          echo
          echo "=== APK contents ==="

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/' \
            | sort

          echo
          echo "=== Check Turnip library ==="

          unzip -l "$APK" \
            | grep -q \
              'lib/arm64-v8a/libvulkan_freedreno.so'

          echo
          echo "=== Android package ==="

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$AAPT" dump badging "$APK"

          echo
          echo "=== AndroidManifest.xml ==="

          "$AAPT" dump xmltree \
            "$APK" \
            AndroidManifest.xml \
            > "$WORK_ROOT/turnip-manifest.txt"

          cat "$WORK_ROOT/turnip-manifest.txt"

          echo
          echo "=== Required FCL Driver metadata ==="

          grep -q \
            'fclPlugin' \
            "$WORK_ROOT/turnip-manifest.txt"

          grep -q \
            'driver' \
            "$WORK_ROOT/turnip-manifest.txt"

          grep -q \
            'Turnip' \
            "$WORK_ROOT/turnip-manifest.txt"

          echo
          echo "=== Ensure wrong NativeLibPlugin metadata is absent ==="

          if grep -q \
            'FCLNativePlugin' \
            "$WORK_ROOT/turnip-manifest.txt"
          then
            echo \
              "ERROR: FCLNativePlugin metadata found in Turnip APK."

            exit 1
          fi

          echo
          echo "Turnip FCL Driver metadata: OK"

          echo "$APK" \
            > "$WORK_ROOT/turnip-apk-path.txt"

      # ============================================================
      # 22. Package standalone Turnip ZIP
      # ============================================================

      - name: Package standalone Turnip ZIP
        run: |
          set -eux

          mkdir -p \
            "$WORK_ROOT/turnip-standalone/lib/arm64-v8a"

          TURNIP_SO="$(find \
            "$WORK_ROOT/turnip-build" \
            -type f \
            -name 'libvulkan_freedreno.so' \
            | head -n1)"

          test -n "$TURNIP_SO"

          cp \
            "$TURNIP_SO" \
            "$WORK_ROOT/turnip-standalone/lib/arm64-v8a/libvulkan_freedreno.so"

          cd "$WORK_ROOT/turnip-standalone"

          zip -r \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip" \
            .

          cd "$WORK_ROOT"

          sha256sum \
            MyTurnipZink-Turnip-Driver.zip

      # ============================================================
      # 23. Collect final artifacts
      # ============================================================

      - name: Collect final artifacts
        run: |
          set -eux

          RENDERER_APK="$(find \
            "$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1)"

          TURNIP_APK="$(cat \
            "$WORK_ROOT/turnip-apk-path.txt")"

          test -f "$RENDERER_APK"
          test -f "$TURNIP_APK"
          test -f \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip"

          cp \
            "$RENDERER_APK" \
            "$WORK_ROOT/MyTurnipZink-Renderer.apk"

          cp \
            "$TURNIP_APK" \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.apk"

          echo
          echo "=== Final files ==="

          ls -lh \
            "$WORK_ROOT/MyTurnipZink-Renderer.apk" \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.apk" \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip"

          echo
          echo "=== SHA256 ==="

          sha256sum \
            "$WORK_ROOT/MyTurnipZink-Renderer.apk" \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.apk" \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip"

      # ============================================================
      # 24. Upload renderer APK
      # ============================================================

      - name: Upload Renderer APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Renderer-APK
          path: ${{ env.WORK_ROOT }}/MyTurnipZink-Renderer.apk
          if-no-files-found: error
          retention-days: 90

      # ============================================================
      # 25. Upload Turnip Driver APK
      # ============================================================

      - name: Upload Turnip Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Turnip-Driver-APK
          path: ${{ env.WORK_ROOT }}/MyTurnipZink-Turnip-Driver.apk
          if-no-files-found: error
          retention-days: 90

      # ============================================================
      # 26. Upload standalone Turnip ZIP
      # ============================================================

      - name: Upload standalone Turnip ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Turnip-Driver
          path: ${{ env.WORK_ROOT }}/MyTurnipZink-Turnip-Driver.zip
          if-no-files-found: error
          retention-days: 90

      # ============================================================
      # 27. Build summary
      # ============================================================

      - name: Build summary
        run: |
          set -eux

          {
            echo "# MyTurnipZink"
            echo
            echo "## Mesa"
            echo "- Mesa: ${MESA_VERSION}"
            echo "- Zink/Kopper: enabled"
            echo
            echo "## Target"
            echo "- GPU: Adreno 618"
            echo "- API: Vulkan / Turnip / Freedreno"
            echo "- ABI: arm64-v8a"
            echo
            echo "## Turnip plugin format"
            echo "- FCL Driver Plugin"
            echo "- fclPlugin=true"
            echo "- driver=Turnip"
            echo "- NOT FCLNativePlugin"
            echo
            echo "## Artifacts"
            echo "- MyTurnipZink-Renderer-APK"
            echo "- MyTurnipZink-Turnip-Driver-APK"
            echo "- MyTurnipZink-Turnip-Driver"
          } >> "$GITHUB_STEP_SUMMARY"
