name: Build MyTurnipZink

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_COMMIT: 8d68f369fc1
  MOBILEGL_COMMIT: fff9d639f06cad2aedb5ac0b93c523d7ca153fdc
  ANDROID_API: 33
  ANDROID_NDK_VERSION: 28.2.13676358
  WORK_ROOT: ${{ github.workspace }}
  MESA_DIR: ${{ github.workspace }}/mesa
  MESA_COMPILER_DIR: ${{ github.workspace }}/mesa-compiler
  MESA_INSTALL_DIR: ${{ github.workspace }}/install
  MESON_VENV: ${{ github.workspace }}/meson-venv
  MOBILEGL_DIR: ${{ github.workspace }}/MobileGL

jobs:
  build:
    name: Build Mesa Zink + Turnip
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm llvm-dev libclang-18-dev \
            pkg-config python3 python3-dev python3-venv python3-pip bison flex gettext \
            glslang-tools libdrm-dev libexpat1-dev libelf-dev libxml2-dev libarchive-dev \
            ninja-build cmake spirv-headers spirv-tools unzip zip wget git
          rm -rf "$MESON_VENV"
          python3 -m venv "$MESON_VENV"
          "$MESON_VENV/bin/python" -m pip install --upgrade pip
          "$MESON_VENV/bin/python" -m pip install "meson>=1.4,<2.0" "mako>=1.2" PyYAML packaging
          echo "$MESON_VENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$MESON_VENV" >> "$GITHUB_ENV"
          echo "PATH=$MESON_VENV/bin:$PATH" >> "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -u+x | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "platforms;android-34" \
            "build-tools;35.0.0" "cmake;3.22.1" "ndk;${ANDROID_NDK_VERSION}" "ndk;27.3.13750724"

      - name: Export Android NDK environment
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          /usr/bin/llvm-config --version
          "$MESON_VENV/bin/meson" --version
          ninja --version
          clang --version | head -n 1
          java -version
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" --version | head -n 1

      - name: Clone Mesa
        run: |
          rm -rf "$MESA_DIR"
          git clone https://gitlab.freedesktop.org/mesa/mesa.git "$MESA_DIR"
          cd "$MESA_DIR"
          git checkout "$MESA_COMMIT"
          git rev-parse HEAD

      - name: Build SPIR-V LLVM Translator
        run: |
          T="$WORK_ROOT/SPIRV-LLVM-Translator"
          B="$WORK_ROOT/spirv-llvm-translator-build"
          H="$WORK_ROOT/SPIRV-Headers"
          rm -rf "$T" "$B" "$H"
          git clone --depth 1 --branch llvm_release_180 https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git "$T"
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$H"
          cmake -S "$T" -B "$B" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF \
            -DLLVM_SPIRV_BUILD_EXTERNAL=ON \
            -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR="$H"
          cmake --build "$B" --target llvm-spirv -j "$(nproc)"
          sudo cmake --install "$B"
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/llvm-spirv.conf >/dev/null
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          test -x /usr/local/bin/llvm-spirv
          test -f /usr/local/lib/pkgconfig/LLVMSPIRVLib.pc
          pkg-config --modversion LLVMSPIRVLib

      - name: Prepare Mesa native compiler
        run: |
          rm -rf "$MESA_COMPILER_DIR"
          HOST_PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" | paste -sd: -)"
          export PATH="$HOST_PATH"
          export LLVM_CONFIG=/usr/bin/llvm-config
          "$MESON_VENV/bin/meson" setup "$MESA_COMPILER_DIR" "$MESA_DIR" \
            --prefix="$MESA_COMPILER_DIR/install" --buildtype=release --strip \
            -Dplatforms= -Dgallium-drivers= -Dvulkan-drivers= \
            -Dmesa-clc=enabled -Dinstall-mesa-clc=true -Dllvm=enabled -Dbuild-tests=false
          "$MESON_VENV/bin/meson" compile -C "$MESA_COMPILER_DIR" -j "$(nproc)"
          "$MESON_VENV/bin/meson" install -C "$MESA_COMPILER_DIR"
          echo "$MESA_COMPILER_DIR/install/bin" >> "$GITHUB_PATH"

      - name: Prepare Mesa dependencies
        run: |
          rm -f "$MESA_DIR/subprojects/libarchive.wrap"
          python3 - <<PYCODE
          from pathlib import Path
          p=Path("$MESA_DIR/meson.build")
          s=p.read_text()
          old="""dep_elf = dependency('libelf', required : false)
          if not with_platform_windows and not dep_elf.found()
            dep_elf = cc.find_library('elf', required : false)
          endif
          """
          if old not in s: raise SystemExit("Expected Mesa libelf detection block was not found")
          p.write_text(s.replace(old,"dep_elf = null_dep\n",1))
          PYCODE
          python3 - <<PYCODE
          from pathlib import Path
          import re
          p=Path("$MESA_DIR/meson.build")
          s=p.read_text()
          pat=re.compile(r"dep_zlib\s*=\s*dependency\(\s*'zlib'.*?required\s*:\s*get_option\('zlib'\)\s*,?\s*\)\s*if\s+dep_zlib\.found\(\)\s*pre_args\s*\+=\s*'-DHAVE_ZLIB'\s*endif",re.DOTALL)
          rep="""if with_platform_android
            dep_zlib = cc.find_library('z', required : get_option('zlib'))
          else
            dep_zlib = dependency('zlib', version : '>= 1.2.3', allow_fallback: true, required : get_option('zlib'))
          endif
          if dep_zlib.found()
            pre_args += '-DHAVE_ZLIB'
          endif"""
          s,n=pat.subn(rep,s,count=1)
          if n!=1: raise SystemExit("Expected Mesa zlib detection block was not found")
          p.write_text(s)
          PYCODE

      - name: Create Mesa cross files
        run: |
          cat > "$WORK_ROOT/android-aarch64.txt" <<EOF
          [binaries]
          c = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          ranlib = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
          ld = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'
          [properties]
          needs_exe_wrapper = true
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF
          cat > "$WORK_ROOT/native.txt" <<EOF
          [binaries]
          c = '/usr/bin/clang'
          cpp = '/usr/bin/clang++'
          ar = '/usr/bin/llvm-ar'
          strip = '/usr/bin/llvm-strip'
          ranlib = '/usr/bin/llvm-ranlib'
          ld = '/usr/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'
          python = '$MESON_VENV/bin/python'
          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

      - name: Configure Mesa
        working-directory: ${{ env.MESA_DIR }}
        run: |
          rm -rf build
          "$MESON_VENV/bin/meson" setup build \
            --cross-file "$WORK_ROOT/android-aarch64.txt" \
            --native-file "$WORK_ROOT/native.txt" \
            --prefix "$MESA_INSTALL_DIR" \
            -Dbuildtype=release -Dstrip=true -Dplatforms=android \
            -Dplatform-sdk-version="$ANDROID_API" -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled -Degl=enabled -Dgles2=enabled -Dgles1=disabled \
            -Dglx=disabled -Degl-lib-suffix=_mesa -Dgles-lib-suffix=_mesa \
            -Dshared-glapi=enabled -Dgallium-drivers=zink -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl -Dvulkan-beta=true -Dllvm=disabled -Ddraw-use-llvm=false \
            -Dmesa-clc=system -Dprecomp-compiler=system -Dspirv-tools=disabled \
            -Dzstd=disabled -Dzlib=enabled -Dshader-cache=disabled -Dbuild-tests=false

      - name: Build and install Mesa
        working-directory: ${{ env.MESA_DIR }}
        run: |
          "$MESON_VENV/bin/meson" compile -C build -j "$(nproc)"
          "$MESON_VENV/bin/meson" install -C build
          find "$MESA_INSTALL_DIR" \( -name "libvulkan_freedreno.so" -o -name "libgallium_dri.so" -o -name "libEGL_mesa.so" -o -name "libGLESv2_mesa.so" \) -type f -exec file {} \;

      - name: Setup Gradle for MobileGL
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare separate Turnip driver plugin
        run: |
          TURNIP_LIB="$(find "$MESA_INSTALL_DIR" -type f -name 'libvulkan_freedreno.so' | head -n 1 || true)"
          test -n "$TURNIP_LIB"
          test -f "$TURNIP_LIB"

          # Keep the driver as a standalone Zalith/FCL driver plugin. The renderer
          # APK is no longer the canonical place for Turnip; Zalith exposes the
          # selected driver's nativeLibraryDir as DRIVER_PATH.
          MESA_DRIVER_VERSION="$(strings "$TURNIP_LIB" | grep -oE 'Mesa [0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._+-]+)?' | head -n 1 | sed 's/^Mesa //' || true)"
          if [ -z "$MESA_DRIVER_VERSION" ]; then
            MESA_DRIVER_VERSION="26.3.0-devel"
          fi
          echo "MESA_DRIVER_VERSION=$MESA_DRIVER_VERSION" >> "$GITHUB_ENV"

          DRIVER_ROOT="$WORK_ROOT/TurnipDriverPlugin"
          rm -rf "$DRIVER_ROOT"
          mkdir -p "$DRIVER_ROOT/app/src/main/jniLibs/arm64-v8a" "$DRIVER_ROOT/app/src/main/assets"
          cp "$TURNIP_LIB" "$DRIVER_ROOT/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so"

          cat > "$DRIVER_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = "TurnipDriverPlugin"
          include(":app")
          EOF

          cat > "$DRIVER_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
          }
          EOF

          cat > "$DRIVER_ROOT/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
          }

          val mesaDriverVersion = System.getenv("MESA_DRIVER_VERSION") ?: "unknown"

          android {
              namespace = "org.myturnipzink.driver.turnip"
              compileSdk = 34

              defaultConfig {
                  applicationId = "org.myturnipzink.driver.turnip"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 26300
                  versionName = "Mesa $mesaDriverVersion"

                  ndk {
                      abiFilters += "arm64-v8a"
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                      keepDebugSymbols += "**/libvulkan_freedreno.so"
                  }
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }
          }
          EOF

          cat > "$DRIVER_ROOT/app/src/main/AndroidManifest.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Turnip Driver (Mesa $MESA_DRIVER_VERSION)"
                  android:hasCode="false"
                  android:extractNativeLibs="true"
                  android:allowBackup="false">

                  <meta-data
                      android:name="fclPlugin"
                      android:value="true" />

                  <meta-data
                      android:name="driver"
                      android:value="Turnip (Mesa $MESA_DRIVER_VERSION)" />

                  <activity
                      android:name="android.app.Activity"
                      android:label="Turnip Driver (Mesa $MESA_DRIVER_VERSION)"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$DRIVER_ROOT/app/src/main/assets/BUILD-INFO.txt" <<EOF
          MyTurnipZink Turnip Driver
          Mesa: $MESA_DRIVER_VERSION
          Mesa commit: $MESA_COMMIT
          Architecture: arm64-v8a
          Vulkan driver: libvulkan_freedreno.so
          Target: Adreno / KGSL
          EOF

          echo "Turnip source library: $TURNIP_LIB"
          echo "Turnip Mesa version: $MESA_DRIVER_VERSION"
          file "$DRIVER_ROOT/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so"
          # Turnip is a standalone Vulkan driver library, not an Android HAL module.
          # HMI is only required by Android's platform Vulkan HAL loader.
          llvm-readelf -h "$DRIVER_ROOT/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so" | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          # Symbol export is informational only; some Android-linked Mesa builds hide the ICD entrypoint.
          # The ELF architecture check above plus the packaged library is sufficient for this standalone driver APK.
          llvm-nm -D --defined-only "$DRIVER_ROOT/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so" | grep -E 'vk_icdGetInstanceProcAddr$' || true
          if llvm-readelf -d "$DRIVER_ROOT/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so" | grep -qE 'NEEDED.*libc\+\+_shared\.so'; then
            echo 'Unexpected libc++_shared.so dependency in Turnip driver'
            exit 1
          fi

          echo "TURNIP_DRIVER_ROOT=$DRIVER_ROOT" >> "$GITHUB_ENV"

      - name: Build Turnip driver APK
        run: |
          cd "$TURNIP_DRIVER_ROOT"
          gradle --no-daemon --stacktrace :app:assembleDebug

          APK="$TURNIP_DRIVER_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libvulkan_freedreno\.so$'
          unzip -l "$APK" | grep -E 'assets/BUILD-INFO\.txt$'

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -A2 -B2 -E 'fclPlugin|driver'

      - name: Upload Turnip driver APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Turnip-Driver-APK
          path: TurnipDriverPlugin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Clone MobileGL
        run: |
          rm -rf "$MOBILEGL_DIR"
          git clone --recurse-submodules https://github.com/MobileGL-Dev/MobileGL.git "$MOBILEGL_DIR"
          cd "$MOBILEGL_DIR"
          git checkout "$MOBILEGL_COMMIT"
          git submodule update --init --recursive
          git rev-parse HEAD

      - name: Build MobileGL ARM64 library
        run: |
          M="$MOBILEGL_DIR/android-plugin"
          test -d "$M"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" > "$M/local.properties"
          cd "$M/.."

          # MobileGL enables glslang optimization, which requires SPIR-V Tools.
          # The updater must be run from the glslang checkout itself because
          # it reads known_good.json relative to its current directory.
          test -f 3rdparty/glslang/update_glslang_sources.py
          test -f 3rdparty/glslang/known_good.json
          cd 3rdparty/glslang
          python3 update_glslang_sources.py
          cd ../..

          set +e
          gradle --no-daemon --stacktrace             -p android-plugin             -Pmobilegl.abis=arm64-v8a             :app:assembleRelease
          GRADLE_STATUS=$?
          set -e

          if [ "$GRADLE_STATUS" -ne 0 ]; then
            echo "MobileGL Gradle build failed with exit code $GRADLE_STATUS"
            exit "$GRADLE_STATUS"
          fi

          APK="$(find android-plugin/app/build/outputs/apk -type f -path '*/release/*.apk' | head -n 1 || true)"
          test -n "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libMobileGL\.so$'
          mkdir -p "$WORK_ROOT/mobilegl-extracted"
          unzip -j "$APK" 'lib/arm64-v8a/libMobileGL.so' -d "$WORK_ROOT/mobilegl-extracted"
          test -f "$WORK_ROOT/mobilegl-extracted/libMobileGL.so"
          file "$WORK_ROOT/mobilegl-extracted/libMobileGL.so"

      - name: Clone RendererPlugin-v2
        run: |
          R="$WORK_ROOT/RendererPlugin-v2"
          rm -rf "$R"
          git clone --depth 1 https://github.com/ZalithLauncher/RendererPlugin-v2.git "$R"
          cd "$R"
          git checkout 1591ff84c3ddda0c95ae1e72ef1f6608cb331b7d
          git rev-parse HEAD
          test -f gradlew
          test -f app/build.gradle.kts

      - name: Prepare renderer plugin libraries
        run: |
          J="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$J"
          mkdir -p "$J"
          cp "$WORK_ROOT/mobilegl-extracted/libMobileGL.so" "$J/libMobileGL.so"
          # Turnip is shipped separately as a Zalith/FCL driver plugin.
          # Keeping it out of the renderer APK prevents two independent driver
          # copies from being mistaken for the selected Vulkan driver.
          find "$MESA_INSTALL_DIR" -name "libEGL_mesa.so" -type f -exec cp {} "$J/libEGL_mesa.so" \; -quit
          find "$MESA_INSTALL_DIR" -name "libGLESv2_mesa.so" -type f -exec cp {} "$J/libGLESv2_mesa.so" \; -quit || true
          find "$MESA_INSTALL_DIR" -name "libgallium_dri.so" -type f -exec cp {} "$J/libzink_dri.so" \; -quit
          for lib in libglapi.so libexpat.so libxml2.so libarchive.so; do
            F="$(find "$MESA_INSTALL_DIR" -name "$lib" -type f | head -n 1 || true)"
            [ -z "$F" ] || cp "$F" "$J/$lib"
          done

      - name: Import IronizedZink compatibility shim
        run: |
          I="$WORK_ROOT/IronizedZink"
          J="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$I"
          git clone --depth 1 https://github.com/GoyDevv/IronizedZink.git "$I"
          X="$(find "$I" -type f -name libglxshim.so | head -n 1 || true)"
          test -n "$X"
          cp "$X" "$J/libglxshim.so"
          for lib in libcutils.so libironized_zink.so; do
            F="$(find "$I" -type f -name "$lib" | head -n 1 || true)"
            [ -z "$F" ] || cp "$F" "$J/$lib"
          done

      - name: Add Android libc++ runtime
        run: |
          J="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"
          F="$(find "$ANDROID_NDK_HOME" -type f -path '*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so' | head -n 1 || true)"
          test -n "$F"
          cp "$F" "$J/libc++_shared.so"

      - name: Verify renderer libraries
        run: |
          J="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"
          for lib in libMobileGL.so libEGL_mesa.so libzink_dri.so libc++_shared.so libglxshim.so; do
            test -f "$J/$lib" || { echo "Missing required library: $lib"; exit 1; }
            file "$J/$lib"
          done
          ls -lh "$J"

      - name: Set renderer version
        run: |
          cd "$WORK_ROOT/RendererPlugin-v2"
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          if "versionCode = 1" not in s: raise SystemExit("Expected versionCode assignment was not found")
          if 'versionName = "1.0"' not in s: raise SystemExit("Expected versionName assignment was not found")

          # The pinned RendererPlugin-v2 template defaults MobileGL to DirectGLES.
          # That routes Minecraft GL calls into the phone's closed Adreno GLES driver.
          # Our crash report shows SIGSEGV in libGLESv2_adreno.so at glDrawElements.
          # Force MobileGL to use DirectVulkan so the path is OpenGL -> MobileGL ->
          # Vulkan -> bundled Mesa Turnip instead of OpenGL -> Adreno GLES.
          replacements = {
              'defaultValue = "DirectGLES"': 'defaultValue = "DirectVulkan"',
              'put("MOBILEGL_BACKEND_TYPE", "DirectGLES")': 'put("MOBILEGL_BACKEND_TYPE", "DirectVulkan")',
          }
          for old_value, new_value in replacements.items():
              if old_value not in s:
                  raise SystemExit(f"Expected MobileGL backend setting was not found: {old_value}")
              s = s.replace(old_value, new_value)

          p.write_text(s.replace("versionCode = 1","versionCode = 463",1).replace('versionName = "1.0"','versionName = "0.46.3"',1))
          PYCODE
          grep -n -E 'versionCode|versionName' app/build.gradle.kts

      - name: Build renderer APK
        working-directory: ${{ env.WORK_ROOT }}/RendererPlugin-v2
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          D="$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug"
          compgen -G "$D/*.apk" >/dev/null || { echo "APK was not generated"; exit 1; }
          ls -lh "$D"/*.apk
          sha256sum "$D"/*.apk
          unzip -l "$D"/*.apk | grep 'lib/arm64-v8a/' | sort

      - name: Upload renderer APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Renderer-APK
          path: RendererPlugin-v2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "# MyTurnipZink 0.46.3"
            echo
            echo "- Mesa commit: \`$MESA_COMMIT\`"
            echo "- MobileGL commit: \`$MOBILEGL_COMMIT\`"
            echo "- Android API: $ANDROID_API"
            echo "- Android NDK: $ANDROID_NDK_VERSION"
            echo "- Architecture: arm64-v8a"
            echo "- Vulkan renderer backend: MobileGL DirectVulkan"
            echo "- Separate Vulkan driver APK: Turnip (Mesa $MESA_DRIVER_VERSION)"
            echo "- OpenGL: MobileGL -> DirectVulkan"
            echo "- Target GPU: Adreno 618"
            echo
            echo "APK is generated only when all required native libraries are present."
          } >> "$GITHUB_STEP_SUMMARY"
