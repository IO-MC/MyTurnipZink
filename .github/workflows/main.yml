name: Build MyTurnipZink #46

run-name: MyTurnipZink build #46

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myturnipzink-build
  cancel-in-progress: false

env:
  MESA_COMMIT: 8d68f369fc1a95bd701600f99b9c45d5da8e6068
  NDK_VERSION: 28.2.13676358
  ANDROID_PLATFORM: android-33
  VOXY_ZINK_RELEASE: prebuilt-libs
  VOXY_ZINK_ASSET: kopper-zink-arm64-v8a.tar.gz
  VOXY_ZINK_REPO: LXK-98/zalith-voxy

jobs:
  build:
    name: Build MyTurnipZink APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-pip \
            pkg-config \
            python3-mako \
            python3-yaml \
            python3-ply \
            bison \
            flex \
            gettext \
            git \
            cmake \
            ninja-build \
            glslang-tools \
            unzip \
            zip \
            patchelf \
            file \
            binutils \
            libexpat1-dev \
            libelf-dev \
            libdrm-dev \
            zlib1g-dev \
            libzstd-dev \
            libxml2-dev \
            llvm-18 \
            llvm-18-dev \
            clang-18 \
            libclang-18-dev \
            lld-18 \
            llvm-spirv-18 \
            libllvmspirv-18-dev \
            spirv-headers \
            spirv-tools

          python3 -m venv "$HOME/meson-venv"
          "$HOME/meson-venv/bin/pip" install --upgrade pip
          "$HOME/meson-venv/bin/pip" install \
            "meson>=1.4.0,<2.0" \
            packaging \
            Mako \
            PyYAML

          echo "$HOME/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Check host toolchain
        run: |
          set -eux
          java -version
          meson --version
          ninja --version
          /usr/bin/clang-18 --version
          /usr/bin/llvm-config-18 --version

      - name: Clone upstream Mesa for Turnip
        run: |
          set -eux
          rm -rf "$GITHUB_WORKSPACE/mesa"
          git clone \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            "$GITHUB_WORKSPACE/mesa"

          cd "$GITHUB_WORKSPACE/mesa"
          git checkout "$MESA_COMMIT"

          echo "=== Mesa commit ==="
          git rev-parse HEAD
          git log -1 --oneline
          grep '^project(' meson.build | head -1

      - name: Build native Mesa CLC compiler
        working-directory: mesa
        env:
          CC: /usr/bin/clang-18
          CXX: /usr/bin/clang++-18
          LLVM_CONFIG: /usr/bin/llvm-config-18
        run: |
          set -eux
          rm -rf build-compiler "$GITHUB_WORKSPACE/mesa-compiler"

          meson setup build-compiler \
            --prefix "$GITHUB_WORKSPACE/mesa-compiler" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true

          meson compile -C build-compiler -j2
          meson install -C build-compiler

          test -x "$GITHUB_WORKSPACE/mesa-compiler/bin/mesa_clc"
          "$GITHUB_WORKSPACE/mesa-compiler/bin/mesa_clc" --help >/dev/null

      - name: Add native Mesa compiler to PATH
        run: |
          set -eux
          echo "$GITHUB_WORKSPACE/mesa-compiler/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/mesa-compiler/bin:$PATH"
          command -v mesa_clc
          mesa_clc --help >/dev/null

      - name: Create Android cross file
        run: |
          set -eux
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          cat > "$GITHUB_WORKSPACE/android-aarch64.txt" <<EOF2
          [constants]
          ndk = '$NDK'

          [binaries]
          ar = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          c = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang'
          cpp = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++'
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF2

          cat "$GITHUB_WORKSPACE/android-aarch64.txt"

      - name: Check Android compiler
        run: |
          set -eux
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" --version
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" --version
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --version

      - name: Configure Mesa for Android Turnip only
        working-directory: mesa
        run: |
          set -eux
          rm -rf build "$GITHUB_WORKSPACE/install"

          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/android-aarch64.txt" \
            --prefix "$GITHUB_WORKSPACE/install" \
            --buildtype=release \
            --strip \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgles2=disabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dspirv-tools=disabled \
            -Dshader-cache=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dvulkan-drivers=freedreno \
            -Dgallium-drivers= \
            -Dfreedreno-kmds=kgsl \
            -Dallow-fallback-for=libdrm \
            -Dvulkan-beta=true

      - name: Show Mesa Turnip configuration
        working-directory: mesa
        run: |
          set -eux
          meson configure build

      - name: Build Turnip
        working-directory: mesa
        run: |
          set -eux
          meson compile -C build -j2 \
            src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Install Turnip
        working-directory: mesa
        run: |
          set -eux
          meson install -C build
          test -s "$GITHUB_WORKSPACE/install/lib/libvulkan_freedreno.so"

      - name: Verify Turnip output
        run: |
          set -eux
          TURNIP="$GITHUB_WORKSPACE/install/lib/libvulkan_freedreno.so"
          test -s "$TURNIP"

          echo "=== Turnip ==="
          file "$TURNIP"
          readelf -h "$TURNIP" | grep -E "Class|Machine"
          echo "--- NEEDED ---"
          readelf -d "$TURNIP" | grep NEEDED || true

      - name: Download known-working Android Kopper Zink stack
        run: |
          set -eux

          WORK="$GITHUB_WORKSPACE/kopper-prebuilt"
          rm -rf "$WORK"
          mkdir -p "$WORK/unpacked"

          BASE="https://github.com/${VOXY_ZINK_REPO}/releases/download/${VOXY_ZINK_RELEASE}"
          curl -fL --retry 5 --retry-all-errors \
            -o "$WORK/${VOXY_ZINK_ASSET}" \
            "$BASE/${VOXY_ZINK_ASSET}"
          curl -fL --retry 5 --retry-all-errors \
            -o "$WORK/SHA256SUMS" \
            "$BASE/SHA256SUMS"

          cd "$WORK"
          grep "  ${VOXY_ZINK_ASSET}$" SHA256SUMS | sha256sum -c -
          tar -xzf "$VOXY_ZINK_ASSET" -C unpacked

          echo "=== Kopper Zink payload ==="
          find unpacked -maxdepth 1 -type f -printf "%f\n" | sort

          for lib in \
            libEGL_mesa.so \
            libgallium_dri.so \
            libglxshim.so \
            libcutils.so \
            libhardware.so; do
            test -s "unpacked/$lib"
          done

      - name: Assemble renderer runtime
        run: |
          set -eux

          OUT="$GITHUB_WORKSPACE/renderer-libs"
          KZ="$GITHUB_WORKSPACE/kopper-prebuilt/unpacked"
          TURNIP="$GITHUB_WORKSPACE/install/lib/libvulkan_freedreno.so"
          NDK="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Known-working Android Kopper Zink side.  Do NOT replace these with
          # upstream Mesa 26.x Zink: upstream Android Kopper is disabled, while
          # this fork carries the Android Kopper/VULKAN_PTR integration used by
          # the working Zalith stack.
          cp "$KZ/libEGL_mesa.so" "$OUT/"
          cp "$KZ/libgallium_dri.so" "$OUT/"
          cp "$KZ/libglxshim.so" "$OUT/"
          cp "$KZ/libcutils.so" "$OUT/"
          cp "$KZ/libhardware.so" "$OUT/"

          # New upstream Turnip 26.3.0-devel built above.
          cp "$TURNIP" "$OUT/"

          # Keep the Android C++ runtime available for any Mesa-native dependency
          # that resolves it dynamically on-device.
          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -s "$LIBCXX"
          cp "$LIBCXX" "$OUT/libc++_shared.so"

          echo "=== Renderer runtime ==="
          find "$OUT" -maxdepth 1 -type f -printf "%f\n" | sort

          echo
          echo "=== Architectures ==="
          find "$OUT" -maxdepth 1 -type f -name "*.so" -print0 | xargs -0 -r file

      - name: Verify renderer runtime
        run: |
          set -eux
          OUT="$GITHUB_WORKSPACE/renderer-libs"

          for lib in \
            libvulkan_freedreno.so \
            libEGL_mesa.so \
            libgallium_dri.so \
            libglxshim.so \
            libcutils.so \
            libhardware.so \
            libc++_shared.so; do
            test -s "$OUT/$lib"
          done

          echo "=== libEGL_mesa.so NEEDED ==="
          readelf -d "$OUT/libEGL_mesa.so" | grep NEEDED || true
          echo "=== libgallium_dri.so NEEDED ==="
          readelf -d "$OUT/libgallium_dri.so" | grep NEEDED || true
          echo "=== libglxshim.so NEEDED ==="
          readelf -d "$OUT/libglxshim.so" | grep NEEDED || true
          echo "=== Turnip NEEDED ==="
          readelf -d "$OUT/libvulkan_freedreno.so" | grep NEEDED || true

          echo
          echo "=== RPATH/RUNPATH ==="
          for lib in libEGL_mesa.so libgallium_dri.so libglxshim.so libvulkan_freedreno.so; do
            echo "--- $lib ---"
            readelf -d "$OUT/$lib" | grep -E 'RPATH|RUNPATH' || true
          done

      - name: Clone RendererPlugin-v2
        run: |
          set -eux
          rm -rf "$GITHUB_WORKSPACE/RendererPlugin-v2"
          git clone --depth 1 \
            https://github.com/ZalithLauncher/RendererPlugin-v2.git \
            "$GITHUB_WORKSPACE/RendererPlugin-v2"

          cd "$GITHUB_WORKSPACE/RendererPlugin-v2"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Install renderer libraries into APK project
        run: |
          set -eux
          JNI="$GITHUB_WORKSPACE/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          rm -rf "$JNI"
          mkdir -p "$JNI"
          cp "$GITHUB_WORKSPACE/renderer-libs/"*.so "$JNI/"

          echo "=== APK native libraries ==="
          find "$JNI" -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Configure renderer APK
        run: |
          set -eux
          PROJECT="$GITHUB_WORKSPACE/RendererPlugin-v2"

          cat > "$PROJECT/app/build.gradle.kts" <<'EOF2'
          import com.launchers_plugin.renderer.buildscript.buildEnvs
          import com.launchers_plugin.renderer.buildscript.buildJsonValue
          import com.launchers_plugin.renderer.buildscript.legacyManifest
          import com.launchers_plugin.renderer.buildscript.nativePath
          import com.launchers_plugin.renderer.buildscript.renderer
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.launchers_plugin.renderer.dsl")
              alias(libs.plugins.android.application)
              id("com.google.devtools.ksp")
              id("kotlinx-serialization")
          }

          android {
              namespace = "com.launchers_plugin.renderer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.launchers_plugin.renderer.myturnipzink"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 46
                  versionName = "0.46"
              }

              buildFeatures {
                  resValues = true
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }

                  configureEach {
                      resValue("string", "app_name", "MyTurnipZink")

                      resValue("string", "config", buildJsonValue {
                          renderer(
                              displayName = "MyTurnipZink",
                              rendererId = "opengles3_desktopgl_zink_kopper",
                              rendererGLPath = nativePath("libglxshim.so"),
                              rendererEGLPath = nativePath("libEGL_mesa.so"),
                              dlopenLibPaths = emptyList(),
                              env = buildEnvs {
                                  // Exact core renderer wiring used by the known
                                  // working Android Kopper Zink stack.
                                  normal("LIBGL_ES", "3")
                                  normal("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                                  normal("LIB_MESA_NAME", "libglxshim.so")
                                  normal("MESA_GL_VERSION_OVERRIDE", "4.6")
                                  normal("MESA_GLSL_VERSION_OVERRIDE", "460")
                                  normal("allow_higher_compat_version", "true")
                                  normal("force_glsl_extensions_warn", "true")
                                  normal("allow_glsl_extension_directive_midshader", "true")
                                  normal("FD_GRALLOC_FORCE_LINEAR", "1")
                                  normal("ZINK_DEBUG", "norp")
                                  normal("force_gl_renderer", "MyTurnipZink | OpenGL 4.6")
                                  normal("force_gl_vendor", "Mesa / Turnip / Zink")
                              },
                              minMCVer = null,
                              maxMCVer = null,
                          )
                      })

                      // Legacy renderer metadata for older Zalith/FCL code paths.
                      manifestPlaceholders.putAll(legacyManifest {
                          displayName = "MyTurnipZink"
                          rendererName = "MyTurnipZink"
                          rendererLib = "libglxshim.so"
                          // Leading slash is intentional: the known Kopper Zink
                          // plugin resolves this against the renderer native dir.
                          eglLib = "/libEGL_mesa.so"
                          minMCVer = ""
                          maxMCVer = ""

                          boatEnv {
                              put("LIBGL_ES", "3")
                              put("POJAV_RENDERER", "opengles3_desktopgl_zink_kopper")
                              put("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                              put("LIB_MESA_NAME", "libglxshim.so")
                              put("MESA_GL_VERSION_OVERRIDE", "4.6")
                              put("MESA_GLSL_VERSION_OVERRIDE", "460")
                              put("allow_higher_compat_version", "true")
                              put("force_glsl_extensions_warn", "true")
                              put("allow_glsl_extension_directive_midshader", "true")
                              put("FD_GRALLOC_FORCE_LINEAR", "1")
                              put("ZINK_DEBUG", "norp")
                          }

                          pojavEnv {
                              put("LIBGL_ES", "3")
                              put("POJAV_RENDERER", "opengles3_desktopgl_zink_kopper")
                              put("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                              put("LIB_MESA_NAME", "libglxshim.so")
                              put("MESA_GL_VERSION_OVERRIDE", "4.6")
                              put("MESA_GLSL_VERSION_OVERRIDE", "460")
                              put("allow_higher_compat_version", "true")
                              put("force_glsl_extensions_warn", "true")
                              put("allow_glsl_extension_directive_midshader", "true")
                              put("FD_GRALLOC_FORCE_LINEAR", "1")
                              put("ZINK_DEBUG", "norp")
                          }
                      })
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_1_8)
              }
          }

          dependencies {
              implementation(libs.androidx.annotation)
          }
          EOF2

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:icon="@drawable/img_app"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- New renderer-plugin-v2 contract. -->
                  <meta-data
                      android:name="fclPlugin_V2"
                      android:resource="@string/config" />

                  <!-- Legacy/FCL plugin marker and renderer metadata. -->
                  <meta-data
                      android:name="fclPlugin"
                      android:value="true" />

                  <meta-data
                      android:name="des"
                      android:value="Mesa 26.3 Turnip + Android Kopper Zink" />

                  <meta-data
                      android:name="renderer"
                      android:value="${renderer}" />

                  <meta-data
                      android:name="boatEnv"
                      android:value=
