name: Build MyTurnipZink

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_COMMIT: 8d68f369fc1
  ANDROID_API: 33
  ANDROID_NDK_VERSION: 28.2.13676358
  MESA_COMPILER_DIR: ${{ github.workspace }}/mesa-compiler
  MESA_INSTALL_DIR: ${{ github.workspace }}/install

jobs:
  build:
    name: Build Mesa Zink + Turnip
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout project
      # ------------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install Linux build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            llvm-dev \
            libclang-18-dev \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            bison \
            flex \
            gettext \
            glslang-tools \
            libdrm-dev \
            libexpat1-dev \
            libelf-dev \
            libxml2-dev \
            libarchive-dev \
            ninja-build \
            unzip \
            zip \
            wget \
            git

          # Do NOT rely on Ubuntu's Meson package.
          # Install Meson/Mako into the exact Python interpreter
          # that will be used by Mesa.
          python3 -m pip install \
            --break-system-packages \
            "meson>=1.4" \
            "mako>=1.2"

          python3 -m meson --version
          python3 -c "import mako; print('Mako:', mako.__version__)"

      # ------------------------------------------------------------
      # 3. Java 21
      # ------------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ------------------------------------------------------------
      # 4. Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          CMDLINE_TOOLS=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools/latest/bin"
          else
            for d in "$SDK_ROOT"/cmdline-tools/*/bin; do
              if [ -x "$d/sdkmanager" ]; then
                CMDLINE_TOOLS="$d"
                break
              fi
            done
          fi

          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"

          yes | "$CMDLINE_TOOLS/sdkmanager" --licenses >/dev/null || true

          "$CMDLINE_TOOLS/sdkmanager" --version

      # ------------------------------------------------------------
      # 5. Install Android SDK packages
      # ------------------------------------------------------------
      - name: Install Android SDK packages
        run: |
          set -eux

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          yes | sdkmanager --licenses >/dev/null || true

      # ------------------------------------------------------------
      # 6. Export Android NDK environment
      # ------------------------------------------------------------
      - name: Export Android NDK environment
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          NDK_ROOT="$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"

          test -d "$NDK_ROOT"

          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # 7. Verify toolchain
      # ------------------------------------------------------------
      - name: Verify toolchain
        run: |
          set -eux

          echo "=== Java ==="
          java -version

          echo "=== Python ==="
          python3 --version
          python3 -m pip --version
          python3 -m meson --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== Clang ==="
          clang --version

          echo "=== Android NDK ==="
          "$ANDROID_NDK_ROOT/ndk-build" --version

          echo "=== Android clang ==="
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" \
            --version

      # ------------------------------------------------------------
      # 8. Clone Mesa
      # ------------------------------------------------------------
      - name: Clone Mesa
        run: |
          set -eux

          rm -rf mesa

          git clone \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            mesa

          cd mesa

          # The requested commit is not available from a shallow
          # single-ref fetch, so fetch the repository history first.
          git fetch --unshallow origin

          git checkout "$MESA_COMMIT"

          echo "Mesa commit:"
          git rev-parse HEAD

          echo "Mesa describe:"
          git describe --always --tags --dirty || true

      # ------------------------------------------------------------
      # 9. Prepare native Mesa compiler
      # ------------------------------------------------------------
      - name: Prepare Mesa native compiler
        run: |
          set -eux

          cd mesa

          rm -rf "$MESA_COMPILER_DIR"

          # IMPORTANT:
          # Use python3 -m meson rather than calling a separate
          # /usr/bin/meson executable. This fixes the Action #51
          # failure where /usr/bin/python3 could not import meson.

          python3 -m meson setup "$MESA_COMPILER_DIR" \
            --prefix "$MESA_COMPILER_DIR/install" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dllvm=enabled \
            -Dbuild-tests=false

          python3 -m meson compile \
            -C "$MESA_COMPILER_DIR" \
            -j "$(nproc)"

          python3 -m meson install \
            -C "$MESA_COMPILER_DIR"

          echo "Native Mesa compiler contents:"
          find "$MESA_COMPILER_DIR" -maxdepth 4 -type f \
            \( -name 'mesa_clc' -o -name 'mesa_clc*' \) -print

      # ------------------------------------------------------------
      # 10. Add native Mesa compiler to PATH
      # ------------------------------------------------------------
      - name: Add native Mesa compiler to PATH
        run: |
          set -eux

          COMPILER_BIN="$MESA_COMPILER_DIR/bin"

          test -d "$COMPILER_BIN"

          echo "$COMPILER_BIN" >> "$GITHUB_PATH"

          export PATH="$COMPILER_BIN:$PATH"

          command -v mesa_clc
          mesa_clc --help >/dev/null

      # ------------------------------------------------------------
      # 11. Prepare Mesa source dependencies
      # ------------------------------------------------------------
      - name: Prepare Mesa source dependencies
        run: |
          set -eux

          cd mesa

          # Prevent Android cross-build from pulling libarchive
          # fallback and attempting to build unnecessary host/target
          # archive dependencies.
          rm -f subprojects/libarchive.wrap

          # Show relevant subprojects.
          ls -la subprojects || true

      # ------------------------------------------------------------
      # 12. Create Android cross file
      # ------------------------------------------------------------
      - name: Create Android cross file
        run: |
          set -eux

          cat > android-aarch64.txt <<EOF
          [binaries]
          c = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          ranlib = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
          ld = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [properties]
          needs_exe_wrapper = true
          sys_root = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          cat android-aarch64.txt

      # ------------------------------------------------------------
      # 13. Create native Meson file
      # ------------------------------------------------------------
      - name: Create native Meson file
        run: |
          set -eux

          cat > native.txt <<EOF
          [binaries]
          c = '/usr/bin/clang'
          cpp = '/usr/bin/clang++'
          ar = '/usr/bin/llvm-ar'
          strip = '/usr/bin/llvm-strip'
          ranlib = '/usr/bin/llvm-ranlib'
          pkg-config = '/usr/bin/pkg-config'
          python = '/usr/bin/python3'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

          cat native.txt

      # ------------------------------------------------------------
      # 14. Configure Mesa Android Zink + Turnip
      # ------------------------------------------------------------
      - name: Configure Mesa
        run: |
          set -eux

          cd mesa

          rm -rf build "$MESA_INSTALL_DIR"

          mkdir -p "$MESA_INSTALL_DIR"

          export PATH="$MESA_COMPILER_DIR/bin:$PATH"

          command -v mesa_clc
          mesa_clc --help >/dev/null

          python3 -m meson setup build \
            --cross-file ../android-aarch64.txt \
            --native-file ../native.txt \
            --prefix "$MESA_INSTALL_DIR" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version="$ANDROID_API" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Degl-lib-suffix=_mesa \
            -Dgles-lib-suffix=_mesa \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dspirv-tools=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dshader-cache=disabled \
            -Dbuild-tests=false

      # ------------------------------------------------------------
      # 15. Build Mesa
      # ------------------------------------------------------------
      - name: Build Mesa
        run: |
          set -eux

          cd mesa

          python3 -m meson compile \
            -C build \
            -j "$(nproc)"

      # ------------------------------------------------------------
      # 16. Install Mesa
      # ------------------------------------------------------------
      - name: Install Mesa
        run: |
          set -eux

          cd mesa

          python3 -m meson install \
            -C build

          echo "=== Installed Mesa files ==="
          find "$MESA_INSTALL_DIR" -type f -print | sort

      # ------------------------------------------------------------
      # 17. Inspect built libraries
      # ------------------------------------------------------------
      - name: Inspect Mesa libraries
        run: |
          set -eux

          echo "=== Vulkan ==="
          find "$MESA_INSTALL_DIR" -type f \
            -name 'libvulkan_freedreno.so' -print

          echo "=== Gallium ==="
          find "$MESA_INSTALL_DIR" -type f \
            -name 'libgallium_dri.so' -print

          echo "=== EGL ==="
          find "$MESA_INSTALL_DIR" -type f \
            -name 'libEGL_mesa.so' -print

          echo "=== GLES ==="
          find "$MESA_INSTALL_DIR" -type f \
            -name 'libGLESv2_mesa.so' -print

          echo "=== Architecture checks ==="

          for f in \
            "$MESA_INSTALL_DIR/lib/libvulkan_freedreno.so" \
            "$MESA_INSTALL_DIR/lib/libgallium_dri.so" \
            "$MESA_INSTALL_DIR/lib/libEGL_mesa.so" \
            "$MESA_INSTALL_DIR/lib/libGLESv2_mesa.so"
          do
            if [ -f "$f" ]; then
              echo "--- $f"
              file "$f"
            fi
          done

      # ------------------------------------------------------------
      # 18. Prepare renderer plugin libraries
      # ------------------------------------------------------------
      - name: Prepare renderer plugin libraries
        run: |
          set -eux

          LIB_DIR="RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          rm -rf "$LIB_DIR"
          mkdir -p "$LIB_DIR"

          # Mesa Vulkan Turnip
          cp \
            "$MESA_INSTALL_DIR/lib/libvulkan_freedreno.so" \
            "$LIB_DIR/libvulkan_freedreno.so"

          # Mesa EGL
          cp \
            "$MESA_INSTALL_DIR/lib/libEGL_mesa.so" \
            "$LIB_DIR/libEGL_mesa.so"

          # Mesa GLES
          if [ -f "$MESA_INSTALL_DIR/lib/libGLESv2_mesa.so" ]; then
            cp \
              "$MESA_INSTALL_DIR/lib/libGLESv2_mesa.so" \
              "$LIB_DIR/libGLESv2_mesa.so"
          fi

          # Zink Gallium driver.
          # Mesa installs this as libgallium_dri.so; the Android
          # loader configuration expects the Zink DRI name.
          cp \
            "$MESA_INSTALL_DIR/lib/libgallium_dri.so" \
            "$LIB_DIR/libzink_dri.so"

          # Optional Mesa support libraries.
          for f in \
            libglapi.so \
            libexpat.so \
            libxml2.so \
            libarchive.so
          do
            if [ -f "$MESA_INSTALL_DIR/lib/$f" ]; then
              cp "$MESA_INSTALL_DIR/lib/$f" "$LIB_DIR/$f"
            fi
          done

          echo "=== Mesa plugin libraries ==="
          ls -lh "$LIB_DIR"

      # ------------------------------------------------------------
      # 19. Import IronizedZink shim
      # ------------------------------------------------------------
      - name: Import IronizedZink compatibility shim
        run: |
          set -eux

          LIB_DIR="RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          TMP_DIR="$RUNNER_TEMP/ironizedzink"

          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          git clone \
            --depth=1 \
            https://github.com/GoyDevv/IronizedZink.git \
            "$TMP_DIR"

          echo "=== Search IronizedZink native libraries ==="

          find "$TMP_DIR" \
            -type f \
            \( \
              -name 'libglxshim.so' \
              -o -name 'libcutils.so' \
              -o -name 'libironized_zink.so' \
            \) \
            -print

          # Copy only arm64-v8a versions.
          for name in \
            libglxshim.so \
            libcutils.so \
            libironized_zink.so
          do
            src="$(find "$TMP_DIR" \
              -path '*arm64-v8a*' \
              -type f \
              -name "$name" \
              -print -quit || true)"

            if [ -n "$src" ]; then
              cp "$src" "$LIB_DIR/$name"
              echo "Copied $name"
            else
              echo "Optional library not found: $name"
            fi
          done

      # ------------------------------------------------------------
      # 20. Add libc++ shared library
      # ------------------------------------------------------------
      - name: Add Android libc++ runtime
        run: |
          set -eux

          LIB_DIR="RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          CXX_LIB="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          if [ ! -f "$CXX_LIB" ]; then
            CXX_LIB="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib64/clang/19/lib/linux/aarch64/libc++_shared.so"
          fi

          test -f "$CXX_LIB"

          cp "$CXX_LIB" "$LIB_DIR/libc++_shared.so"

          ls -lh "$LIB_DIR/libc++_shared.so"

      # ------------------------------------------------------------
      # 21. Verify renderer library directory
      # ------------------------------------------------------------
      - name: Verify renderer libraries
        run: |
          set -eux

          LIB_DIR="RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          test -f "$LIB_DIR/libvulkan_freedreno.so"
          test -f "$LIB_DIR/libEGL_mesa.so"
          test -f "$LIB_DIR/libzink_dri.so"
          test -f "$LIB_DIR/libc++_shared.so"

          if [ -f "$LIB_DIR/libglxshim.so" ]; then
            echo "libglxshim.so: present"
          else
            echo "WARNING: libglxshim.so missing"
          fi

          echo "=== Final native library list ==="
          ls -lah "$LIB_DIR"

      # ------------------------------------------------------------
      # 22. Set renderer version
      # ------------------------------------------------------------
      - name: Set renderer version
        run: |
          set -eux

          GRADLE_FILE="RendererPlugin-v2/app/build.gradle"

          if [ -f "$GRADLE_FILE" ]; then
            sed -i \
              's/versionCode[[:space:]]\+[0-9]\+/versionCode 462/' \
              "$GRADLE_FILE" || true

            sed -i \
              's/versionName[[:space:]]\+["'\''][^"'\'']*["'\'']/versionName "0.46.2"/' \
              "$GRADLE_FILE" || true

            echo "=== Renderer version ==="
            grep -nE 'versionCode|versionName' "$GRADLE_FILE" || true
          fi

      # ------------------------------------------------------------
      # 23. Build Android APK
      # ------------------------------------------------------------
      - name: Build renderer APK
        working-directory: RendererPlugin-v2
        run: |
          set -eux

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ------------------------------------------------------------
      # 24. Verify APK
      # ------------------------------------------------------------
      - name: Verify APK
        run: |
          set -eux

          APK="$(find RendererPlugin-v2/app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"
          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "APK file:"
          file "$APK"

      # ------------------------------------------------------------
      # 25. Upload renderer APK
      # ------------------------------------------------------------
      - name: Upload renderer APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-APK
          path: RendererPlugin-v2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      # ------------------------------------------------------------
      # 26. Build summary
      # ------------------------------------------------------------
      - name: Build summary
        if: always()
        run: |
          {
            echo "## MyTurnipZink 0.46.2"
            echo
            echo "- Mesa commit: \`$MESA_COMMIT\`"
            echo "- Mesa version: 26.3.0-devel"
            echo "- Android API: $ANDROID_API"
            echo "- Android NDK: $ANDROID_NDK_VERSION"
            echo "- Architecture: arm64-v8a"
            echo "- Vulkan driver: Freedreno / Turnip"
            echo "- OpenGL layer: Zink"
            echo "- Renderer: OpenGL 4.6 via Zink/Kopper"
            echo
            echo "### Build status"
            if [ -f RendererPlugin-v2/app/build/outputs/apk/debug/*.apk ]; then
              echo "- APK: generated"
            else
              echo "- APK: not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
