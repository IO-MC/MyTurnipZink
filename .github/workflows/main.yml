name: Build MyTurnipZink Renderer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Mesa Zink + Turnip
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout MyTurnipZink
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake meson ninja-build pkg-config python3 python3-mako python3-pip python3-setuptools python3-wheel flex bison glslang-tools libdrm-dev libexpat1-dev libffi-dev libgbm-dev libllvm-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-glx0-dev libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb1-dev libxdamage-dev libxext-dev libxfixes-dev libxshmfence-dev libxxf86vm-dev wayland-protocols x11proto-dev

      - name: Set versions
        run: |
          echo "MESA_REF=mesa-26.2.3" >> "$GITHUB_ENV"
          echo "MESA_INSTALL_DIR=$GITHUB_WORKSPACE/mesa-install" >> "$GITHUB_ENV"
          echo "RENDERER_DIR=$GITHUB_WORKSPACE/renderer" >> "$GITHUB_ENV"

      - name: Clone Mesa
        run: git clone --depth 1 --branch "$MESA_REF" https://gitlab.freedesktop.org/mesa/mesa.git mesa

      - name: Build and install Mesa
        working-directory: mesa
        run: |
          meson setup build "$MESA_INSTALL_DIR" \
            --prefix="$MESA_INSTALL_DIR" \
            --buildtype=release \
            -Dplatforms=android \
            -Dgallium-drivers=zink,freedreno \
            -Dvulkan-drivers=freedreno \
            -Dglx=dri \
            -Degl=enabled \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dopengl=true \
            -Dllvm=disabled \
            -Dshared-glapi=enabled \
            -Dandroid-stub=true \
            -Dbuild-tests=false
          meson compile -C build
          meson install -C build
          echo "Important Mesa libraries:"
          find "$MESA_INSTALL_DIR" \( -name "libvulkan_freedreno.so" -o -name "libgallium_dri.so" -o -name "libEGL_mesa.so" -o -name "libGLESv2_mesa.so" -o -name "libglapi.so*" \) -type f -exec file {} \;

      - name: Clone RendererPlugin-v2
        run: git clone --depth 1 https://github.com/ZalithLauncher/RendererPlugin-v2.git "$RENDERER_DIR"

      - name: Prepare renderer plugin libraries
        run: |
          J="$RENDERER_DIR/src/main/jniLibs/arm64-v8a"
          mkdir -p "$J"
          EGL_LIB="$(find "$MESA_INSTALL_DIR" -type f -name 'libEGL_mesa.so' | head -n 1 || true)"
          GALLIUM_LIB="$(find "$MESA_INSTALL_DIR" -type f -name 'libgallium_dri.so' | head -n 1 || true)"
          GLAPI_LIB="$(find "$MESA_INSTALL_DIR" -type f \( -name 'libglapi.so' -o -name 'libglapi.so.*' \) | sort | head -n 1 || true)"
          echo "Mesa GLAPI candidates:"
          find "$MESA_INSTALL_DIR" -type f -name 'libglapi.so*' -print || true
          test -n "$EGL_LIB"
          test -n "$GALLIUM_LIB"
          test -n "$GLAPI_LIB"
          cp "$EGL_LIB" "$J/libEGL_mesa.so"
          cp "$GALLIUM_LIB" "$J/libgallium_dri.so"
          cp "$GLAPI_LIB" "$J/libglapi.so"

      - name: Build renderer
        working-directory: renderer
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK="$(find "$RENDERER_DIR" -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify renderer APK
        run: |
          APK="${{ steps.apk.outputs.apk }}"
          mkdir -p apk-check
          unzip -q "$APK" -d apk-check
          test -f apk-check/lib/arm64-v8a/libEGL_mesa.so
          test -f apk-check/lib/arm64-v8a/libgallium_dri.so
          test -f apk-check/lib/arm64-v8a/libglapi.so
          test -f apk-check/lib/arm64-v8a/libglxshim.so
          test -f apk-check/lib/arm64-v8a/libc++_shared.so
          test ! -f apk-check/lib/arm64-v8a/libzink_dri.so
          test ! -f apk-check/lib/arm64-v8a/libMobileGL.so
          echo "ELF dependencies of libEGL_mesa.so:"
          readelf -d apk-check/lib/arm64-v8a/libEGL_mesa.so | grep NEEDED || true
          echo "GLAPI symbols:"
          readelf -Ws apk-check/lib/arm64-v8a/libglapi.so | grep -E '_mesa_glapi|glapi' | head -n 30 || true

      - name: Upload renderer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Renderer-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          
