name: Build MyTurnipZink

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_REF: mesa-26.2.3
  MESA_VERSION: "26.2.3"
  MESA_SHA256: "1628058a8d2c0615975de5a15ab7bbb9638c50000b5bed9456ff423ea034a81f"

  ANDROID_API: 33
  ANDROID_NDK_VERSION: 28.2.13676358

  TURNIP_ANDROID_API: 30
  TURNIP_NDK_VERSION: 30.0.14904198

  WORK_ROOT: ${{ github.workspace }}
  MESA_DIR: ${{ github.workspace }}/mesa
  MESA_COMPILER_DIR: ${{ github.workspace }}/mesa-compiler
  MESA_INSTALL_DIR: ${{ github.workspace }}/install
  TURNIP_INSTALL_DIR: ${{ github.workspace }}/turnip-install
  MESON_VENV: ${{ github.workspace }}/meson-venv

jobs:
  build:
    name: Build Mesa Zink + Turnip APK + RendererPlugin
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            llvm-dev \
            libclang-18-dev \
            pkg-config \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            bison \
            flex \
            gettext \
            libdrm-dev \
            libexpat1-dev \
            libelf-dev \
            libxml2-dev \
            libarchive-dev \
            ninja-build \
            cmake \
            spirv-headers \
            spirv-tools \
            glslang-tools \
            unzip \
            zip \
            wget \
            curl \
            git

          rm -rf "$MESON_VENV"

          python3 -m venv "$MESON_VENV"

          "$MESON_VENV/bin/python" -m pip install --upgrade pip

          "$MESON_VENV/bin/python" -m pip install \
            "meson>=1.4,<2.0" \
            "mako>=1.2" \
            PyYAML \
            packaging

          echo "$MESON_VENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$MESON_VENV" >> "$GITHUB_ENV"
          echo "PATH=$MESON_VENV/bin:$PATH" >> "$GITHUB_ENV"

      - name: Verify shader tools
        run: |
         set -eux
         command -v glslangValidator
         glslangValidator --version
         command -v spirv-as
         spirv-as --version

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          set -eux

          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -u+x | head -n1 || true)"

          test -n "$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "ndk;${TURNIP_NDK_VERSION}" \
            "ndk;27.3.13750724"

      - name: Export Android NDK environment
        run: |
          set -eux

          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          TURNIP_NDK_HOME="$ANDROID_HOME/ndk/$TURNIP_NDK_VERSION"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "TURNIP_NDK_HOME=$TURNIP_NDK_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -eux

          /usr/bin/llvm-config --version
          "$MESON_VENV/bin/meson" --version
          ninja --version
          clang --version | head -n1
          java -version

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" \
            --version | head -n1

          "$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${TURNIP_ANDROID_API}-clang" \
            --version | head -n1

      - name: Clone Mesa
        run: |
          set -eux

          rm -rf "$MESA_DIR"

          git clone --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            "$MESA_DIR"

          cd "$MESA_DIR"

          git rev-parse HEAD

          VERSION="$(tr -d '\r\n' < VERSION)"

          test "$VERSION" = "$MESA_VERSION"

          echo "MESA_VERSION=$VERSION" >> "$GITHUB_ENV"

          curl -L --fail --silent --show-error \
            -o /tmp/mesa.tar.xz \
            "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"

          echo "${MESA_SHA256}  /tmp/mesa.tar.xz" | sha256sum -c

      - name: Build SPIR-V LLVM Translator
        run: |
          set -eux

          T="$WORK_ROOT/SPIRV-LLVM-Translator"
          B="$WORK_ROOT/spirv-llvm-translator-build"
          H="$WORK_ROOT/SPIRV-Headers"

          rm -rf "$T" "$B" "$H"

          git clone --depth 1 --branch llvm_release_180 \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git \
            "$T"

          git clone --depth 1 \
            https://github.com/KhronosGroup/SPIRV-Headers.git \
            "$H"

          cmake -S "$T" -B "$B" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF \
            -DLLVM_SPIRV_BUILD_EXTERNAL=ON \
            -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR="$H"

          cmake --build "$B" \
            --target llvm-spirv \
            -j"$(nproc)"

          sudo cmake --install "$B"

          echo "/usr/local/lib" | \
            sudo tee /etc/ld.so.conf.d/llvm-spirv.conf >/dev/null

          sudo ldconfig

          {
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          } >> "$GITHUB_ENV"

          test -x /usr/local/bin/llvm-spirv
          test -f /usr/local/lib/pkgconfig/LLVMSPIRVLib.pc

          pkg-config --modversion LLVMSPIRVLib

      - name: Prepare Mesa native compiler
        run: |
          set -eux

          rm -rf "$MESA_COMPILER_DIR"

          HOST_PATH="$(printf '%s' "$PATH" | tr ':' '\n' \
            | grep -v "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            | paste -sd: -)"

          export PATH="$HOST_PATH"
          export LLVM_CONFIG=/usr/bin/llvm-config

          "$MESON_VENV/bin/meson" setup \
            "$MESA_COMPILER_DIR" \
            "$MESA_DIR" \
            --prefix="$MESA_COMPILER_DIR/install" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dllvm=enabled \
            -Dbuild-tests=false

          "$MESON_VENV/bin/meson" compile \
            -C "$MESA_COMPILER_DIR" \
            -j"$(nproc)"

          "$MESON_VENV/bin/meson" install \
            -C "$MESA_COMPILER_DIR"

          echo "$MESA_COMPILER_DIR/install/bin" >> "$GITHUB_PATH"

      - name: Prepare Mesa Android dependencies
        run: |
          set -eux

          rm -f "$MESA_DIR/subprojects/libarchive.wrap"

          python3 - <<'PYCODE'
          from pathlib import Path

          p = Path("mesa/meson.build")
          s = p.read_text()

          old = """dep_elf = dependency('libelf', required : false)
          if not with_platform_windows and not dep_elf.found()
            dep_elf = cc.find_library('elf', required : false)
          endif
          """

          if old not in s:
              raise SystemExit(
                  "Expected Mesa libelf detection block was not found"
              )

          p.write_text(
              s.replace(
                  old,
                  "dep_elf = null_dep\n",
                  1
              )
          )
          PYCODE

          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          p = Path("mesa/meson.build")
          s = p.read_text()

          pat = re.compile(
              r"dep_zlib\s*=\s*dependency\(\s*'zlib'.*?"
              r"required\s*:\s*get_option\('zlib'\)\s*,?\s*\)"
              r"\s*if\s+dep_zlib\.found\(\)\s*pre_args\s*\+=\s*'-DHAVE_ZLIB'\s*endif",
              re.DOTALL,
          )

          rep = """if with_platform_android
            dep_zlib = cc.find_library('z', required : get_option('zlib'))
          else
            dep_zlib = dependency(
              'zlib',
              version : '>= 1.2.3',
              allow_fallback: true,
              required : get_option('zlib')
            )
          endif
          if dep_zlib.found()
            pre_args += '-DHAVE_ZLIB'
          endif"""

          s, n = pat.subn(rep, s, count=1)

          if n != 1:
              raise SystemExit(
                  "Expected Mesa zlib detection block was not found"
              )

          p.write_text(s)
          PYCODE

      - name: Create Mesa cross files
        run: |
          set -eux

          cat > "$WORK_ROOT/android-aarch64.txt" <<EOF
          [binaries]
          c = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          ranlib = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
          ld = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          cat > "$WORK_ROOT/native.txt" <<EOF
          [binaries]
          c = '/usr/bin/clang'
          cpp = '/usr/bin/clang++'
          ar = '/usr/bin/llvm-ar'
          strip = '/usr/bin/llvm-strip'
          ranlib = '/usr/bin/llvm-ranlib'
          ld = '/usr/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'
          python = '$MESON_VENV/bin/python'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

          cat > "$WORK_ROOT/android-turnip-aarch64.txt" <<EOF
          [binaries]
          c = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${TURNIP_ANDROID_API}-clang'
          cpp = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${TURNIP_ANDROID_API}-clang++'
          ar = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          ranlib = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
          ld = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Configure Mesa Zink/Kopper + Turnip
        working-directory: ${{ env.MESA_DIR }}
        run: |
          set -eux

          rm -rf build

          "$MESON_VENV/bin/meson" setup build \
            --cross-file "$WORK_ROOT/android-aarch64.txt" \
            --native-file "$WORK_ROOT/native.txt" \
            --prefix "$MESA_INSTALL_DIR" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version="$ANDROID_API" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Degl-lib-suffix=_mesa \
            -Dgles-lib-suffix=_mesa \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dspirv-tools=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dshader-cache=disabled \
            -Dbuild-tests=false

      - name: Build and install Mesa Zink/Kopper
        working-directory: ${{ env.MESA_DIR }}
        run: |
          set -eux

          "$MESON_VENV/bin/meson" compile \
            -C build \
            -j"$(nproc)"

          "$MESON_VENV/bin/meson" install \
            -C build

          find "$MESA_INSTALL_DIR" \
            \( \
              -name 'libgallium_dri.so' \
              -o -name 'libEGL_mesa.so' \
              -o -name 'libvulkan_freedreno.so' \
            \) \
            -type f \
            -exec file {} \;

      - name: Configure standalone Turnip
        working-directory: ${{ env.MESA_DIR }}
        run: |
          set -eux

          rm -rf turnip-build "$TURNIP_INSTALL_DIR"

          "$MESON_VENV/bin/meson" setup turnip-build \
            --cross-file "$WORK_ROOT/android-turnip-aarch64.txt" \
            --native-file "$WORK_ROOT/native.txt" \
            --prefix "$TURNIP_INSTALL_DIR" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version="$TURNIP_ANDROID_API" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgles2=disabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dspirv-tools=disabled \
            -Dshared-glapi=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dshader-cache=disabled \
            -Dbuild-tests=false \
            -Db_lto=false \
            -Dcpp_rtti=false \
            -Dcpp_link_args="-static-libstdc++"

      - name: Build and install standalone Turnip
        working-directory: ${{ env.MESA_DIR }}
        run: |
          set -eux

          "$MESON_VENV/bin/meson" compile \
            -C turnip-build \
            -j"$(nproc)"

          "$MESON_VENV/bin/meson" install \
            -C turnip-build

          TURNIP_SO="$(find "$TURNIP_INSTALL_DIR" \
            -type f \
            -name 'libvulkan_freedreno.so' \
            | head -n1 || true)"

          test -n "$TURNIP_SO"

          file "$TURNIP_SO"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h "$TURNIP_SO" \
            | grep -E 'Class:.*ELF64|Machine:.*AArch64'

          echo "TURNIP_SO=$TURNIP_SO" >> "$GITHUB_ENV"

      - name: Clone RendererPlugin-v2
        run: |
          set -eux

          R="$WORK_ROOT/RendererPlugin-v2"

          rm -rf "$R"

          git clone --depth 1 \
            https://github.com/ZalithLauncher/RendererPlugin-v2.git \
            "$R"

          cd "$R"

          git checkout \
            1591ff84c3ddda0c95ae1e72ef1f6608cb331b7d

          git rev-parse HEAD

          test -f gradlew
          test -f app/build.gradle.kts

      - name: Prepare renderer native libraries
        run: |
          set -eux

          J="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          rm -rf "$J"
          mkdir -p "$J"

          EGL_LIB="$(find "$MESA_INSTALL_DIR" \
            -type f \
            -name 'libEGL_mesa.so' \
            | head -n1 || true)"

          GALLIUM_LIB="$(find "$MESA_INSTALL_DIR" \
            -type f \
            -name 'libgallium_dri.so' \
            | head -n1 || true)"

          test -n "$EGL_LIB" || {
            echo "Missing libEGL_mesa.so"
            exit 1
          }

          test -n "$GALLIUM_LIB" || {
            echo "Missing libgallium_dri.so"
            exit 1
          }

          cp "$EGL_LIB" "$J/libEGL_mesa.so"
          cp "$GALLIUM_LIB" "$J/libgallium_dri.so"

          GLAPI_SHARED="$(find "$MESA_INSTALL_DIR" \
            -type f \
            \( \
              -name 'libglapi.so' \
              -o -name 'libglapi.so.*' \
            \) \
            | sort \
            | head -n1 || true)"

          if [ -n "$GLAPI_SHARED" ]; then
            cp "$GLAPI_SHARED" "$J/libglapi.so"
          else
            GLAPI_ARCHIVE="$(find \
              "$MESA_DIR/build" \
              "$MESA_INSTALL_DIR" \
              -type f \
              -name 'libglapi.a' \
              2>/dev/null \
              | sort \
              | head -n1 || true)"

            test -n "$GLAPI_ARCHIVE" || {
              echo "Mesa libglapi.so is absent and libglapi.a was not found."

              find \
                "$MESA_DIR/build" \
                "$MESA_INSTALL_DIR" \
                -type f \
                -name 'libglapi*' \
                -print \
                2>/dev/null || true

              exit 1
            }

            API_CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"

            "$API_CLANG" \
              -shared \
              -fuse-ld=lld \
              -Wl,-soname,libglapi.so \
              -Wl,--whole-archive \
              "$GLAPI_ARCHIVE" \
              -Wl,--no-whole-archive \
              -o "$WORK_ROOT/libglapi.so"

            cp "$WORK_ROOT/libglapi.so" "$J/libglapi.so"
          fi

          I="$WORK_ROOT/IronizedZink"

          rm -rf "$I"

          git clone --depth 1 \
            https://github.com/GoyDevv/IronizedZink.git \
            "$I"

          GLXSHIM="$(find "$I" \
            -type f \
            -name 'libglxshim.so' \
            | head -n1 || true)"

          test -n "$GLXSHIM" || {
            echo "Missing libglxshim.so"
            exit 1
          }

          cp "$GLXSHIM" "$J/libglxshim.so"

      - name: Add Android libc++ runtime
        run: |
          set -eux

          J="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          CXX="$(find "$ANDROID_NDK_HOME" \
            -type f \
            -path '*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so' \
            | head -n1 || true)"

          test -n "$CXX"

          cp "$CXX" "$J/libc++_shared.so"

      - name: Verify renderer ELF dependencies
        run: |
          set -eux

          J="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          READ_ELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"

          for lib in \
            libglxshim.so \
            libglapi.so \
            libc++_shared.so \
            libgallium_dri.so \
            libEGL_mesa.so
          do
            test -s "$J/$lib"

            "$READ_ELF" -h "$J/$lib" \
              | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          done

          echo "=== libEGL_mesa.so NEEDED ==="

          "$READ_ELF" -d "$J/libEGL_mesa.so" \
            | grep NEEDED || true

          echo "=== libgallium_dri.so NEEDED ==="

          "$READ_ELF" -d "$J/libgallium_dri.so" \
            | grep NEEDED || true

          echo "=== libglapi exports ==="

          "$NM" -D "$J/libglapi.so" \
            | grep -E \
              '_mesa_glapi_get_proc_address|_mesa_glapi_tls_Dispatch'

          echo "=== GLXShim loader strings ==="

          strings "$J/libglxshim.so" \
            | grep -E \
              'POJAVEXEC_EGL|LIBEGL_NAME|SDL_EGL_LIBRARY|context init failed' \
            || true

          echo "=== Mesa version marker ==="

          strings "$J/libEGL_mesa.so" \
            | grep -E \
              'Mesa 26\.2\.3|26\.2\.3' \
            | head -n20 || true

          echo "=== Renderer libraries ==="

          ls -lh "$J"

      - name: Configure renderer as Mesa Zink/Kopper
        run: |
          set -eux

          cd "$WORK_ROOT/RendererPlugin-v2"

          python3 - <<'PYCODE'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          required = [
              'versionCode = 1',
              'versionName = "1.0"',
              'resValue("string", "config", buildJsonValue {',
              'manifestPlaceholders.putAll(legacyManifest {',
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      f"Expected template text not found: {item}"
                  )

          # Replace RendererPlugin-v2 JSON configuration.
          v2_start = s.index(
              '            resValue("string", "config", buildJsonValue {'
          )

          v2_end = s.index(
              '            })',
              v2_start
          ) + len('            })')

          v2 = "\n".join([
              '            resValue("string", "config", buildJsonValue {',
              '                renderer(',
              '                    displayName = "MyTurnipZink | Mesa Zink 26.2.3",',
              '                    rendererId = "opengles3_desktopgl_zink_kopper",',
              '                    rendererGLPath = nativePath("libglxshim.so"),',
              '                    rendererEGLPath = nativePath("libEGL_mesa.so"),',
              '                    dlopenLibPaths = listOf(',
              '                        nativePath("libglapi.so"),',
              '                        nativePath("libc++_shared.so"),',
              '                        nativePath("libgallium_dri.so"),',
              '                    ),',
              '                    env = buildEnvs {',
              '                        normal("LIBGL_NAME", nativePath("libglxshim.so"))',
              '                        normal("LIBEGL_NAME", nativePath("libEGL_mesa.so"))',
              '                        normal("POJAVEXEC_EGL", nativePath("libEGL_mesa.so"))',
              '                        normal("LIBGL_ES", "3")',
              '                        normal("MESA_LOADER_DRIVER_OVERRIDE", "zink")',
              '                    },',
              '                    minMCVer = null,',
              '                    maxMCVer = null,',
              '                )',
              '            })',
          ])

          s = s[:v2_start] + v2 + s[v2_end:]

          # Replace legacy renderer configuration.
          legacy_start = s.index(
              '            manifestPlaceholders.putAll(legacyManifest {'
          )

          legacy_end = s.index(
              '            })',
              legacy_start
          ) + len('            })')

          legacy = "\n".join([
              '            manifestPlaceholders.putAll(legacyManifest {',
              '                displayName     = "MyTurnipZink | Mesa Zink 26.2.3"',
              '                rendererName    = "MyTurnipZink | Mesa Zink 26.2.3"',
              '                rendererLib     = "/libglxshim.so"',
              '                eglLib          = "/libEGL_mesa.so"',
              '                minMCVer        = ""',
              '                maxMCVer        = ""',
              '                boatEnv {',
              '                    put("LIBGL_ES", "3")',
              '                    put("POJAV_RENDERER", "opengles3_desktopgl_zink_kopper")',
              '                    put("MESA_LOADER_DRIVER_OVERRIDE", "zink")',
              '                }',
              '                pojavEnv {',
              '                    put("LIBGL_ES", "3")',
              '                    put("POJAV_RENDERER", "opengles3_desktopgl_zink_kopper")',
              '                    put("MESA_LOADER_DRIVER_OVERRIDE", "zink")',
              '                }',
              '            })',
          ])

          s = s[:legacy_start] + legacy + s[legacy_end:]

          # App name.
          s = s.replace(
              'resValue("string","app_name","XXX Renderer")',
              'resValue("string","app_name","MyTurnipZink")',
              1,
          )

          # Renderer plugin version.
          s = s.replace(
              'versionCode = 1',
              'versionCode = 465',
              1,
          )

          s = s.replace(
              'versionName = "1.0"',
              'versionName = "0.46.5-zink"',
              1,
          )

          p.write_text(s)
          PYCODE

          echo "=== Final renderer config ==="

          grep -n -E \
            'app_name|displayName|rendererId|rendererGLPath|rendererEGLPath|dlopenLibPaths|LIBGL_NAME|LIBEGL_NAME|POJAVEXEC_EGL|LIBGL_ES|MESA_LOADER_DRIVER_OVERRIDE|versionCode|versionName' \
            app/build.gradle.kts

          test "$(grep -c \
            'nativePath("libEGL_mesa.so")' \
            app/build.gradle.kts)" -ge 1

          test "$(grep -c \
            'nativePath("libglxshim.so")' \
            app/build.gradle.kts)" -ge 1

          test "$(grep -c \
            'normal("LIBEGL_NAME", nativePath("libEGL_mesa.so"))' \
            app/build.gradle.kts)" -eq 1

          test "$(grep -c \
            'normal("POJAVEXEC_EGL", nativePath("libEGL_mesa.so"))' \
            app/build.gradle.kts)" -eq 1

      - name: Build renderer APK
        working-directory: ${{ env.WORK_ROOT }}/RendererPlugin-v2
        run: |
          set -eux

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify final renderer APK
        run: |
          set -eux

          D="$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug"

          APK="$(find "$D" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1 || true)"

          test -n "$APK"
          test -s "$APK"

          echo "=== Renderer APK ==="

          ls -lh "$APK"
          sha256sum "$APK"

          echo "=== Native libraries in renderer APK ==="

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/' \
            | sort

          for lib in \
            libglxshim.so \
            libglapi.so \
            libc++_shared.so \
            libgallium_dri.so \
            libEGL_mesa.so
          do
            unzip -l "$APK" \
              | grep -q "lib/arm64-v8a/$lib$" \
              || {
                echo "Missing $lib in renderer APK"
                exit 1
              }
          done

          if unzip -l "$APK" \
            | grep -q 'lib/arm64-v8a/libzink_dri\.so$'
          then
            echo \
              "ERROR: libzink_dri.so must not replace libgallium_dri.so"

            exit 1
          fi

          echo "=== Renderer APK native library count ==="

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/' \
            | wc -l

      - name: Clone NativeLibPlugin for Turnip APK
        run: |
          set -eux

          T="$WORK_ROOT/NativeLibPlugin"

          rm -rf "$T"

          git clone --depth 1 \
            https://github.com/ZalithLauncher/NativeLibPlugin.git \
            "$T"

          cd "$T"

          git rev-parse HEAD

          test -f gradlew
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Prepare Turnip NativeLibPlugin APK
        run: |
          set -eux

          T="$WORK_ROOT/NativeLibPlugin"
          J="$T/app/src/main/jniLibs/arm64-v8a"

          TURNIP_SO="${TURNIP_SO:-}"

          if [ -z "$TURNIP_SO" ]; then
            TURNIP_SO="$(find "$TURNIP_INSTALL_DIR" \
              -type f \
              -name 'libvulkan_freedreno.so' \
              | head -n1 || true)"
          fi

          test -n "$TURNIP_SO"
          test -s "$TURNIP_SO"

          rm -rf "$J"

          mkdir -p "$J"

          cp \
            "$TURNIP_SO" \
            "$J/libvulkan_freedreno.so"

          echo "=== Turnip native library ==="

          ls -lh "$J/libvulkan_freedreno.so"

          file "$J/libvulkan_freedreno.so"

          READ_ELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          "$READ_ELF" -h \
            "$J/libvulkan_freedreno.so" \
            | grep -E \
              'Class:.*ELF64|Machine:.*AArch64'

          echo "=== Turnip NEEDED ==="

          "$READ_ELF" -d \
            "$J/libvulkan_freedreno.so" \
            | grep NEEDED || true

      - name: Configure Turnip NativeLibPlugin
        shell: bash
        run: |
          set -eux

          PLUGIN_DIR="$WORK_ROOT/NativeLibPlugin"

          BUILD_FILE="$PLUGIN_DIR/app/build.gradle.kts"
          MANIFEST_FILE="$PLUGIN_DIR/app/src/main/AndroidManifest.xml"

          test -f "$BUILD_FILE"
          test -f "$MANIFEST_FILE"

          #
          # IMPORTANT:
          # Do NOT change namespace.
          #
          # NativeLibPlugin MainActivity.kt belongs to:
          #   com.commonlauncher.nativeplugin
          #
          # It imports/uses:
          #   com.commonlauncher.nativeplugin.R
          #
          # Therefore namespace must remain the original
          # NativeLibPlugin namespace so Android generates R
          # in the package expected by MainActivity.kt.
          #
          # Only applicationId is changed because that is the
          # installable Android package identity.
          #

          python3 - "$BUILD_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          # KEEP the original namespace unchanged.
          # Only replace applicationId.
          text, n = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.iomc.myturnipzink.turnip"',
              text,
              count=1,
          )

          if n != 1:
              raise SystemExit(
                  "Expected exactly one applicationId entry"
              )

          text, n = re.subn(
              r'versionCode\s*=\s*\d+',
              'versionCode = 26203',
              text,
              count=1,
          )

          if n != 1:
              raise SystemExit(
                  "Expected exactly one versionCode entry"
              )

          text, n = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "26.2.3-turnip"',
              text,
              count=1,
          )

          if n != 1:
              raise SystemExit(
                  "Expected exactly one versionName entry"
              )

          path.write_text(text)
          PY

          #
          # Update plugin metadata without changing the Java/Kotlin
          # source package or namespace.
          #

          python3 - "$MANIFEST_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          # Keep the existing NativeLibPlugin metadata structure.
          # Only replace user-visible label when present.
          text = text.replace(
              'android:label="@string/app_name"',
              'android:label="MyTurnipZink Turnip 26.2.3"',
          )

          text = text.replace(
              'android:label="@string/app_name"',
              'android:label="MyTurnipZink Turnip 26.2.3"',
          )

          path.write_text(text)
          PY

          echo "===== Turnip build.gradle.kts ====="

          grep -nE \
            'namespace|applicationId|versionCode|versionName' \
            "$BUILD_FILE"

          echo
          echo "===== Turnip AndroidManifest.xml ====="

          grep -nE \
            'manifest|application|FCLNativePlugin|label|des|environment|minMCVer|maxMCVer' \
            "$MANIFEST_FILE" || true

          echo
          echo "===== Verify namespace was NOT replaced ====="

          NAMESPACE_LINE="$(
            grep -E \
              '^[[:space:]]*namespace[[:space:]]*=' \
              "$BUILD_FILE" \
              | head -n1
          )"

          echo "$NAMESPACE_LINE"

          echo
          echo "===== Verify applicationId ====="

          grep -E \
            '^[[:space:]]*applicationId[[:space:]]*=' \
            "$BUILD_FILE"

          #
          # Critical sanity check:
          # MainActivity uses com.commonlauncher.nativeplugin.R,
          # therefore namespace must stay com.commonlauncher.nativeplugin.
          #

          echo "$NAMESPACE_LINE" \
            | grep -q \
              'com.commonlauncher.nativeplugin'

          grep -E \
            '^[[:space:]]*applicationId[[:space:]]*=' \
            "$BUILD_FILE" \
            | grep -q \
              'com.iomc.myturnipzink.turnip'

          grep -E \
            '^[[:space:]]*versionCode[[:space:]]*=' \
            "$BUILD_FILE" \
            | grep -q \
              '26203'

          grep -E \
            '^[[:space:]]*versionName[[:space:]]*=' \
            "$BUILD_FILE" \
            | grep -q \
              '26.2.3-turnip'

          echo
          echo "Turnip NativeLibPlugin configuration OK."

      - name: Build Turnip APK
        working-directory: ${{ env.WORK_ROOT }}/NativeLibPlugin
        run: |
          set -eux

          chmod +x ./gradlew

          echo "===== Verify NativeLibPlugin Kotlin package ====="

          grep -nE \
            'package |import .*\.R' \
            app/src/main/java/com/commonlauncher/nativeplugin/MainActivity.kt \
            || true

          echo
          echo "===== Verify Android namespace ====="

          grep -nE \
            'namespace[[:space:]]*=' \
            app/build.gradle.kts

          grep -E \
            'namespace[[:space:]]*=[[:space:]]*"com\.commonlauncher\.nativeplugin"' \
            app/build.gradle.kts

          echo
          echo "===== Verify Android applicationId ====="

          grep -E \
            'applicationId[[:space:]]*=[[:space:]]*"com\.iomc\.myturnipzink\.turnip"' \
            app/build.gradle.kts

          echo
          echo "===== Build Turnip APK ====="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify final Turnip APK
        run: |
          set -eux

          D="$WORK_ROOT/NativeLibPlugin/app/build/outputs/apk/debug"

          APK="$(find "$D" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1 || true)"

          test -n "$APK"
          test -s "$APK"

          echo "=== Turnip APK ==="

          ls -lh "$APK"
          sha256sum "$APK"

          echo "=== Native libraries in Turnip APK ==="

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/' \
            | sort

          unzip -l "$APK" \
            | grep -q \
              'lib/arm64-v8a/libvulkan_freedreno.so$' \
            || {
              echo "Missing libvulkan_freedreno.so in Turnip APK"
              exit 1
            }

          # Turnip APK should contain the Vulkan driver and not a
          # renderer library by accident.
          if unzip -l "$APK" \
            | grep -q 'lib/arm64-v8a/libEGL_mesa\.so$'
          then
            echo \
              "ERROR: Turnip APK unexpectedly contains libEGL_mesa.so"

            exit 1
          fi

          if unzip -l "$APK" \
            | grep -q 'lib/arm64-v8a/libgallium_dri\.so$'
          then
            echo \
              "ERROR: Turnip APK unexpectedly contains libgallium_dri.so"

            exit 1
          fi

          echo "=== Turnip APK manifest metadata ==="

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$AAPT" dump badging "$APK" \
            | grep -E \
              'package:|application-label:'

          echo "=== Turnip APK environment metadata ==="

          "$AAPT" dump xmltree "$APK" \
            AndroidManifest.xml \
            | grep -E \
              'FCLNativePlugin|des|environment|minMCVer|maxMCVer' \
            || true

      - name: Package standalone Turnip ZIP
        run: |
          set -eux

          TURNIP_SO="${TURNIP_SO:-}"

          if [ -z "$TURNIP_SO" ]; then
            TURNIP_SO="$(find "$TURNIP_INSTALL_DIR" \
              -type f \
              -name 'libvulkan_freedreno.so' \
              | head -n1 || true)"
          fi

          test -n "$TURNIP_SO"

          rm -rf "$WORK_ROOT/turnip-driver"

          mkdir -p \
            "$WORK_ROOT/turnip-driver/arm64-v8a"

          cp \
            "$TURNIP_SO" \
            "$WORK_ROOT/turnip-driver/arm64-v8a/libvulkan_freedreno.so"

          cat > "$WORK_ROOT/turnip-driver/README.txt" <<EOF
          MyTurnipZink Turnip driver

          Mesa: ${MESA_VERSION}
          ABI: arm64-v8a
          Target: Freedreno / Adreno 618

          Vulkan library:
            libvulkan_freedreno.so

          Test APK:
            MyTurnipZink-Turnip-Driver-APK

          Intended test:
            Minecraft 26.1.2
            ZalithLauncher2
            Adreno 618

          OpenGL renderer path:
            Minecraft
              -> OpenGL
              -> GLXShim
              -> Mesa EGL
              -> Zink/Kopper
              -> Vulkan
              -> Turnip
              -> Adreno 618

          This ZIP is kept as a raw driver archive.
          The APK is the installable NativeLibPlugin test package.
          EOF

          cd "$WORK_ROOT/turnip-driver"

          zip -r \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip" \
            .

      - name: Collect final APK paths
        run: |
          set -eux

          RENDERER_APK="$(find \
            "$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1)"

          TURNIP_APK="$(find \
            "$WORK_ROOT/NativeLibPlugin/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1)"

          test -n "$RENDERER_APK"
          test -n "$TURNIP_APK"

          echo "RENDERER_APK=$RENDERER_APK" >> "$GITHUB_ENV"
          echo "TURNIP_APK=$TURNIP_APK" >> "$GITHUB_ENV"

          echo "=== Final artifacts ==="

          ls -lh "$RENDERER_APK"
          ls -lh "$TURNIP_APK"
          ls -lh "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip"

          echo
          echo "Renderer SHA256:"
          sha256sum "$RENDERER_APK"

          echo
          echo "Turnip APK SHA256:"
          sha256sum "$TURNIP_APK"

          echo
          echo "Turnip ZIP SHA256:"
          sha256sum "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip"

      - name: Upload renderer APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Renderer-APK
          path: ${{ env.RENDERER_APK }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload Turnip APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Turnip-Driver-APK
          path: ${{ env.TURNIP_APK }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload standalone Turnip ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Turnip-Driver
          path: ${{ env.WORK_ROOT }}/MyTurnipZink-Turnip-Driver.zip
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        if: always()
        run: |
          {
            echo "# MyTurnipZink Mesa 26.2.3"
            echo

            echo "## Toolchain"
            echo
            echo "- Mesa: $MESA_VERSION"
            echo "- RendererPlugin-v2: 1591ff84c3ddda0c95ae1e72ef1f6608cb331b7d"
            echo "- Java: 21"
            echo "- Android API: $ANDROID_API"
            echo "- Renderer NDK: $ANDROID_NDK_VERSION"
            echo "- Turnip Android API: $TURNIP_ANDROID_API"
            echo "- Turnip NDK: $TURNIP_NDK_VERSION"
            echo "- ABI: arm64-v8a"
            echo

            echo "## Renderer"
            echo
            echo "- Mesa EGL: libEGL_mesa.so"
            echo "- Gallium driver: libgallium_dri.so"
            echo "- GLAPI: libglapi.so"
            echo "- GLX shim: libglxshim.so"
            echo "- libc++ runtime: libc++_shared.so"
            echo "- GLXShim -> Mesa EGL -> Zink/Kopper"
            echo

            echo "## Renderer environment"
            echo
            echo "- LIBGL_NAME=libglxshim.so"
            echo "- LIBEGL_NAME=libEGL_mesa.so"
            echo "- POJAVEXEC_EGL=libEGL_mesa.so"
            echo "- LIBGL_ES=3"
            echo "- MESA_LOADER_DRIVER_OVERRIDE=zink"
            echo

            echo "## Renderer preload"
            echo
            echo "- libglapi.so"
            echo "- libc++_shared.so"
            echo "- libgallium_dri.so"
            echo

            echo "## Turnip APK"
            echo
            echo "- Package: com.iomc.myturnipzink.turnip"
            echo "- Version: 26.2.3-turnip"
            echo "- VersionCode: 26203"
            echo "- Native library: libvulkan_freedreno.so"
            echo "- LWJGL property:"
            echo "  org.lwjgl.vulkan.libname={nativeLibraryDir}libvulkan_freedreno.so"
            echo

            echo "## Runtime target"
            echo
            echo "1. Install MyTurnipZink-Renderer-APK."
            echo "2. Install MyTurnipZink-Turnip-Driver-APK."
            echo "3. Select MyTurnipZink renderer in ZalithLauncher2."
            echo "4. Launch Minecraft 26.1.2."
            echo

            echo "## Acceptance criteria"
            echo
            echo "- Mojang logo appears."
            echo "- Menu starts."
            echo "- World loads."
            echo "- F3 reports desktop OpenGL 4.6 Compatibility Profile."
            echo "- Renderer reports zink / Turnip / Adreno 618."
            echo "- It must NOT fall back to Qualcomm OpenGL ES 3.2."
            echo

            echo "## Important diagnostic"
            echo
            echo "If Minecraft still reports:"
            echo "  OpenGL ES 3.2"
            echo "  Adreno (TM) 618"
            echo "  Qualcomm"
            echo
            echo "then the next investigation target is EGL/GLXShim loader resolution"
            echo "and not Mesa/Turnip FPS tuning."
          } >> "$GITHUB_STEP_SUMMARY"
