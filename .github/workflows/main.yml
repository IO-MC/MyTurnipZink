name: Build MyTurnipZink #46.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Mesa Zink + Turnip
    runs-on: ubuntu-24.04

    env:
      MESA_COMMIT: 8d68f369fc1
      ANDROID_API: 33
      NDK_VERSION: 28.2.13676358
      MESA_DIR: ${{ github.workspace }}/mesa
      MESA_COMPILER_DIR: ${{ github.workspace }}/mesa-compiler

    steps:
      - name: Checkout MyTurnipZink
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            p7zip-full \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            ninja-build \
            meson \
            build-essential \
            cmake \
            bison \
            flex \
            gettext \
            libexpat1-dev \
            libxml2-dev \
            libarchive-dev \
            libz-dev \
            zlib1g-dev \
            libdrm-dev \
            libelf-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxshmfence-dev \
            libxcb1-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libffi-dev \
            libssl-dev \
            libclang-18-dev \
            clang-18 \
            llvm-18 \
            llvm-18-dev \
            llvm-18-tools

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -eux

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Setup Python environment
        run: |
          set -eux

          python3 -m venv "$RUNNER_TEMP/mesa-venv"

          "$RUNNER_TEMP/mesa-venv/bin/python" -m pip install --upgrade pip

          "$RUNNER_TEMP/mesa-venv/bin/pip" install \
            "meson>=1.4" \
            mako \
            PyYAML \
            packaging

          echo "$RUNNER_TEMP/mesa-venv/bin" >> "$GITHUB_PATH"

      - name: Export Android NDK environment
        run: |
          set -eux

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -eux

          java -version
          python3 --version
          meson --version
          ninja --version

          test -d "$ANDROID_NDK_HOME"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

      - name: Clone Mesa
        run: |
          set -eux

          git clone --depth=1 \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            "$MESA_DIR"

          cd "$MESA_DIR"

          git fetch --depth=1 origin "$MESA_COMMIT"
          git checkout "$MESA_COMMIT"

          git log -1 --oneline

      - name: Prepare Mesa native compiler
        run: |
          set -eux

          cd "$MESA_DIR"

          rm -rf "$MESA_COMPILER_DIR"

          python3 -m meson setup \
            "$MESA_COMPILER_DIR" \
            --prefix="$MESA_COMPILER_DIR/install" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dllvm=enabled \
            -Dbuild-tests=false \
            -Dbuildtype=release

          python3 -m meson compile \
            -C "$MESA_COMPILER_DIR" \
            -j"$(nproc)"

          python3 -m meson install \
            -C "$MESA_COMPILER_DIR"

      - name: Add native Mesa compiler to PATH
        run: |
          set -eux

          echo "$MESA_COMPILER_DIR/bin" >> "$GITHUB_PATH"

          export PATH="$MESA_COMPILER_DIR/bin:$PATH"

          command -v mesa_clc
          mesa_clc --help >/dev/null

      - name: Create Android cross file
        run: |
          set -eux

          NDK="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p "$MESA_DIR/cross"

          cat > "$MESA_DIR/cross/android-aarch64.ini" <<EOF
          [binaries]
          c = '$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '$TOOLCHAIN/llvm-ar'
          ranlib = '$TOOLCHAIN/llvm-ranlib'
          strip = '$TOOLCHAIN/llvm-strip'
          ld = '$TOOLCHAIN/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          EOF

      - name: Create Mesa native file
        run: |
          set -eux

          cat > "$MESA_DIR/cross/native.ini" <<EOF
          [binaries]
          c = 'cc'
          cpp = 'c++'
          ar = 'ar'
          ranlib = 'ranlib'
          strip = 'strip'
          pkg-config = '/usr/bin/pkg-config'
          EOF

      - name: Configure Mesa Zink + Turnip
        run: |
          set -eux

          cd "$MESA_DIR"

          rm -rf build install

          python3 -m meson setup build \
            --cross-file "$MESA_DIR/cross/android-aarch64.ini" \
            --native-file "$MESA_DIR/cross/native.ini" \
            --prefix="$MESA_DIR/install" \
            --libdir=lib \
            --buildtype=release \
            --strip \
            -Dplatforms=android \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Degl-lib-suffix=_mesa \
            -Dgles-lib-suffix=_mesa \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dspirv-tools=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dshader-cache=disabled \
            -Dbuild-tests=false

      - name: Verify Mesa configuration
        run: |
          set -eux

          cd "$MESA_DIR"

          meson configure build | tee "$RUNNER_TEMP/mesa-config.txt"

          grep -E \
            "gallium-drivers|vulkan-drivers|freedreno-kmds|egl|gles2|glx|mesa-clc" \
            "$RUNNER_TEMP/mesa-config.txt" || true

      - name: Build Mesa
        run: |
          set -eux

          cd "$MESA_DIR"

          python3 -m meson compile \
            -C build \
            -j"$(nproc)"

      - name: Install Mesa
        run: |
          set -eux

          cd "$MESA_DIR"

          python3 -m meson install \
            -C build

      - name: Inspect Mesa output
        run: |
          set -eux

          find "$MESA_DIR/install" \
            -type f \
            \( -name "*.so" -o -name "*.so.*" \) \
            -print | sort

      - name: Prepare renderer plugin source
        run: |
          set -eux

          PLUGIN_DIR="$RUNNER_TEMP/renderer-plugin"

          git clone --depth=1 \
            https://github.com/ZalithLauncher/RendererPlugin-v2.git \
            "$PLUGIN_DIR"

          echo "PLUGIN_DIR=$PLUGIN_DIR" >> "$GITHUB_ENV"

      - name: Prepare renderer native libraries
        run: |
          set -eux

          PLUGIN_JNI="$PLUGIN_DIR/app/src/main/jniLibs/arm64-v8a"

          mkdir -p "$PLUGIN_JNI"

          MESA_LIB="$MESA_DIR/install/lib"

          echo "Mesa libraries:"
          find "$MESA_LIB" -maxdepth 1 -type f -name "*.so*" -print | sort

          test -f "$MESA_LIB/libvulkan_freedreno.so"
          test -f "$MESA_LIB/libEGL_mesa.so"
          test -f "$MESA_LIB/libGLESv2_mesa.so"

          cp -Lf \
            "$MESA_LIB/libvulkan_freedreno.so" \
            "$PLUGIN_JNI/libvulkan_freedreno.so"

          cp -Lf \
            "$MESA_LIB/libEGL_mesa.so" \
            "$PLUGIN_JNI/libEGL_mesa.so"

          cp -Lf \
            "$MESA_LIB/libGLESv2_mesa.so" \
            "$PLUGIN_JNI/libGLESv2_mesa.so"

          if [ -f "$MESA_LIB/libgallium_dri.so" ]; then
            cp -Lf \
              "$MESA_LIB/libgallium_dri.so" \
              "$PLUGIN_JNI/libzink_dri.so"
          else
            echo "ERROR: libgallium_dri.so not found"
            exit 1
          fi

          for lib in \
            libglapi.so \
            libexpat.so \
            libxml2.so \
            libarchive.so \
            libdrm.so
          do
            if [ -f "$MESA_LIB/$lib" ]; then
              cp -Lf "$MESA_LIB/$lib" "$PLUGIN_JNI/$lib"
            fi
          done

      - name: Add IronizedZink shim
        run: |
          set -eux

          IRONIZED_DIR="$RUNNER_TEMP/IronizedZink"

          git clone --depth=1 \
            https://github.com/GoyDevv/IronizedZink.git \
            "$IRONIZED_DIR"

          PLUGIN_JNI="$PLUGIN_DIR/app/src/main/jniLibs/arm64-v8a"

          find "$IRONIZED_DIR" \
            -type f \
            -name "*.so" \
            -print | sort

          SHIM="$(find "$IRONIZED_DIR" \
            -type f \
            -name "libglxshim.so" \
            | head -n 1)"

          if [ -z "$SHIM" ]; then
            echo "ERROR: libglxshim.so not found in IronizedZink"
            exit 1
          fi

          cp -Lf "$SHIM" "$PLUGIN_JNI/libglxshim.so"

          CUTILS="$(find "$IRONIZED_DIR" \
            -type f \
            -name "libcutils.so" \
            | head -n 1 || true)"

          if [ -n "$CUTILS" ]; then
            cp -Lf "$CUTILS" "$PLUGIN_JNI/libcutils.so"
          fi

          IRONIZED="$(find "$IRONIZED_DIR" \
            -type f \
            -name "libironized_zink.so" \
            | head -n 1 || true)"

          if [ -n "$IRONIZED" ]; then
            cp -Lf "$IRONIZED" "$PLUGIN_JNI/libironized_zink.so"
          fi

      - name: Add Android C++ runtime
        run: |
          set -eux

          PLUGIN_JNI="$PLUGIN_DIR/app/src/main/jniLibs/arm64-v8a"

          CXX_SHARED="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          test -f "$CXX_SHARED"

          cp -Lf \
            "$CXX_SHARED" \
            "$PLUGIN_JNI/libc++_shared.so"

      - name: Show final native payload
        run: |
          set -eux

          PLUGIN_JNI="$PLUGIN_DIR/app/src/main/jniLibs/arm64-v8a"

          find "$PLUGIN_JNI" \
            -maxdepth 1 \
            -type f \
            -name "*.so" \
            -printf "%f %s bytes\n" \
            | sort

      - name: Configure renderer metadata
        run: |
          set -eux

          APP_DIR="$PLUGIN_DIR/app"

          mkdir -p "$APP_DIR/src/main"

          cat > "$APP_DIR/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <meta-data
                      android:name="fclPlugin"
                      android:value="true" />

                  <meta-data
                      android:name="zalithRendererPlugin"
                      android:value="true" />

                  <meta-data
                      android:name="fclPlugin_V2"
                      android:value="true" />

                  <meta-data
                      android:name="renderer"
                      android:value="MyTurnipZink:libglxshim.so:libEGL_mesa.so" />

                  <meta-data
                      android:name="des"
                      android:value="Mesa 26.3-devel Zink + Turnip KGSL" />

                  <meta-data
                      android:name="pojavEnv"
                      android:value="POJAV_RENDERER=opengles3_desktopgl_zink_kopper;MESA_LOADER_DRIVER_OVERRIDE=zink;LIB_MESA_NAME=libglxshim.so;LIBGL_ES=3;MESA_GL_VERSION_OVERRIDE=4.6;MESA_GLSL_VERSION_OVERRIDE=460;force_glsl_extensions_warn=true;allow_higher_compat_version=true;allow_glsl_extension_directive_midshader=true;FD_GRALLOC_FORCE_LINEAR=1;ZINK_DEBUG=norp;force_gl_renderer=MyTurnipZink | OpenGL 4.6;force_gl_vendor=Mesa / Turnip / Zink" />

                  <meta-data
                      android:name="boatEnv"
                      android:value="POJAV_RENDERER=opengles3_desktopgl_zink_kopper;MESA_LOADER_DRIVER_OVERRIDE=zink;LIB_MESA_NAME=libglxshim.so;LIBGL_ES=3;MESA_GL_VERSION_OVERRIDE=4.6;MESA_GLSL_VERSION_OVERRIDE=460;force_glsl_extensions_warn=true;allow_higher_compat_version=true;allow_glsl_extension_directive_midshader=true;FD_GRALLOC_FORCE_LINEAR=1;ZINK_DEBUG=norp" />

              </application>

          </manifest>
          EOF

          cat > "$APP_DIR/src/main/res/values/strings.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MyTurnipZink</string>
          </resources>
          EOF

      - name: Set renderer version
        run: |
          set -eux

          APP_BUILD="$PLUGIN_DIR/app/build.gradle"

          if [ ! -f "$APP_BUILD" ]; then
            echo "ERROR: $APP_BUILD not found"
            exit 1
          fi

          python3 - "$APP_BUILD" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 461',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "0.46.1"',
              s,
              count=1
          )

          p.write_text(s)
          PY

      - name: Verify Android project
        run: |
          set -eux

          cd "$PLUGIN_DIR"

          find app/src/main \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/jniLibs/arm64-v8a

      - name: Build renderer APK
        run: |
          set -eux

          cd "$PLUGIN_DIR"

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        run: |
          set -eux

          APK_DIR="$PLUGIN_DIR/app/build/outputs/apk/debug"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          unzip -l "$APK" | grep -E \
            "lib/arm64-v8a/(libvulkan_freedreno|libEGL_mesa|libGLESv2_mesa|libzink_dri|libglxshim|libc\+\+_shared)\.so"

      - name: Check APK size
        run: |
          set -eux

          ls -lh "$APK"

      - name: Upload renderer APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        run: |
          {
            echo "## MyTurnipZink #46.1"
            echo
            echo "- Mesa commit: \`${MESA_COMMIT}\`"
            echo "- Android API: \`${ANDROID_API}\`"
            echo "- NDK: \`${NDK_VERSION}\`"
            echo "- Architecture: \`arm64-v8a\`"
            echo "- Vulkan driver: \`freedreno / Turnip\`"
            echo "- Gallium driver: \`Zink\`"
            echo "- KMD: \`KGSL\`"
            echo "- Renderer: \`opengles3_desktopgl_zink_kopper\`"
            echo "- APK: \`MyTurnipZink-APK\`"
            echo
            echo "Zink and Turnip are built from the same Mesa source tree."
            echo "libglxshim.so is supplied by IronizedZink."
          } >> "$GITHUB_STEP_SUMMARY"
