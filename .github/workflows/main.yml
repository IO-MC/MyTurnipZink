name: Build MyTurnipZink

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      MESA_VERSION: "26.2.3"
      FCL_DRIVER_COMMIT: "0ded0742f524097bb43943463a94956c64d6e96b"
      RENDERER_PLUGIN_COMMIT: "1591ff84c3ddda0c95ae1e72ef1f6608cb331b7d"
      WORK_ROOT: ${{ github.workspace }}/work
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Build dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            bc \
            bison \
            build-essential \
            ccache \
            cmake \
            flex \
            gettext \
            git \
            glslang-tools \
            libarchive-dev \
            libdrm-dev \
            libelf-dev \
            libexpat1-dev \
            libffi-dev \
            libgbm-dev \
            libglvnd-dev \
            liblua5.3-dev \
            liblz4-dev \
            libpng-dev \
            libprotobuf-c-dev \
            libssl-dev \
            libtool \
            libudev-dev \
            libunwind-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-glx0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxshmfence-dev \
            libxxf86vm-dev \
            llvm \
            lld \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            python3 \
            python3-dev \
            python3-mako \
            python3-pip \
            python3-venv \
            python3-yaml \
            spirv-tools \
            unzip \
            wget \
            xz-utils \
            zip

          # Mesa 26.2.3 requires Meson >= 1.4.0.
          # Do not rely on Ubuntu's system Meson package because it can
          # provide an older version (for example 1.3.2).
          rm -rf "$MESON_VENV"

          python3 -m venv "$MESON_VENV"

          "$MESON_VENV/bin/python" -m pip install --upgrade pip

          "$MESON_VENV/bin/python" -m pip install \
            "meson>=1.4,<2.0" \
            "mako>=1.2" \
            PyYAML \
            packaging

          # Make the venv Meson/Python the default for all following steps.
          echo "$MESON_VENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$MESON_VENV" >> "$GITHUB_ENV"
          echo "PATH=$MESON_VENV/bin:$PATH" >> "$GITHUB_ENV"

          # Verify that the workflow is using the venv Meson.
          echo "Meson path:"
          command -v meson

          echo "Meson version:"
          meson --version

          echo "Meson Python module:"
          python3 -c 'import mesonbuild; print(mesonbuild.__version__)'
          
      # ============================================================
      # 3. Verify shader / LLVM tools
      # ============================================================

      - name: Verify shader and LLVM tools
        run: |
          set -eux

          command -v glslangValidator
          glslangValidator --version

          command -v spirv-as
          spirv-as --version

          command -v llvm-config
          llvm-config --version

          command -v clang
          clang --version

      # ============================================================
      # 4. Java
      # ============================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # 5. Android SDK
      #
      # IMPORTANT:
      # This is intentionally based on the Android SDK setup that
      # passed in Run #106.
      #
      # Do NOT use android-actions/setup-android@v3 here.
      # Run #113 failed because that action attempted:
      #
      #   sdkmanager tools
      #
      # and the current runner no longer provides the legacy
      # "tools" package.
      # ============================================================

      - name: Setup Android SDK
        run: |
          set -eux

          SDK_ROOT="/usr/local/lib/android/sdk"

          SDKMANAGER="$(
            find "$SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -perm -u+x \
              | head -n1 \
              || true
          )"

          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          echo "$SDK_ROOT/platform-tools" \
            >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses \
            >/dev/null \
            || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify Android NDK
        run: |
          set -eux

          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" \
            >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" \
            >> "$GITHUB_ENV"

          test -x \
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

          test -x \
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

      # ============================================================
      # 6. Workspace
      # ============================================================
      - name: Prepare workspace
        run: |
          set -eux

          rm -rf "$WORK_ROOT"
          mkdir -p "$WORK_ROOT"

      # ============================================================
      # 7. SPIR-V LLVM Translator
      #
      # IMPORTANT:
      # LLVM on ubuntu-24.04 runner is LLVM 18.
      # Keep translator pinned to llvm_release_180.
      #
      # Do NOT clone translator HEAD because newer HEAD requires
      # LLVM 24 and will fail against the runner's LLVM 18.
      # ============================================================

      - name: Clone SPIR-V LLVM Translator
        run: |
          set -eux

          cd "$WORK_ROOT"

          git clone \
            --depth 1 \
            --branch llvm_release_180 \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git \
            SPIRV-LLVM-Translator

          git -C SPIRV-LLVM-Translator rev-parse HEAD

      - name: Build SPIR-V LLVM Translator
        run: |
          set -eux

          cd "$WORK_ROOT/SPIRV-LLVM-Translator"

          rm -rf build

          mkdir -p build
          cd build

          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$(llvm-config --cmakedir)" \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF

          ninja \
            -j"$(nproc)"

      # ============================================================
      # 8. Download Mesa 26.2.3
      # ============================================================

      - name: Download Mesa
        run: |
          set -eux

          cd "$WORK_ROOT"

          wget -O "mesa-${MESA_VERSION}.tar.xz" \
            "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"

          echo \
            "1628058a8d2c0615975de5a15ab7bbb9638c50000b5bed9456ff423ea034a81f  mesa-${MESA_VERSION}.tar.xz" \
            | sha256sum -c -

          tar -xf "mesa-${MESA_VERSION}.tar.xz"

          mv "mesa-${MESA_VERSION}" mesa

      # ============================================================
      # 9. Mesa native compiler
      # ============================================================

      - name: Configure Mesa native compiler
        run: |
          set -eux

          cd "$WORK_ROOT/mesa"

          rm -rf "$WORK_ROOT/mesa-compiler-build"

          meson setup \
            "$WORK_ROOT/mesa-compiler-build" \
            . \
            --buildtype=release \
            -Dbuild-tests=false \
            -Dllvm=enabled \
            -Dvulkan-drivers=[] \
            -Dgallium-drivers=[]

      - name: Build Mesa native compiler
        run: |
          set -eux

          meson compile \
            -C "$WORK_ROOT/mesa-compiler-build" \
            -j"$(nproc)"

      # ============================================================
      # 10. Mesa Zink / Kopper
      # ============================================================

      - name: Configure Mesa Zink/Kopper
        run: |
          set -eux

          cd "$WORK_ROOT/mesa"

          rm -rf "$WORK_ROOT/mesa-zink-build"

          meson setup \
            "$WORK_ROOT/mesa-zink-build" \
            . \
            --cross-file "$WORK_ROOT/mesa/android-arm64-cross.txt" \
            --buildtype=release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dbuild-tests=false \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dglx=dri \
            -Degl=enabled \
            -Dllvm=enabled \
            -Dzstd=disabled \
            -Dvalgrind=disabled

      - name: Build Mesa Zink/Kopper
        run: |
          set -eux

          meson compile \
            -C "$WORK_ROOT/mesa-zink-build" \
            -j"$(nproc)"

      # ============================================================
      # 11. Standalone Turnip
      # ============================================================

      - name: Configure Turnip
        run: |
          set -eux

          cd "$WORK_ROOT/mesa"

          rm -rf "$WORK_ROOT/turnip-build"

          meson setup \
            "$WORK_ROOT/turnip-build" \
            . \
            --cross-file "$WORK_ROOT/mesa/android-arm64-cross.txt" \
            --buildtype=release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dbuild-tests=false \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=freedreno \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dllvm=enabled \
            -Dzstd=disabled \
            -Dvalgrind=disabled

      - name: Build Turnip
        run: |
          set -eux

          meson compile \
            -C "$WORK_ROOT/turnip-build" \
            -j"$(nproc)"

      # ============================================================
      # 12. Locate native libraries
      # ============================================================

      - name: Locate native libraries
        run: |
          set -eux

          echo "=== Turnip ==="

          find "$WORK_ROOT/turnip-build" \
            -type f \
            -name 'libvulkan_freedreno.so' \
            -print

          echo
          echo "=== Mesa Zink ==="

          find "$WORK_ROOT/mesa-zink-build" \
            -type f \
            \( \
              -name 'libEGL_mesa.so' \
              -o -name 'libgallium_dri.so' \
              -o -name 'libzink_dri.so' \
              -o -name 'libglapi.a' \
              -o -name 'libglapi.so*' \
            \) \
            -print

      # ============================================================
      # 13. RendererPlugin-v2
      # ============================================================

      - name: Clone RendererPlugin-v2
        run: |
          set -eux

          cd "$WORK_ROOT"

          git clone \
            https://github.com/ZalithLauncher/RendererPlugin-v2.git \
            RendererPlugin-v2

          cd RendererPlugin-v2

          git checkout "$RENDERER_PLUGIN_COMMIT"

      # ============================================================
      # 14. Prepare renderer native libraries
      # ============================================================

      - name: Prepare renderer native libraries
        run: |
          set -eux

          R="$WORK_ROOT/RendererPlugin-v2"
          OUT="$R/app/src/main/jniLibs/arm64-v8a"

          mkdir -p "$OUT"

          EGL="$(find "$WORK_ROOT/mesa-zink-build" \
            -type f \
            -name 'libEGL_mesa.so' \
            | head -n1)"

          GALLIUM="$(find "$WORK_ROOT/mesa-zink-build" \
            -type f \
            -name 'libgallium_dri.so' \
            | head -n1)"

          ZINK="$(find "$WORK_ROOT/mesa-zink-build" \
            -type f \
            -name 'libzink_dri.so' \
            | head -n1)"

          test -n "$EGL"
          test -n "$GALLIUM"
          test -n "$ZINK"

          cp "$EGL" "$OUT/libEGL_mesa.so"
          cp "$GALLIUM" "$OUT/libgallium_dri.so"
          cp "$ZINK" "$OUT/libzink_dri.so"

          CXX_SHARED="$ANDROID_NDK_HOME/sources/cxx-stl/llvm-libc++/libs/arm64-v8a/libc++_shared.so"

          test -f "$CXX_SHARED"

          cp "$CXX_SHARED" \
            "$OUT/libc++_shared.so"

          if [ ! -f "$OUT/libglapi.so" ]; then

            GLAPI_A="$(find \
              "$WORK_ROOT/mesa-zink-build" \
              "$WORK_ROOT/mesa" \
              -type f \
              -name 'libglapi.a' \
              | head -n1 || true)"

            if [ -z "$GLAPI_A" ]; then
              echo "ERROR: libglapi.a not found"
              exit 1
            fi

            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
              -shared \
              -fPIC \
              -Wl,--whole-archive \
              "$GLAPI_A" \
              -Wl,--no-whole-archive \
              -ldl \
              -llog \
              -o "$OUT/libglapi.so"
          fi

          test -s "$OUT/libglapi.so"

          echo "=== Renderer native directory ==="

          ls -lh "$OUT"

      # ============================================================
      # 15. Verify renderer ELF
      # ============================================================

      - name: Verify renderer ELF
        run: |
          set -eux

          R="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          for f in \
            libEGL_mesa.so \
            libgallium_dri.so \
            libzink_dri.so \
            libglapi.so \
            libc++_shared.so
          do
            test -s "$R/$f"
            file "$R/$f"
          done

          echo
          echo "=== libEGL_mesa.so NEEDED ==="

          readelf -d \
            "$R/libEGL_mesa.so" \
            | grep NEEDED \
            || true

          echo
          echo "=== libgallium_dri.so NEEDED ==="

          readelf -d \
            "$R/libgallium_dri.so" \
            | grep NEEDED \
            || true

      # ============================================================
      # 16. Configure renderer plugin
      # ============================================================

      - name: Configure renderer plugin
        run: |
          set -eux

          cd "$WORK_ROOT/RendererPlugin-v2"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")

          p.write_text(r'''
          import com.launchers_plugin.renderer.buildscript.buildJsonValue
          import com.launchers_plugin.renderer.buildscript.buildEnvs
          import com.launchers_plugin.renderer.buildscript.legacyManifest
          import com.launchers_plugin.renderer.buildscript.nativePath
          import com.launchers_plugin.renderer.buildscript.renderer

          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.launchers_plugin.renderer.dsl")
              alias(libs.plugins.android.application)
              id("com.google.devtools.ksp")
              id("kotlinx-serialization")
          }

          android {
              namespace = "com.launchers_plugin.renderer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.iomc.myturnipzink.renderer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 26203
                  versionName = "26.2.3-zink"
              }

              buildFeatures {
                  resValues = true
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                  }

                  configureEach {
                      resValue(
                          "string",
                          "app_name",
                          "MyTurnipZink Renderer 26.2.3"
                      )

                      resValue(
                          "string",
                          "config",
                          buildJsonValue {
                              renderer(
                                  displayName = "MyTurnipZink | Mesa 26.2.3",
                                  rendererId = "myturnipzink",
                                  rendererGLPath = nativePath("libglxshim.so"),
                                  rendererEGLPath = nativePath("libEGL_mesa.so"),
                                  dlopenLibPaths = listOf(
                                      nativePath("libc++_shared.so"),
                                      nativePath("libglapi.so"),
                                      nativePath("libgallium_dri.so"),
                                      nativePath("libzink_dri.so"),
                                  ),
                                  env = buildEnvs {
                                      normal("LIBGL_ES", "3")
                                      normal(
                                          "MESA_LOADER_DRIVER_OVERRIDE",
                                          "zink"
                                      )
                                      normal(
                                          "POJAVEXEC_EGL",
                                          nativePath("libEGL_mesa.so")
                                      )
                                  },
                                  minMCVer = null,
                                  maxMCVer = null,
                              )
                          }
                      )

                      manifestPlaceholders.putAll(
                          legacyManifest {
                              displayName = "MyTurnipZink | Mesa 26.2.3"
                              rendererName = "MyTurnipZink"
                              rendererLib = "libglxshim.so"
                              eglLib = "/libEGL_mesa.so"
                              minMCVer = ""
                              maxMCVer = ""

                              boatEnv {
                                  put("LIBGL_ES", "3")
                                  put(
                                      "MESA_LOADER_DRIVER_OVERRIDE",
                                      "zink"
                                  )
                                  put(
                                      "POJAVEXEC_EGL",
                                      "libEGL_mesa.so"
                                  )
                                  put(
                                      "DLOPEN",
                                      "libc++_shared.so,libglapi.so,libgallium_dri.so,libzink_dri.so"
                                  )
                              }

                              pojavEnv {
                                  put("LIBGL_ES", "3")
                                  put(
                                      "MESA_LOADER_DRIVER_OVERRIDE",
                                      "zink"
                                  )
                                  put(
                                      "POJAVEXEC_EGL",
                                      "libEGL_mesa.so"
                                  )
                                  put(
                                      "DLOPEN",
                                      "libc++_shared.so,libglapi.so,libgallium_dri.so,libzink_dri.so"
                                  )
                              }
                          }
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_1_8)
              }
          }

          dependencies {
              implementation(libs.androidx.annotation)
          }
          ''')

          print(p.read_text())
          PY

          grep -nE \
            'applicationId|versionCode|versionName|app_name|rendererId|rendererGLPath|rendererEGLPath|dlopenLibPaths|MESA_LOADER_DRIVER_OVERRIDE|POJAVEXEC_EGL' \
            app/build.gradle.kts

      # ============================================================
      # 17. Build renderer APK
      # ============================================================

      - name: Build renderer APK
        working-directory: ${{ env.WORK_ROOT }}/RendererPlugin-v2
        run: |
          set -eux

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 18. Verify renderer APK
      # ============================================================

      - name: Verify renderer APK
        run: |
          set -eux

          D="$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug"

          APK="$(find "$D" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1)"

          test -n "$APK"
          test -s "$APK"

          ls -lh "$APK"
          sha256sum "$APK"

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/' \
            | sort

          for lib in \
            libEGL_mesa.so \
            libgallium_dri.so \
            libzink_dri.so \
            libglapi.so \
            libc++_shared.so
          do
            unzip -l "$APK" \
              | grep -q "lib/arm64-v8a/$lib"
          done

      # ============================================================
      # 19. Clone official FCL Driver plugin template
      # ============================================================

      - name: Clone FCLDriverPlugin
        run: |
          set -eux

          cd "$WORK_ROOT"

          git clone \
            https://github.com/FCL-Team/FCLDriverPlugin.git \
            FCLDriverPlugin

          cd FCLDriverPlugin

          git checkout "$FCL_DRIVER_COMMIT"

      # ============================================================
      # 20. Prepare Turnip driver native library
      # ============================================================

      - name: Prepare FCL Turnip driver
        run: |
          set -eux

          T="$WORK_ROOT/FCLDriverPlugin"

          mkdir -p \
            "$T/app/src/main/jniLibs/arm64-v8a"

          TURNIP_SO="$(find \
            "$WORK_ROOT/turnip-build" \
            -type f \
            -name 'libvulkan_freedreno.so' \
            | head -n1)"

          test -n "$TURNIP_SO"
          test -s "$TURNIP_SO"

          cp \
            "$TURNIP_SO" \
            "$T/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so"

          file \
            "$T/app/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so"

      # ============================================================
      # 21. Configure Turnip driver
      # ============================================================

      - name: Configure FCL Turnip driver
        run: |
          set -eux

          cd "$WORK_ROOT/FCLDriverPlugin"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # IMPORTANT:
          # Keep the original namespace because MainActivity.kt
          # references its original R package.
          #
          # Only applicationId changes.

          s = s.replace(
              'applicationId = "com.mio.plugin.renderer"',
              'applicationId = "com.iomc.myturnipzink.turnip"'
          )

          s = s.replace(
              'versionCode = 1',
              'versionCode = 26203'
          )

          s = s.replace(
              'versionName = "1.0"',
              'versionName = "26.2.3-turnip"'
          )

          s = s.replace(
              'resValue("string","app_name","Turnip 24.3.2")',
              'resValue("string","app_name","MyTurnipZink Turnip 26.2.3")'
          )

          s = s.replace(
              'applicationIdSuffix = ".turnip2432"',
              ''
          )

          s = s.replace(
              'manifestPlaceholders["driver"] = "Turnip 24.3.2"',
              'manifestPlaceholders["driver"] = "Turnip 26.2.3 | Adreno 618"'
          )

          p.write_text(s)
          PY

          echo "=== Driver Gradle ==="

          grep -nE \
            'namespace|applicationId|versionCode|versionName|app_name|applicationIdSuffix|manifestPlaceholders.*driver' \
            app/build.gradle.kts

          test -f \
            app/src/main/java/com/mio/plugin/renderer/MainActivity.kt

          grep -q \
            '^package com.mio.plugin.renderer$' \
            app/src/main/java/com/mio/plugin/renderer/MainActivity.kt

      # ============================================================
      # 22. Verify driver manifest template
      # ============================================================

      - name: Verify FCL Driver source metadata
        run: |
          set -eux

          T="$WORK_ROOT/FCLDriverPlugin"
          MANIFEST="$T/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          cat "$MANIFEST"

          grep -q \
            'android:name="fclPlugin"' \
            "$MANIFEST"

          grep -q \
            'android:value="true"' \
            "$MANIFEST"

          grep -q \
            'android:name="driver"' \
            "$MANIFEST"

          grep -q \
            'android:value="${driver}"' \
            "$MANIFEST"

          if grep -q \
            'FCLNativePlugin' \
            "$MANIFEST"
          then
            echo "ERROR: FCLNativePlugin metadata found."
            exit 1
          fi

      # ============================================================
      # 23. Build Turnip Driver APK
      # ============================================================

      - name: Build Turnip Driver APK
        working-directory: ${{ env.WORK_ROOT }}/FCLDriverPlugin
        run: |
          set -eux

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 24. Verify Turnip Driver APK
      # ============================================================

      - name: Verify Turnip Driver APK
        run: |
          set -eux

          T="$WORK_ROOT/FCLDriverPlugin"

          D="$T/app/build/outputs/apk/debug"

          APK="$(find "$D" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1)"

          test -n "$APK"
          test -s "$APK"

          echo "=== Turnip Driver APK ==="

          ls -lh "$APK"
          sha256sum "$APK"

          echo
          echo "=== Native libraries ==="

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/' \
            | sort

          unzip -l "$APK" \
            | grep -q \
              'lib/arm64-v8a/libvulkan_freedreno.so'

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          echo
          echo "=== APK badging ==="

          "$AAPT" dump badging "$APK"

          echo
          echo "=== APK manifest ==="

          "$AAPT" dump xmltree \
            "$APK" \
            AndroidManifest.xml \
            > "$WORK_ROOT/turnip-manifest.txt"

          cat "$WORK_ROOT/turnip-manifest.txt"

          echo
          echo "=== Required FCL driver metadata ==="

          grep -q \
            'fclPlugin' \
            "$WORK_ROOT/turnip-manifest.txt"

          grep -q \
            'driver' \
            "$WORK_ROOT/turnip-manifest.txt"

          grep -q \
            'Turnip 26.2.3' \
            "$WORK_ROOT/turnip-manifest.txt"

          echo
          echo "=== Must NOT be NativeLibPlugin ==="

          if grep -q \
            'FCLNativePlugin' \
            "$WORK_ROOT/turnip-manifest.txt"
          then
            echo "ERROR: Turnip APK is still a NativeLibPlugin."
            exit 1
          fi

          echo
          echo "FCL Turnip Driver APK verification: OK"

          echo "$APK" \
            > "$WORK_ROOT/turnip-apk-path.txt"

      # ============================================================
      # 25. Standalone Turnip ZIP
      # ============================================================

      - name: Package standalone Turnip ZIP
        run: |
          set -eux

          rm -rf \
            "$WORK_ROOT/turnip-standalone"

          mkdir -p \
            "$WORK_ROOT/turnip-standalone/lib/arm64-v8a"

          TURNIP_SO="$(find \
            "$WORK_ROOT/turnip-build" \
            -type f \
            -name 'libvulkan_freedreno.so' \
            | head -n1)"

          test -n "$TURNIP_SO"

          cp \
            "$TURNIP_SO" \
            "$WORK_ROOT/turnip-standalone/lib/arm64-v8a/libvulkan_freedreno.so"

          cd "$WORK_ROOT/turnip-standalone"

          zip -r \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip" \
            .

          cd "$WORK_ROOT"

          sha256sum \
            MyTurnipZink-Turnip-Driver.zip

      # ============================================================
      # 26. Collect artifacts
      # ============================================================

      - name: Collect final artifacts
        run: |
          set -eux

          RENDERER_APK="$(find \
            "$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1)"

          TURNIP_APK="$(cat \
            "$WORK_ROOT/turnip-apk-path.txt")"

          test -f "$RENDERER_APK"
          test -f "$TURNIP_APK"
          test -f \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip"

          cp \
            "$RENDERER_APK" \
            "$WORK_ROOT/MyTurnipZink-Renderer.apk"

          cp \
            "$TURNIP_APK" \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.apk"

          echo
          echo "=== Final files ==="

          ls -lh \
            "$WORK_ROOT/MyTurnipZink-Renderer.apk" \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.apk" \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip"

          echo
          echo "=== SHA256 ==="

          sha256sum \
            "$WORK_ROOT/MyTurnipZink-Renderer.apk" \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.apk" \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip"

      # ============================================================
      # 27. Upload Renderer APK
      # ============================================================

      - name: Upload Renderer APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Renderer-APK
          path: ${{ env.WORK_ROOT }}/MyTurnipZink-Renderer.apk
          if-no-files-found: error
          retention-days: 90

      # ============================================================
      # 28. Upload Turnip Driver APK
      # ============================================================

      - name: Upload Turnip Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Turnip-Driver-APK
          path: ${{ env.WORK_ROOT }}/MyTurnipZink-Turnip-Driver.apk
          if-no-files-found: error
          retention-days: 90

      # ============================================================
      # 29. Upload standalone ZIP
      # ============================================================

      - name: Upload standalone Turnip ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Turnip-Driver
          path: ${{ env.WORK_ROOT }}/MyTurnipZink-Turnip-Driver.zip
          if-no-files-found: error
          retention-days: 90

      # ============================================================
      # 30. Summary
      # ============================================================

      - name: Build summary
        run: |
          set -eux

          {
            echo "# MyTurnipZink"
            echo
            echo "## Mesa"
            echo "- Mesa: ${MESA_VERSION}"
            echo "- Zink/Kopper: enabled"
            echo "- Turnip/Freedreno: enabled"
            echo
            echo "## Target"
            echo "- GPU: Adreno 618"
            echo "- ABI: arm64-v8a"
            echo "- Minecraft: 26.1.2"
            echo
            echo "## Renderer"
            echo "- RendererPlugin-v2"
            echo "- Renderer ID: myturnipzink"
            echo "- EGL: libEGL_mesa.so"
            echo "- GL shim: libglxshim.so"
            echo
            echo "## Turnip Driver"
            echo "- FCLDriverPlugin"
            echo "- fclPlugin=true"
            echo "- driver=Turnip 26.2.3 | Adreno 618"
            echo "- Native library: libvulkan_freedreno.so"
            echo "- NOT FCLNativePlugin"
            echo
            echo "## Dependency fix"
            echo "- Ubuntu package: llvm-dev"
            echo "- Removed invalid package: libllvm-dev"
          } >> "$GITHUB_STEP_SUMMARY"
