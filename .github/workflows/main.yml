name: Build MyTurnipZink

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_COMMIT: 8d68f369fc1
  ANDROID_API: 33
  ANDROID_NDK_VERSION: 28.2.13676358

  WORK_ROOT: ${{ github.workspace }}
  MESA_DIR: ${{ github.workspace }}/mesa
  MESA_COMPILER_DIR: ${{ github.workspace }}/mesa-compiler
  MESA_INSTALL_DIR: ${{ github.workspace }}/install
  MESON_VENV: ${{ github.workspace }}/meson-venv

jobs:
  build:
    name: Build Mesa Zink + Turnip
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout project
      # ============================================================
      - name: Checkout project
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install Linux build dependencies
      # ============================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            llvm-dev \
            libclang-18-dev \
            pkg-config \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            bison \
            flex \
            gettext \
            glslang-tools \
            libdrm-dev \
            libexpat1-dev \
            libelf-dev \
            libxml2-dev \
            libarchive-dev \
            ninja-build \
            unzip \
            zip \
            wget \
            git

          # --------------------------------------------------------
          # IMPORTANT:
          # Use an isolated virtual environment.
          # --------------------------------------------------------

          rm -rf "$MESON_VENV"

          python3 -m venv "$MESON_VENV"

          "$MESON_VENV/bin/python" -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          "$MESON_VENV/bin/python" -m pip install \
            "meson>=1.4,<2.0" \
            "mako>=1.2"

          echo "$MESON_VENV/bin" >> "$GITHUB_PATH"

          echo "VIRTUAL_ENV=$MESON_VENV" >> "$GITHUB_ENV"
          echo "PATH=$MESON_VENV/bin:$PATH" >> "$GITHUB_ENV"

          echo "=== Python ==="
          "$MESON_VENV/bin/python" --version

          echo "=== Pip ==="
          "$MESON_VENV/bin/python" -m pip --version

          echo "=== Meson ==="
          "$MESON_VENV/bin/meson" --version

          echo "=== Mako ==="
          "$MESON_VENV/bin/python" -c \
            "import mako; print(mako.__version__)"

      # ============================================================
      # 3. Setup Java 21
      # ============================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # 4. Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          CMDLINE_TOOLS=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools/latest/bin"
          else
            for d in "$SDK_ROOT"/cmdline-tools/*/bin; do
              if [ -x "$d/sdkmanager" ]; then
                CMDLINE_TOOLS="$d"
                break
              fi
            done
          fi

          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_ROOT/cmdline-tools" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"

          yes | "$CMDLINE_TOOLS/sdkmanager" \
            --licenses >/dev/null || true

          "$CMDLINE_TOOLS/sdkmanager" --version

      # ============================================================
      # 5. Install Android SDK packages
      # ============================================================
      - name: Install Android SDK packages
        run: |
          set -eux

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          yes | sdkmanager --licenses >/dev/null || true

      # ============================================================
      # 6. Export Android NDK environment
      # ============================================================
      - name: Export Android NDK environment
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          NDK_ROOT="$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"

          test -d "$NDK_ROOT"

          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_PATH"

      # ============================================================
      # 7. Verify complete toolchain
      # ============================================================
      - name: Verify toolchain
        run: |
          set -eux

          echo "================================================"
          echo "Python"
          echo "================================================"
          which python
          python --version

          echo "================================================"
          echo "Meson"
          echo "================================================"
          which meson
          meson --version

          "$MESON_VENV/bin/meson" --version

          echo "================================================"
          echo "Mako"
          echo "================================================"
          python -c "import mako; print(mako.__version__)"

          echo "================================================"
          echo "Ninja"
          echo "================================================"
          ninja --version

          echo "================================================"
          echo "Clang"
          echo "================================================"
          clang --version

          echo "================================================"
          echo "Java"
          echo "================================================"
          java -version

          echo "================================================"
          echo "NDK"
          echo "================================================"
          "$ANDROID_NDK_ROOT/ndk-build" --version

          echo "================================================"
          echo "Android AArch64 Clang"
          echo "================================================"

          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" \
            --version

      # ============================================================
      # 8. Clone Mesa
      # ============================================================
      - name: Clone Mesa
        run: |
          set -eux

          rm -rf "$MESA_DIR"

          git clone \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            "$MESA_DIR"

          cd "$MESA_DIR"

          git fetch --unshallow origin

          git checkout "$MESA_COMMIT"

          echo "================================================"
          echo "Mesa commit"
          echo "================================================"

          git rev-parse HEAD

          echo "================================================"
          echo "Mesa description"
          echo "================================================"

          git describe --always --tags --dirty || true

      # ============================================================
      # 9. Prepare native Mesa compiler
      # ============================================================
      - name: Prepare Mesa native compiler
        run: |
          set -eux

          cd "$MESA_DIR"

          rm -rf "$MESA_COMPILER_DIR"

          "$MESON_VENV/bin/meson" setup \
            "$MESA_COMPILER_DIR" \
            --prefix="$MESA_COMPILER_DIR/install" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dllvm=enabled \
            -Dbuild-tests=false

          "$MESON_VENV/bin/meson" compile \
            -C "$MESA_COMPILER_DIR" \
            -j "$(nproc)"

          "$MESON_VENV/bin/meson" install \
            -C "$MESA_COMPILER_DIR"

          echo "================================================"
          echo "mesa_clc"
          echo "================================================"

          find "$MESA_COMPILER_DIR" \
            -type f \
            \( \
              -name mesa_clc \
              -o -name 'mesa_clc*' \
            \) \
            -print

      # ============================================================
      # 10. Add Mesa native compiler to PATH
      # ============================================================
      - name: Add native Mesa compiler to PATH
        run: |
          set -eux

          COMPILER_BIN="$MESA_COMPILER_DIR/bin"

          test -d "$COMPILER_BIN"

          echo "$COMPILER_BIN" >> "$GITHUB_PATH"

          export PATH="$COMPILER_BIN:$MESON_VENV/bin:$PATH"

          command -v mesa_clc

          mesa_clc --help >/dev/null

          echo "mesa_clc:"
          command -v mesa_clc

      # ============================================================
      # 11. Prepare Mesa dependencies
      # ============================================================
      - name: Prepare Mesa dependencies
        run: |
          set -eux

          cd "$MESA_DIR"

          rm -f subprojects/libarchive.wrap

          echo "Mesa subproject files:"
          find subprojects \
            -maxdepth 1 \
            -type f \
            -print \
            | sort \
            | head -100

      # ============================================================
      # 12. Create Android cross file
      # ============================================================
      - name: Create Android cross file
        run: |
          set -eux

          cat > "$WORK_ROOT/android-aarch64.txt" <<EOF
          [binaries]
          c = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          ranlib = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
          ld = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [properties]
          needs_exe_wrapper = true
          sys_root = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          cat "$WORK_ROOT/android-aarch64.txt"

      # ============================================================
      # 13. Create native Meson file
      # ============================================================
      - name: Create native Meson file
        run: |
          set -eux

          cat > "$WORK_ROOT/native.txt" <<EOF
          [binaries]
          c = '/usr/bin/clang'
          cpp = '/usr/bin/clang++'
          ar = '/usr/bin/llvm-ar'
          strip = '/usr/bin/llvm-strip'
          ranlib = '/usr/bin/llvm-ranlib'
          pkg-config = '/usr/bin/pkg-config'
          python = '$MESON_VENV/bin/python'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

          cat "$WORK_ROOT/native.txt"

      # ============================================================
      # 14. Configure Mesa Android
      # ============================================================
      - name: Configure Mesa
        run: |
          set -eux

          cd "$MESA_DIR"

          rm -rf build
          rm -rf "$MESA_INSTALL_DIR"

          mkdir -p "$MESA_INSTALL_DIR"

          export PATH="$MESA_COMPILER_DIR/bin:$MESON_VENV/bin:$PATH"

          command -v python
          command -v meson
          command -v mesa_clc

          python --version
          meson --version
          mesa_clc --help >/dev/null

          "$MESON_VENV/bin/meson" setup \
            build \
            --cross-file "$WORK_ROOT/android-aarch64.txt" \
            --native-file "$WORK_ROOT/native.txt" \
            --prefix "$MESA_INSTALL_DIR" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version="$ANDROID_API" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Degl-lib-suffix=_mesa \
            -Dgles-lib-suffix=_mesa \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dspirv-tools=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dshader-cache=disabled \
            -Dbuild-tests=false

      # ============================================================
      # 15. Show Mesa configuration summary
      # ============================================================
      - name: Show Mesa configuration
        run: |
          set -eux

          cd "$MESA_DIR"

          "$MESON_VENV/bin/meson" configure build

      # ============================================================
      # 16. Build Mesa
      # ============================================================
      - name: Build Mesa
        run: |
          set -eux

          cd "$MESA_DIR"

          export PATH="$MESA_COMPILER_DIR/bin:$MESON_VENV/bin:$PATH"

          "$MESON_VENV/bin/meson" compile \
            -C build \
            -j "$(nproc)"

      # ============================================================
      # 17. Install Mesa
      # ============================================================
      - name: Install Mesa
        run: |
          set -eux

          cd "$MESA_DIR"

          "$MESON_VENV/bin/meson" install \
            -C build

          echo "================================================"
          echo "Installed Mesa files"
          echo "================================================"

          find "$MESA_INSTALL_DIR" \
            -type f \
            -print \
            | sort

      # ============================================================
      # 18. Inspect important Mesa libraries
      # ============================================================
      - name: Inspect Mesa libraries
        run: |
          set -eux

          echo "================================================"
          echo "Turnip"
          echo "================================================"

          find "$MESA_INSTALL_DIR" \
            -type f \
            -name 'libvulkan_freedreno.so' \
            -print

          echo "================================================"
          echo "Gallium / Zink"
          echo "================================================"

          find "$MESA_INSTALL_DIR" \
            -type f \
            -name 'libgallium_dri.so' \
            -print

          echo "================================================"
          echo "EGL"
          echo "================================================"

          find "$MESA_INSTALL_DIR" \
            -type f \
            -name 'libEGL_mesa.so' \
            -print

          echo "================================================"
          echo "GLES"
          echo "================================================"

          find "$MESA_INSTALL_DIR" \
            -type f \
            -name 'libGLESv2_mesa.so' \
            -print

          echo "================================================"
          echo "Architecture"
          echo "================================================"

          while IFS= read -r f; do
            echo "------------------------------------------------"
            echo "$f"
            file "$f"
          done < <(
            find "$MESA_INSTALL_DIR" \
              -type f \
              \( \
                -name 'libvulkan_freedreno.so' \
                -o -name 'libgallium_dri.so' \
                -o -name 'libEGL_mesa.so' \
                -o -name 'libGLESv2_mesa.so' \
              \)
          )

      # ============================================================
      # 19. Prepare renderer jniLibs
      # ============================================================
      - name: Prepare renderer plugin libraries
        run: |
          set -eux

          LIB_DIR="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          rm -rf "$LIB_DIR"
          mkdir -p "$LIB_DIR"

          cp \
            "$MESA_INSTALL_DIR/lib/libvulkan_freedreno.so" \
            "$LIB_DIR/libvulkan_freedreno.so"

          cp \
            "$MESA_INSTALL_DIR/lib/libEGL_mesa.so" \
            "$LIB_DIR/libEGL_mesa.so"

          if [ -f "$MESA_INSTALL_DIR/lib/libGLESv2_mesa.so" ]; then
            cp \
              "$MESA_INSTALL_DIR/lib/libGLESv2_mesa.so" \
              "$LIB_DIR/libGLESv2_mesa.so"
          fi

          cp \
            "$MESA_INSTALL_DIR/lib/libgallium_dri.so" \
            "$LIB_DIR/libzink_dri.so"

          for f in \
            libglapi.so \
            libexpat.so \
            libxml2.so \
            libarchive.so
          do
            if [ -f "$MESA_INSTALL_DIR/lib/$f" ]; then
              cp \
                "$MESA_INSTALL_DIR/lib/$f" \
                "$LIB_DIR/$f"
            fi
          done

          echo "================================================"
          echo "Mesa renderer libraries"
          echo "================================================"

          ls -lah "$LIB_DIR"

      # ============================================================
      # 20. Import IronizedZink shim
      # ============================================================
      - name: Import IronizedZink compatibility shim
        run: |
          set -eux

          LIB_DIR="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"
          TMP_DIR="$RUNNER_TEMP/IronizedZink"

          rm -rf "$TMP_DIR"

          git clone \
            --depth=1 \
            https://github.com/GoyDevv/IronizedZink.git \
            "$TMP_DIR"

          echo "================================================"
          echo "Searching IronizedZink libraries"
          echo "================================================"

          find "$TMP_DIR" \
            -type f \
            \( \
              -name 'libglxshim.so' \
              -o -name 'libcutils.so' \
              -o -name 'libironized_zink.so' \
            \) \
            -print

          SRC="$(find "$TMP_DIR" \
            -path '*arm64-v8a*' \
            -type f \
            -name 'libglxshim.so' \
            -print -quit || true)"

          if [ -n "$SRC" ]; then
            cp "$SRC" "$LIB_DIR/libglxshim.so"
          else
            echo "ERROR: libglxshim.so not found"
            exit 1
          fi

          SRC="$(find "$TMP_DIR" \
            -path '*arm64-v8a*' \
            -type f \
            -name 'libcutils.so' \
            -print -quit || true)"

          if [ -n "$SRC" ]; then
            cp "$SRC" "$LIB_DIR/libcutils.so"
          fi

          SRC="$(find "$TMP_DIR" \
            -path '*arm64-v8a*' \
            -type f \
            -name 'libironized_zink.so' \
            -print -quit || true)"

          if [ -n "$SRC" ]; then
            cp "$SRC" "$LIB_DIR/libironized_zink.so"
          fi

          echo "================================================"
          echo "IronizedZink libraries"
          echo "================================================"

          ls -lah "$LIB_DIR"

      # ============================================================
      # 21. Add Android libc++ runtime
      # ============================================================
      - name: Add Android libc++ runtime
        run: |
          set -eux

          LIB_DIR="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          CXX_LIB="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          if [ ! -f "$CXX_LIB" ]; then
            echo "ERROR: libc++_shared.so not found:"
            echo "$CXX_LIB"
            exit 1
          fi

          cp \
            "$CXX_LIB" \
            "$LIB_DIR/libc++_shared.so"

          file "$LIB_DIR/libc++_shared.so"
          ls -lh "$LIB_DIR/libc++_shared.so"

      # ============================================================
      # 22. Verify final native libraries
      # ============================================================
      - name: Verify renderer libraries
        run: |
          set -eux

          LIB_DIR="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          REQUIRED_LIBS="
          libvulkan_freedreno.so
          libEGL_mesa.so
          libzink_dri.so
          libc++_shared.so
          libglxshim.so
          "

          for lib in $REQUIRED_LIBS; do
            test -f "$LIB_DIR/$lib"
            echo "OK: $lib"
          done

          echo
          echo "================================================"
          echo "Final arm64-v8a library directory"
          echo "================================================"

          ls -lah "$LIB_DIR"

      # ============================================================
      # 23. Set renderer version
      # ============================================================
      - name: Set renderer version
        run: |
          set -eux

          GRADLE_FILE="$WORK_ROOT/RendererPlugin-v2/app/build.gradle"

          test -f "$GRADLE_FILE"

          sed -i \
            's/versionCode[[:space:]]\+[0-9]\+/versionCode 463/' \
            "$GRADLE_FILE" || true

          sed -i \
            's/versionName[[:space:]]\+["'\''][^"'\'']*["'\'']/versionName "0.46.3"/' \
            "$GRADLE_FILE" || true

          echo "================================================"
          echo "Renderer version"
          echo "================================================"

          grep -nE \
            'versionCode|versionName' \
            "$GRADLE_FILE" || true

      # ============================================================
      # 24. Build APK
      # ============================================================
      - name: Build renderer APK
        working-directory: RendererPlugin-v2
        run: |
          set -eux

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 25. Verify APK
      # ============================================================
      - name: Verify APK
        run: |
          set -eux

          APK="$(find \
            "$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print \
            -quit)"

          test -n "$APK"
          test -f "$APK"

          echo "================================================"
          echo "APK"
          echo "================================================"

          ls -lh "$APK"
          file "$APK"

          echo
          echo "APK SHA256:"
          sha256sum "$APK"

      # ============================================================
      # 26. Upload APK artifact
      # ============================================================
      - name: Upload renderer APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-APK
          path: RendererPlugin-v2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      # ============================================================
      # 27. Build summary
      # ============================================================
      - name: Build summary
        if: always()
        run: |
          {
            echo "# MyTurnipZink 0.46.3"
            echo
            echo "## Build configuration"
            echo
            echo "- Mesa commit: \`$MESA_COMMIT\`"
            echo "- Mesa branch generation: 26.3.0-devel"
            echo "- Android API: $ANDROID_API"
            echo "- Android NDK: $ANDROID_NDK_VERSION"
            echo "- Architecture: arm64-v8a"
            echo "- Vulkan: Freedreno / Turnip"
            echo "- OpenGL: Zink"
            echo "- Renderer: OpenGL 4.6 via Zink/Kopper"
            echo "- Target GPU: Adreno 618"
            echo
            echo "## Python build environment"
            echo
            echo "- Meson: isolated virtualenv"
            echo "- Mako: isolated virtualenv"
            echo
            echo "## Result"
            echo

            APK_DIR="$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug"

            if compgen -G "$APK_DIR/*.apk" > /dev/null; then
              echo "- APK: generated successfully"
              ls -lh "$APK_DIR"/*.apk
            else
              echo "- APK: not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
