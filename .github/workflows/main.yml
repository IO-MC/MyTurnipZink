name: Build MyTurnipZink

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MESA_REF: mesa-26.2.3
  MESA_VERSION: "26.2.3"
  MESA_SHA256: "1628058a8d2c0615975de5a15ab7bbb9638c50000b5bed9456ff423ea034a81f"

  ANDROID_API: 33
  ANDROID_NDK_VERSION: 28.2.13676358

  TURNIP_ANDROID_API: 30
  TURNIP_NDK_VERSION: 30.0.14904198

  WORK_ROOT: ${{ github.workspace }}
  MESA_DIR: ${{ github.workspace }}/mesa
  MESA_COMPILER_DIR: ${{ github.workspace }}/mesa-compiler
  MESA_INSTALL_DIR: ${{ github.workspace }}/install
  TURNIP_INSTALL_DIR: ${{ github.workspace }}/turnip-install
  MESON_VENV: ${{ github.workspace }}/meson-venv

jobs:
  build:
    name: Build Mesa Zink + Turnip APK + RendererPlugin
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # BASIC BUILD ENVIRONMENT
      # ============================================================

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            llvm-dev \
            libclang-18-dev \
            pkg-config \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            bison \
            flex \
            gettext \
            libdrm-dev \
            libexpat1-dev \
            libelf-dev \
            libxml2-dev \
            libarchive-dev \
            ninja-build \
            cmake \
            spirv-headers \
            spirv-tools \
            glslang-tools \
            unzip \
            zip \
            wget \
            curl \
            git

          rm -rf "$MESON_VENV"

          python3 -m venv "$MESON_VENV"

          "$MESON_VENV/bin/python" -m pip install --upgrade pip

          "$MESON_VENV/bin/python" -m pip install \
            "meson>=1.4,<2.0" \
            "mako>=1.2" \
            PyYAML \
            packaging

          echo "$MESON_VENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$MESON_VENV" >> "$GITHUB_ENV"
          echo "PATH=$MESON_VENV/bin:$PATH" >> "$GITHUB_ENV"

      - name: Verify shader tools
        run: |
          set -eux

          command -v glslangValidator
          glslangValidator --version

          command -v spirv-as
          spirv-as --version

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # ANDROID SDK / NDK
      # ============================================================

      - name: Setup Android SDK
        run: |
          set -eux

          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -u+x | head -n1 || true)"

          test -n "$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "ndk;${TURNIP_NDK_VERSION}" \
            "ndk;27.3.13750724"

      - name: Export Android NDK environment
        run: |
          set -eux

          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          TURNIP_NDK_HOME="$ANDROID_HOME/ndk/$TURNIP_NDK_VERSION"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "TURNIP_NDK_HOME=$TURNIP_NDK_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -eux

          /usr/bin/llvm-config --version
          "$MESON_VENV/bin/meson" --version
          ninja --version
          clang --version | head -n1
          java -version

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" \
            --version | head -n1

          "$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${TURNIP_ANDROID_API}-clang" \
            --version | head -n1

      # ============================================================
      # MESA
      # ============================================================

      - name: Clone Mesa
        run: |
          set -eux

          rm -rf "$MESA_DIR"

          git clone --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            "$MESA_DIR"

          cd "$MESA_DIR"

          git rev-parse HEAD

          VERSION="$(tr -d '\r\n' < VERSION)"

          test "$VERSION" = "$MESA_VERSION"

          echo "MESA_VERSION=$VERSION" >> "$GITHUB_ENV"

          curl -L --fail --silent --show-error \
            -o /tmp/mesa.tar.xz \
            "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"

          echo "${MESA_SHA256}  /tmp/mesa.tar.xz" | sha256sum -c

      - name: Build SPIR-V LLVM Translator
        run: |
          set -eux

          T="$WORK_ROOT/SPIRV-LLVM-Translator"
          B="$WORK_ROOT/spirv-llvm-translator-build"
          H="$WORK_ROOT/SPIRV-Headers"

          rm -rf "$T" "$B" "$H"

          git clone --depth 1 --branch llvm_release_180 \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git \
            "$T"

          git clone --depth 1 \
            https://github.com/KhronosGroup/SPIRV-Headers.git \
            "$H"

          cmake -S "$T" -B "$B" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF \
            -DLLVM_SPIRV_BUILD_EXTERNAL=ON \
            -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR="$H"

          cmake --build "$B" \
            --target llvm-spirv \
            -j"$(nproc)"

          sudo cmake --install "$B"

          echo "/usr/local/lib" | \
            sudo tee /etc/ld.so.conf.d/llvm-spirv.conf >/dev/null

          sudo ldconfig

          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
            >> "$GITHUB_ENV"

          test -x /usr/local/bin/llvm-spirv
          test -f /usr/local/lib/pkgconfig/LLVMSPIRVLib.pc

          pkg-config --modversion LLVMSPIRVLib

      - name: Prepare Mesa native compiler
        run: |
          set -eux

          rm -rf "$MESA_COMPILER_DIR"

          HOST_PATH="$(printf '%s' "$PATH" | tr ':' '\n' \
            | grep -v "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            | paste -sd: -)"

          export PATH="$HOST_PATH"
          export LLVM_CONFIG=/usr/bin/llvm-config

          "$MESON_VENV/bin/meson" setup \
            "$MESA_COMPILER_DIR" \
            "$MESA_DIR" \
            --prefix="$MESA_COMPILER_DIR/install" \
            --buildtype=release \
            --strip \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dllvm=enabled \
            -Dbuild-tests=false

          "$MESON_VENV/bin/meson" compile \
            -C "$MESA_COMPILER_DIR" \
            -j"$(nproc)"

          "$MESON_VENV/bin/meson" install \
            -C "$MESA_COMPILER_DIR"

          echo "$MESA_COMPILER_DIR/install/bin" >> "$GITHUB_PATH"

      - name: Prepare Mesa Android dependencies
        run: |
          set -eux

          rm -f "$MESA_DIR/subprojects/libarchive.wrap"

          python3 - <<'PYCODE'
          from pathlib import Path

          p = Path("mesa/meson.build")
          s = p.read_text()

          old = """dep_elf = dependency('libelf', required : false)
          if not with_platform_windows and not dep_elf.found()
            dep_elf = cc.find_library('elf', required : false)
          endif
          """

          if old not in s:
              raise SystemExit(
                  "Expected Mesa libelf detection block was not found"
              )

          p.write_text(
              s.replace(
                  old,
                  "dep_elf = null_dep\n",
                  1
              )
          )
          PYCODE

          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          p = Path("mesa/meson.build")
          s = p.read_text()

          pat = re.compile(
              r"dep_zlib\s*=\s*dependency\(\s*'zlib'.*?"
              r"required\s*:\s*get_option\('zlib'\)\s*,?\s*\)"
              r"\s*if\s+dep_zlib\.found\(\)\s*pre_args\s*\+=\s*'-DHAVE_ZLIB'\s*endif",
              re.DOTALL,
          )

          rep = """if with_platform_android
            dep_zlib = cc.find_library('z', required : get_option('zlib'))
          else
            dep_zlib = dependency(
              'zlib',
              version : '>= 1.2.3',
              allow_fallback: true,
              required : get_option('zlib')
            )
          endif
          if dep_zlib.found()
            pre_args += '-DHAVE_ZLIB'
          endif"""

          s, n = pat.subn(rep, s, count=1)

          if n != 1:
              raise SystemExit(
                  "Expected Mesa zlib detection block was not found"
              )

          p.write_text(s)
          PYCODE

      - name: Create Mesa cross files
        run: |
          set -eux

          cat > "$WORK_ROOT/android-aarch64.txt" <<EOF
          [binaries]
          c = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          ranlib = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
          ld = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          cat > "$WORK_ROOT/native.txt" <<EOF
          [binaries]
          c = '/usr/bin/clang'
          cpp = '/usr/bin/clang++'
          ar = '/usr/bin/llvm-ar'
          strip = '/usr/bin/llvm-strip'
          ranlib = '/usr/bin/llvm-ranlib'
          ld = '/usr/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'
          python = '$MESON_VENV/bin/python'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

          cat > "$WORK_ROOT/android-turnip-aarch64.txt" <<EOF
          [binaries]
          c = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${TURNIP_ANDROID_API}-clang'
          cpp = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${TURNIP_ANDROID_API}-clang++'
          ar = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          ranlib = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
          ld = '$TURNIP_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Configure Mesa Zink/Kopper + Turnip
        working-directory: ${{ env.MESA_DIR }}
        run: |
          set -eux

          rm -rf build

          "$MESON_VENV/bin/meson" setup build \
            --cross-file "$WORK_ROOT/android-aarch64.txt" \
            --native-file "$WORK_ROOT/native.txt" \
            --prefix "$MESA_INSTALL_DIR" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version="$ANDROID_API" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Degl-lib-suffix=_mesa \
            -Dgles-lib-suffix=_mesa \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dspirv-tools=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dshader-cache=disabled \
            -Dbuild-tests=false

      - name: Build and install Mesa Zink/Kopper
        working-directory: ${{ env.MESA_DIR }}
        run: |
          set -eux

          "$MESON_VENV/bin/meson" compile \
            -C build \
            -j"$(nproc)"

          "$MESON_VENV/bin/meson" install \
            -C build

          find "$MESA_INSTALL_DIR" \
            \( \
              -name 'libgallium_dri.so' \
              -o -name 'libEGL_mesa.so' \
              -o -name 'libvulkan_freedreno.so' \
            \) \
            -type f \
            -exec file {} \;

      # ============================================================
      # TURNIP
      # ============================================================

      - name: Configure standalone Turnip
        working-directory: ${{ env.MESA_DIR }}
        run: |
          set -eux

          rm -rf turnip-build "$TURNIP_INSTALL_DIR"

          "$MESON_VENV/bin/meson" setup turnip-build \
            --cross-file "$WORK_ROOT/android-turnip-aarch64.txt" \
            --native-file "$WORK_ROOT/native.txt" \
            --prefix "$TURNIP_INSTALL_DIR" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version="$TURNIP_ANDROID_API" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgles2=disabled \
            -Dgles1=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-beta=true \
            -Dllvm=disabled \
            -Ddraw-use-llvm=false \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dspirv-tools=disabled \
            -Dshared-glapi=disabled \
            -Dzstd=disabled \
            -Dzlib=enabled \
            -Dshader-cache=disabled \
            -Dbuild-tests=false \
            -Db_lto=false \
            -Dcpp_rtti=false \
            -Dcpp_link_args="-static-libstdc++"

      - name: Build and install standalone Turnip
        working-directory: ${{ env.MESA_DIR }}
        run: |
          set -eux

          "$MESON_VENV/bin/meson" compile \
            -C turnip-build \
            -j"$(nproc)"

          "$MESON_VENV/bin/meson" install \
            -C turnip-build

          TURNIP_SO="$(find "$TURNIP_INSTALL_DIR" \
            -type f \
            -name 'libvulkan_freedreno.so' \
            | head -n1 || true)"

          test -n "$TURNIP_SO"

          file "$TURNIP_SO"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h "$TURNIP_SO" \
            | grep -E 'Class:.*ELF64|Machine:.*AArch64'

          echo "TURNIP_SO=$TURNIP_SO" >> "$GITHUB_ENV"

      # ============================================================
      # RENDERER PLUGIN
      # ============================================================

      - name: Clone RendererPlugin-v2
        run: |
          set -eux

          R="$WORK_ROOT/RendererPlugin-v2"

          rm -rf "$R"

          git clone --depth 1 \
            https://github.com/ZalithLauncher/RendererPlugin-v2.git \
            "$R"

          cd "$R"

          git checkout \
            1591ff84c3ddda0c95ae1e72ef1f6608cb331b7d

          git rev-parse HEAD

          test -f gradlew
          test -f app/build.gradle.kts

      - name: Prepare renderer native libraries
        run: |
          set -eux

          J="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          rm -rf "$J"
          mkdir -p "$J"

          EGL_LIB="$(find "$MESA_INSTALL_DIR" \
            -type f \
            -name 'libEGL_mesa.so' \
            | head -n1 || true)"

          GALLIUM_LIB="$(find "$MESA_INSTALL_DIR" \
            -type f \
            -name 'libgallium_dri.so' \
            | head -n1 || true)"

          test -n "$EGL_LIB"
          test -n "$GALLIUM_LIB"

          cp "$EGL_LIB" "$J/libEGL_mesa.so"
          cp "$GALLIUM_LIB" "$J/libgallium_dri.so"

          # Keep both names.
          cp "$GALLIUM_LIB" "$J/libzink_dri.so"

          GLAPI_SHARED="$(find "$MESA_INSTALL_DIR" \
            -type f \
            \( \
              -name 'libglapi.so' \
              -o -name 'libglapi.so.*' \
            \) \
            | sort \
            | head -n1 || true)"

          if [ -n "$GLAPI_SHARED" ]; then
            cp "$GLAPI_SHARED" "$J/libglapi.so"
          else
            GLAPI_ARCHIVE="$(find \
              "$MESA_DIR/build" \
              "$MESA_INSTALL_DIR" \
              -type f \
              -name 'libglapi.a' \
              2>/dev/null \
              | sort \
              | head -n1 || true)"

            test -n "$GLAPI_ARCHIVE"

            API_CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"

            "$API_CLANG" \
              -shared \
              -fuse-ld=lld \
              -Wl,-soname,libglapi.so \
              -Wl,--whole-archive \
              "$GLAPI_ARCHIVE" \
              -Wl,--no-whole-archive \
              -o "$WORK_ROOT/libglapi.so"

            cp "$WORK_ROOT/libglapi.so" "$J/libglapi.so"
          fi

          I="$WORK_ROOT/IronizedZink"

          rm -rf "$I"

          git clone --depth 1 \
            https://github.com/GoyDevv/IronizedZink.git \
            "$I"

          GLXSHIM="$(find "$I" \
            -type f \
            -path '*/app/src/main/jniLibs/arm64-v8a/libglxshim.so' \
            | head -n1 || true)"

          CUTILS="$(find "$I" \
            -type f \
            -path '*/app/src/main/jniLibs/arm64-v8a/libcutils.so' \
            | head -n1 || true)"

          test -n "$GLXSHIM"
          test -n "$CUTILS"

          cp "$GLXSHIM" "$J/libglxshim.so"
          cp "$CUTILS" "$J/libcutils.so"

          echo "=== Renderer native libraries ==="

          ls -lh \
            "$J/libEGL_mesa.so" \
            "$J/libgallium_dri.so" \
            "$J/libzink_dri.so" \
            "$J/libglapi.so" \
            "$J/libglxshim.so" \
            "$J/libcutils.so"

          cmp \
            "$J/libgallium_dri.so" \
            "$J/libzink_dri.so"

      - name: Add Android libc++ runtime
        run: |
          set -eux

          J="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          CXX="$(find "$ANDROID_NDK_HOME" \
            -type f \
            -path '*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so' \
            | head -n1 || true)"

          test -n "$CXX"

          cp "$CXX" "$J/libc++_shared.so"

      - name: Verify renderer ELF dependencies
        run: |
          set -eux

          J="$WORK_ROOT/RendererPlugin-v2/app/src/main/jniLibs/arm64-v8a"

          READ_ELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"

          for lib in \
            libglxshim.so \
            libglapi.so \
            libc++_shared.so \
            libcutils.so \
            libgallium_dri.so \
            libzink_dri.so \
            libEGL_mesa.so
          do
            test -s "$J/$lib"

            "$READ_ELF" -h "$J/$lib" \
              | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          done

          echo "=== Mesa EGL dependencies ==="

          "$READ_ELF" -d "$J/libEGL_mesa.so" \
            | grep -E 'NEEDED|SONAME' || true

          echo "=== Gallium dependencies ==="

          "$READ_ELF" -d "$J/libgallium_dri.so" \
            | grep -E 'NEEDED|SONAME' || true

          echo "=== GLXShim dependencies ==="

          "$READ_ELF" -d "$J/libglxshim.so" \
            | grep -E 'NEEDED|SONAME' || true

          echo "=== GLAPI exports ==="

          "$NM" -D "$J/libglapi.so" \
            | grep -E \
              '_mesa_glapi_get_proc_address|_mesa_glapi_tls_Dispatch' \
            || true

          echo "=== GLXShim strings ==="

          strings "$J/libglxshim.so" \
            | grep -E \
              'POJAVEXEC_EGL|LIBEGL_NAME|SDL_EGL_LIBRARY|context init failed|eglGetProcAddress' \
            || true

      # ============================================================
      # IMPORTANT:
      # Use the REAL RendererPlugin-v2 DSL.
      #
      # The actual renderer() signature is:
      #
      # renderer(
      #   displayName,
      #   rendererId,
      #   rendererGLPath,
      #   rendererEGLPath,
      #   dlopenLibPaths,
      #   env,
      #   minMCVer,
      #   maxMCVer
      # )
      #
      # ============================================================

      - name: Configure renderer as Mesa Zink/Kopper
        working-directory: ${{ env.WORK_ROOT }}/RendererPlugin-v2
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          # ----------------------------------------------------------
          # Renderer configuration.
          # ----------------------------------------------------------

          renderer_config = r'''            // New renderer configuration.
            resValue("string", "config", buildJsonValue {
                renderer(
                    displayName = "MyTurnipZink | Mesa Zink 26.2.3",
                    rendererId = "myturnipzink",
                    rendererGLPath = nativePath("libglxshim.so"),
                    rendererEGLPath = nativePath("libEGL_mesa.so"),
                    dlopenLibPaths = listOf(
                        nativePath("libcutils.so"),
                        nativePath("libglapi.so"),
                        nativePath("libc++_shared.so"),
                        nativePath("libgallium_dri.so"),
                        nativePath("libzink_dri.so"),
                    ),
                    env = buildEnvs {
                        normal("LIBGL_ES", "3")
                        normal("LIBGL_NAME", nativePath("libglxshim.so"))
                        normal("LIBEGL_NAME", nativePath("libEGL_mesa.so"))
                        normal("POJAVEXEC_EGL", nativePath("libEGL_mesa.so"))
                        normal("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                    },
                    minMCVer = null,
                    maxMCVer = null,
                )
            })
          '''

          # Replace the entire new-architecture resValue block.
          pattern = re.compile(
              r'            resValue\("string",\s*"config",\s*buildJsonValue\s*\{.*?\n            \}\)',
              re.DOTALL,
          )

          text, count = pattern.subn(
              renderer_config.rstrip(),
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one renderer config block, found {count}"
              )

          # ----------------------------------------------------------
          # App name / version.
          # ----------------------------------------------------------

          text, count = re.subn(
              r'resValue\("string","app_name","[^"]*"\)',
              'resValue("string","app_name","MyTurnipZink")',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not update app_name"
              )

          text, count = re.subn(
              r'versionCode\s*=\s*\d+',
              'versionCode = 26203',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not update versionCode"
              )

          text, count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "26.2.3-zink"',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not update versionName"
              )

          # ----------------------------------------------------------
          # Legacy renderer manifest.
          #
          # Keep this because older Zalith/FCL discovery paths may
          # still read the legacy metadata.
          # ----------------------------------------------------------

          legacy = r'''            manifestPlaceholders.putAll(legacyManifest {
                displayName  = "MyTurnipZink | Mesa Zink 26.2.3"
                rendererName = "MyTurnipZink | Mesa Zink 26.2.3"
                rendererLib  = "libglxshim.so"
                eglLib       = "/libEGL_mesa.so"
                minMCVer     = ""
                maxMCVer     = ""

                boatEnv {
                    put("LIBGL_ES", "3")
                    put("POJAV_RENDERER", "opengles3_desktopgl_zink_kopper")
                    put("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                }

                pojavEnv {
                    put("LIBGL_ES", "3")
                    put("POJAV_RENDERER", "opengles3_desktopgl_zink_kopper")
                    put("MESA_LOADER_DRIVER_OVERRIDE", "zink")
                }
            })
          '''

          legacy_pattern = re.compile(
              r'            manifestPlaceholders\.putAll\(legacyManifest\s*\{.*?\n            \}\)',
              re.DOTALL,
          )

          text, count = legacy_pattern.subn(
              legacy.rstrip(),
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one legacyManifest block, found {count}"
              )

          path.write_text(text)

          # ----------------------------------------------------------
          # Final sanity checks.
          # ----------------------------------------------------------

          required = [
              'displayName = "MyTurnipZink | Mesa Zink 26.2.3"',
              'rendererId = "myturnipzink"',
              'rendererGLPath = nativePath("libglxshim.so")',
              'rendererEGLPath = nativePath("libEGL_mesa.so")',
              'nativePath("libcutils.so")',
              'nativePath("libglapi.so")',
              'nativePath("libgallium_dri.so")',
              'nativePath("libzink_dri.so")',
              'normal("LIBEGL_NAME", nativePath("libEGL_mesa.so"))',
              'normal("POJAVEXEC_EGL", nativePath("libEGL_mesa.so"))',
              'normal("MESA_LOADER_DRIVER_OVERRIDE", "zink")',
              'minMCVer = null',
              'maxMCVer = null',
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      f"Missing renderer DSL entry: {item}"
                  )

          if text.count('resValue("string", "config", buildJsonValue {') != 1:
              raise SystemExit(
                  "Renderer config block count is not exactly 1"
              )

          print("RendererPlugin-v2 DSL configuration OK.")
          PY

          echo "=== Renderer DSL ==="

          grep -nE \
            'resValue.*config|displayName|rendererId|rendererGLPath|rendererEGLPath|dlopenLibPaths|libcutils|libglapi|libgallium|libzink|LIBGL_ES|LIBGL_NAME|LIBEGL_NAME|POJAVEXEC_EGL|MESA_LOADER_DRIVER_OVERRIDE|minMCVer|maxMCVer' \
            app/build.gradle.kts

          echo
          echo "=== Validate Kotlin DSL syntax markers ==="

          grep -q \
            'rendererId = "myturnipzink"' \
            app/build.gradle.kts

          grep -q \
            'rendererGLPath = nativePath("libglxshim.so")' \
            app/build.gradle.kts

          grep -q \
            'rendererEGLPath = nativePath("libEGL_mesa.so")' \
            app/build.gradle.kts

      - name: Build renderer APK
        working-directory: ${{ env.WORK_ROOT }}/RendererPlugin-v2
        run: |
          set -eux

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify final renderer APK
        run: |
          set -eux

          D="$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug"

          APK="$(find "$D" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1 || true)"

          test -n "$APK"
          test -s "$APK"

          echo "=== Renderer APK ==="

          ls -lh "$APK"
          sha256sum "$APK"

          echo "=== Native libraries ==="

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/' \
            | sort

          for lib in \
            libglxshim.so \
            libglapi.so \
            libc++_shared.so \
            libcutils.so \
            libgallium_dri.so \
            libzink_dri.so \
            libEGL_mesa.so
          do
            unzip -l "$APK" \
              | grep -q "lib/arm64-v8a/$lib$" \
              || {
                echo "Missing $lib in renderer APK"
                exit 1
              }
          done

          echo "Renderer APK verification OK."

      # ============================================================
      # TURNIP APK
      # ============================================================

      - name: Clone NativeLibPlugin for Turnip APK
        run: |
          set -eux

          T="$WORK_ROOT/NativeLibPlugin"

          rm -rf "$T"

          git clone --depth 1 \
            https://github.com/ZalithLauncher/NativeLibPlugin.git \
            "$T"

          cd "$T"

          git rev-parse HEAD

          test -f gradlew
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Prepare Turnip NativeLibPlugin APK
        run: |
          set -eux

          T="$WORK_ROOT/NativeLibPlugin"
          J="$T/app/src/main/jniLibs/arm64-v8a"

          TURNIP_SO="${TURNIP_SO:-}"

          if [ -z "$TURNIP_SO" ]; then
            TURNIP_SO="$(find "$TURNIP_INSTALL_DIR" \
              -type f \
              -name 'libvulkan_freedreno.so' \
              | head -n1 || true)"
          fi

          test -n "$TURNIP_SO"
          test -s "$TURNIP_SO"

          rm -rf "$J"
          mkdir -p "$J"

          cp \
            "$TURNIP_SO" \
            "$J/libvulkan_freedreno.so"

          echo "=== Turnip native library ==="

          ls -lh "$J/libvulkan_freedreno.so"

          file "$J/libvulkan_freedreno.so"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h "$J/libvulkan_freedreno.so" \
            | grep -E \
              'Class:.*ELF64|Machine:.*AArch64'

      - name: Configure Turnip NativeLibPlugin
        shell: bash
        run: |
          set -eux

          PLUGIN_DIR="$WORK_ROOT/NativeLibPlugin"

          BUILD_FILE="$PLUGIN_DIR/app/build.gradle.kts"
          MANIFEST_FILE="$PLUGIN_DIR/app/src/main/AndroidManifest.xml"

          python3 - "$BUILD_FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          text, n = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.iomc.myturnipzink.turnip"',
              text,
              count=1,
          )

          if n != 1:
              raise SystemExit("applicationId not found")

          text, n = re.subn(
              r'versionCode\s*=\s*\d+',
              'versionCode = 26203',
              text,
              count=1,
          )

          if n != 1:
              raise SystemExit("versionCode not found")

          text, n = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "26.2.3-turnip"',
              text,
              count=1,
          )

          if n != 1:
              raise SystemExit("versionName not found")

          path.write_text(text)
          PY

          python3 - "$MANIFEST_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          text = text.replace(
              'android:label="@string/app_name"',
              'android:label="MyTurnipZink Turnip 26.2.3"',
          )

          path.write_text(text)
          PY

          echo "=== Turnip Gradle ==="

          grep -nE \
            'namespace|applicationId|versionCode|versionName' \
            "$BUILD_FILE"

          echo
          echo "=== Namespace ==="

          grep -E \
            'namespace[[:space:]]*=[[:space:]]*"com\.commonlauncher\.nativeplugin"' \
            "$BUILD_FILE"

          echo
          echo "=== Application ID ==="

          grep -E \
            'applicationId[[:space:]]*=[[:space:]]*"com\.iomc\.myturnipzink\.turnip"' \
            "$BUILD_FILE"

      - name: Build Turnip APK
        working-directory: ${{ env.WORK_ROOT }}/NativeLibPlugin
        run: |
          set -eux

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify final Turnip APK
        run: |
          set -eux

          D="$WORK_ROOT/NativeLibPlugin/app/build/outputs/apk/debug"

          APK="$(find "$D" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1 || true)"

          test -n "$APK"
          test -s "$APK"

          echo "=== Turnip APK ==="

          ls -lh "$APK"
          sha256sum "$APK"

          unzip -l "$APK" \
            | grep -q \
              'lib/arm64-v8a/libvulkan_freedreno.so$'

          echo "Turnip APK verification OK."

      # ============================================================
      # RAW TURNIP ZIP
      # ============================================================

      - name: Package standalone Turnip ZIP
        run: |
          set -eux

          TURNIP_SO="${TURNIP_SO:-}"

          if [ -z "$TURNIP_SO" ]; then
            TURNIP_SO="$(find "$TURNIP_INSTALL_DIR" \
              -type f \
              -name 'libvulkan_freedreno.so' \
              | head -n1 || true)"
          fi

          test -n "$TURNIP_SO"

          rm -rf "$WORK_ROOT/turnip-driver"

          mkdir -p \
            "$WORK_ROOT/turnip-driver/arm64-v8a"

          cp \
            "$TURNIP_SO" \
            "$WORK_ROOT/turnip-driver/arm64-v8a/libvulkan_freedreno.so"

          cat > "$WORK_ROOT/turnip-driver/README.txt" <<EOF
          MyTurnipZink Turnip driver

          Mesa: ${MESA_VERSION}
          ABI: arm64-v8a
          Target: Freedreno / Adreno 618

          Native library:
            libvulkan_freedreno.so

          The installable test package is:
            MyTurnipZink-Turnip-Driver-APK
          EOF

          cd "$WORK_ROOT/turnip-driver"

          zip -r \
            "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip" \
            .

      # ============================================================
      # FINAL ARTIFACTS
      # ============================================================

      - name: Collect final APK paths
        run: |
          set -eux

          RENDERER_APK="$(find \
            "$WORK_ROOT/RendererPlugin-v2/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1)"

          TURNIP_APK="$(find \
            "$WORK_ROOT/NativeLibPlugin/app/build/outputs/apk/debug" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n1)"

          test -n "$RENDERER_APK"
          test -n "$TURNIP_APK"

          echo "RENDERER_APK=$RENDERER_APK" >> "$GITHUB_ENV"
          echo "TURNIP_APK=$TURNIP_APK" >> "$GITHUB_ENV"

          echo "=== Renderer SHA256 ==="
          sha256sum "$RENDERER_APK"

          echo "=== Turnip APK SHA256 ==="
          sha256sum "$TURNIP_APK"

          echo "=== Turnip ZIP SHA256 ==="
          sha256sum "$WORK_ROOT/MyTurnipZink-Turnip-Driver.zip"

      - name: Upload renderer APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Renderer-APK
          path: ${{ env.RENDERER_APK }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload Turnip APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Turnip-Driver-APK
          path: ${{ env.TURNIP_APK }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload standalone Turnip ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MyTurnipZink-Turnip-Driver
          path: ${{ env.WORK_ROOT }}/MyTurnipZink-Turnip-Driver.zip
          if-no-files-found: error
          retention-days: 90

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build summary
        if: always()
        run: |
          {
            echo "# MyTurnipZink Mesa 26.2.3"
            echo
            echo "## Renderer"
            echo
            echo "- Mesa EGL: libEGL_mesa.so"
            echo "- Gallium: libgallium_dri.so"
            echo "- Zink alias: libzink_dri.so"
            echo "- GLAPI: libglapi.so"
            echo "- GLXShim: libglxshim.so"
            echo "- libcutils: libcutils.so"
            echo "- libc++: libc++_shared.so"
            echo
            echo "## Renderer environment"
            echo
            echo "- LIBGL_ES=3"
            echo "- LIBGL_NAME=libglxshim.so"
            echo "- LIBEGL_NAME=libEGL_mesa.so"
            echo "- POJAVEXEC_EGL=libEGL_mesa.so"
            echo "- MESA_LOADER_DRIVER_OVERRIDE=zink"
            echo
            echo "## Turnip"
            echo
            echo "- Mesa: $MESA_VERSION"
            echo "- ABI: arm64-v8a"
            echo "- Library: libvulkan_freedreno.so"
            echo "- Package: com.iomc.myturnipzink.turnip"
            echo "- Version: 26.2.3-turnip"
            echo
            echo "## Test"
            echo
            echo "Renderer APK + Turnip APK must both be installed."
            echo
            echo "Expected:"
            echo "- Mojang logo appears"
            echo "- Minecraft reaches menu"
            echo "- F3 reports desktop OpenGL"
            echo "- Renderer reports Zink"
            echo "- No Qualcomm OpenGL ES 3.2 fallback"
          } >> "$GITHUB_STEP_SUMMARY"
